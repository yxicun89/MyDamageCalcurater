# wishlist web の配信設定(Dockerfile が /etc/nginx/conf.d/default.conf として置く)。
# 入口(Ingress)が前置 /wishlist を外してから渡す。/api と /images は api の持ち物なので、ここでは扱わない。
# pid・一時ファイルは基底イメージが /tmp 配下にしている(readOnlyRootFilesystem + emptyDir(/tmp))。

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # k8s の probe。
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ハッシュを持たないので、古い版を掴み続けないよう毎回確かめさせる。
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }
    location = /sw-strategy.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # vite build が出すハッシュ付きファイル。無ければ index.html で代用せず 404 にする。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA のフォールバック。
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
