# 全商品の目安価格を毎日 03:00 JST に更新する(apps/wishlist/CLAUDE.md §6・§11)。
# イメージは Chromium 入りの refresher 専用(wishlist/refresher。api/Dockerfile.refresher)。メルカリの headless 取得に使う。
# Chromium は /headless-shell/headless-shell(実イメージで確認)。非 root・capabilities drop ALL・seccomp RuntimeDefault では
# ユーザー名前空間のサンドボックスが使えないため、refresher が --no-sandbox を付けて起動する(コンテナが分離の境界。実サイトは夜間にこの Pod だけが開く)。
# NetworkPolicy が制限しているのは Ingress だけで、Egress は未制限(Egress の制限は共通基盤の変更になるため、docs/phase3-api-spec.md に将来の提案として記録)。
# Secret wishlist-api の yahoo-appid は任意(無ければ api 型のサイトは取得しない)。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wishlist-refresher
  labels:
    app.kubernetes.io/name: wishlist-refresher
    app.kubernetes.io/part-of: wishlist
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  # Mac が夜間スリープしていると 03:00 に起動できない。12 時間以内に起きれば、その日の分を 1 回だけ実行する
  # (600 秒では毎回飛ばされていた。2026-10-09 に確認)
  startingDeadlineSeconds: 43200
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wishlist-refresher
            app.kubernetes.io/part-of: wishlist
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: refresher
              image: wishlist/refresher:0.1.0
              imagePullPolicy: IfNotPresent
              command: ["/wishlist-refresher"]
              env:
                - name: WISHLIST_DATABASE_DSN
                  valueFrom:
                    secretKeyRef:
                      name: wishlist-api
                      key: database-dsn
                - name: WISHLIST_YAHOO_APPID
                  valueFrom:
                    secretKeyRef:
                      name: wishlist-api
                      key: yahoo-appid
                      optional: true
                - name: WISHLIST_CHROMIUM_PATH
                  value: /headless-shell/headless-shell
                # Go のヒープだけの目安(Chromium は別プロセス。コンテナ全体の上限は limits の 1Gi)。
                - name: GOMEMLIMIT
                  value: 128MiB
              resources:
                requests:
                  cpu: 10m
                  memory: 256Mi
                limits:
                  cpu: 200m
                  # Chromium を含む。/dev/shm(emptyDir Memory)もここに数えられる。
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                # readOnlyRootFilesystem のため、書ける /tmp を置く(Chromium の user-data-dir は /tmp/wishlist-chromium-*。ページごとに作り、閉じるときに消す)
                - name: tmp
                  mountPath: /tmp
                - name: shm
                  mountPath: /dev/shm
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            # Chromium の共有メモリ(既定の 64Mi は足りなくなりやすい)。
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
