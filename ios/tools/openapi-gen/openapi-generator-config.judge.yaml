# PokeCalcJudgeAPI の生成設定(ADR-0504)。生成物は ios/PokeCalcKit/Sources/PokeCalcJudgeAPI/Generated/。
# 契約は services/judge/api/openapi.yaml(サービスローカル契約。ADR-0012)。root の PokeCalcAPI とは
# 別ターゲットにする(`Client`・`Components` などの生成型名が衝突するため)。
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# judge の契約には tags が無いので filter は掛けない(ヘルスチェックも生成されるが使わない)。
