# gitops overlay の read model(ADR-0412・issue #237)。initContainer が pokedex export を emptyDir に書き、
# 本体は読み取り専用でマウントする。ConfigMap は使わない(ADR-0002)。本体には DSN を渡さない(ADR-0012 §6)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: balance
spec:
  template:
    spec:
      initContainers:
        - name: readmodel-export
          image: pokecalc/pokedex:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["export", "-out", "/etc/balance/readmodel"]
          env:
            - name: POKEDEX_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: pokedex-reader-dsn
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: readmodel
              mountPath: /etc/balance/readmodel
      containers:
        - name: balance
          env:
            - name: BALANCE_POKEMON_TYPES_PATH
              value: /etc/balance/readmodel/pokemon-types.json
            - name: BALANCE_MOVES_PATH
              value: /etc/balance/readmodel/moves.json
            - name: BALANCE_ABILITIES_PATH
              value: /etc/balance/readmodel/abilities.json
          volumeMounts:
            - name: readmodel
              mountPath: /etc/balance/readmodel
              readOnly: true
      volumes:
        - name: readmodel
          emptyDir: {}
