apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pokecalc
resources:
  - ../../base
patches:
  - path: deployment-readmodel-patch.yaml
images:
  - name: pokecalc/balance
    newName: localhost:5000/pokecalc/balance
    digest: sha256:09a57decf42ea92f92c45cd3daa4c3d21fafa9b0ae8a846f1fc3584163ac8496
  # read model を作る initContainer 用の pokedex image(ADR-0412)。digest は make pokedex-registry-push の出力で置き換える。
  # 2026-10-03 に make pokedex-registry-push で確定した実 digest。sync の前に NetworkPolicy(allow-mysql-ingress.yaml)の適用が要る(適用前に sync すると initContainer が MySQL に届かず Pod が起動しない)。
  - name: pokecalc/pokedex
    newName: localhost:5000/pokecalc/pokedex
    digest: sha256:7f485f8cf7a45aca3ba37710b818c9b7e5af60bcc6bf0cfff0841e1aacf53b20
