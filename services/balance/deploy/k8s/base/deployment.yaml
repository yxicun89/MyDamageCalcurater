apiVersion: apps/v1
kind: Deployment
metadata:
  name: balance
  labels:
    app.kubernetes.io/name: balance
    app.kubernetes.io/part-of: pokecalc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: balance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: balance
        app.kubernetes.io/part-of: pokecalc
    spec:
      automountServiceAccountToken: false
      # preStop(5秒)+ shutdownTimeout(balance/cmd/api/shutdown.go。15秒)より長い。ADR-0804・issue #324。
      terminationGracePeriodSeconds: 30
      containers:
        - name: balance
          image: pokecalc/balance:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # limits.memory の 64Mi に対して少し余裕を持たせた値(GC が OOMKill の前に働くように)。
            - name: GOMEMLIMIT
              value: 56MiB
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
