apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: balance
  labels:
    app.kubernetes.io/name: balance
    app.kubernetes.io/part-of: pokecalc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/balance
            pathType: Prefix
            backend:
              service:
                name: balance
                port:
                  name: http
