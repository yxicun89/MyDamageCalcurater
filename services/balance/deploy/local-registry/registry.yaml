apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: balance-registry
    app.kubernetes.io/part-of: pokecalc
spec:
  replicas: 1
  # hostPort 5000 は同時に1つの Pod しか持てないので、古い Pod を止めてから新しい Pod を起動する
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: balance-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: balance-registry
        app.kubernetes.io/part-of: pokecalc
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          # 2026-09-22 時点の最新の安定版(版は digest で固定。DECISIONS.md「最新の安定版」)
          image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
          ports:
            - name: registry
              containerPort: 5000
              hostPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        # 検証用。Pod が作り直されるとイメージは消える(push し直す)。
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: balance-registry
spec:
  selector:
    app.kubernetes.io/name: balance-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
