openapi: 3.0.3
info:
  title: pokecalc balance API
  version: 0.2.0
  description: |
    パーティのタイプバランスを分析する独立サービスの契約。
    TB1 は防御タイプバランス(18 攻撃タイプごとの各メンバーの倍率とチーム集計)を返す。
    契約の正は docs/adr/0014-balance-tb1-defense-analysis.md。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      summary: Pod health check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/balance/healthz:
    get:
      operationId: publicHealth
      summary: Ingress smoke check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/balance/v1/team-balance/analyze:
    post:
      operationId: analyzeTeamBalance
      summary: Analyze a party's type balance
      description: |
        Returns, for each member (request order), the defensive multiplier against all 18
        attack types (canonical order), and a per-attack-type team summary (canonical order).
        Member types are resolved from pokemonId by the service-local read model (ADR-0014).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Defensive type balance of the party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Invalid request or missing request context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 16 KiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: A pokemonId is not registered in the pokemon type read model (unknown_pokemon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon type read model is not configured (master_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - members
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
              - pokemonId
            properties:
              pokemonId:
                type: string
                maxLength: 8
                pattern: '^\d{4}-\d{3}$'
                example: 0445-000
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    ErrorCode:
      type: string
      enum:
        - missing_request_context
        - invalid_request
        - request_too_large
        - unknown_pokemon
        - master_unavailable
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required:
        - members
        - teamSummary
      properties:
        members:
          description: One entry per request member, in request order. Duplicated pokemonId values are kept.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/MemberDefense'
        teamSummary:
          description: One entry per attack type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/TeamSummaryEntry'
    MemberDefense:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - types
        - defense
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        types:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TypeId'
        defense:
          description: One entry per attack type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/DefenseEntry'
    DefenseEntry:
      type: object
      additionalProperties: false
      required:
        - attackType
        - multiplier
        - category
        - source
      properties:
        attackType:
          $ref: '#/components/schemas/TypeId'
        multiplier:
          $ref: '#/components/schemas/DefenseMultiplier'
        category:
          $ref: '#/components/schemas/DefenseCategory'
        source:
          $ref: '#/components/schemas/EffectSource'
    DefenseMultiplier:
      description: Exact display form of the defensive multiplier.
      type: string
      enum:
        - '0'
        - '1/4'
        - '1/2'
        - '1'
        - '2'
        - '4'
    DefenseCategory:
      description: 'x4: quad_weak, x2: weak, x1: neutral, x1/2: resist, x1/4: quad_resist, x0: immune.'
      type: string
      enum:
        - quad_weak
        - weak
        - neutral
        - resist
        - quad_resist
        - immune
    EffectSource:
      description: Origin of the multiplier. Always "type" in TB1; "ability" is reserved for TB3.
      type: string
      enum:
        - type
        - ability
    TeamSummaryEntry:
      description: |
        Per attack type team counts. weak = x2 and x4 members, quadWeak = x4 members (subset of weak),
        resist = x1/2 and x1/4 members (immune excluded), immune = x0 members, neutral = x1 members.
        Invariant: weak + resist + immune + neutral = number of members.
      type: object
      additionalProperties: false
      required:
        - attackType
        - weak
        - quadWeak
        - resist
        - immune
        - neutral
      properties:
        attackType:
          $ref: '#/components/schemas/TypeId'
        weak:
          type: integer
          minimum: 0
          maximum: 6
        quadWeak:
          type: integer
          minimum: 0
          maximum: 6
        resist:
          type: integer
          minimum: 0
          maximum: 6
        immune:
          type: integer
          minimum: 0
          maximum: 6
        neutral:
          type: integer
          minimum: 0
          maximum: 6
    TypeId:
      type: string
      enum:
        - normal
        - fire
        - water
        - electric
        - grass
        - ice
        - fighting
        - poison
        - ground
        - flying
        - psychic
        - bug
        - rock
        - ghost
        - dragon
        - dark
        - steel
        - fairy
