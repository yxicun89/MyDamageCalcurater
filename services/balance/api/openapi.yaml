openapi: 3.0.3
info:
  title: pokecalc balance API
  version: 0.7.0
  description: |
    パーティのタイプバランスを分析する独立サービスの契約。
    TB1 は防御タイプバランス(18 攻撃タイプごとの各メンバーの倍率とチーム集計)を返す。
    TB2 は攻撃範囲(18 防御タイプごとの各メンバーの最大倍率・有効打とチーム集計)を返す。
    TB3 は analyze のメンバーに任意の特性(abilityId)を受け取り、特性による防御相性の変化を反映する。
    TB4 は仮想敵(最大 6 体)ごとに、各メンバーが受ける最大倍率と与える最大倍率、安全に受けられる人数を返す。
    TB5 はチームの防御の穴・攻撃範囲の穴をふさげるタイプの候補と、そのタイプを持つポケモン、特性で穴をふさげるポケモンを返す。
    TB6 は技構成(技 ID 1〜4 件)そのものの攻撃範囲と、その技構成を半減以下で受けられる実在ポケモン(タイプだけ・特性ありの別枠)を返す。
    契約の正は docs/adr/0014-balance-tb1-defense-analysis.md、docs/adr/0016-balance-tb2-offense-coverage.md、
    docs/adr/0017-balance-tb3-ability-effects.md、docs/adr/0400-balance-tb4-threat-check.md、
    docs/adr/0401-balance-tb5-recommend-types.md、docs/adr/0404-balance-tb6-move-range-checker.md。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      summary: Pod health check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/balance/healthz:
    get:
      operationId: publicHealth
      summary: Ingress smoke check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/balance/v1/team-balance/analyze:
    post:
      operationId: analyzeTeamBalance
      summary: Analyze a party's type balance
      description: |
        Returns, for each member (request order), the defensive multiplier against all 18
        attack types (canonical order), and a per-attack-type team summary (canonical order).
        Member types are resolved from pokemonId by the service-local read model (ADR-0014).
        A member may name an optional abilityId; its effects (immune / absorb / type multiplier /
        super effective multiplier) are resolved by the service-local ability read model and applied
        after the type matchup (ADR-0017). Without abilityId the member is analyzed exactly as in TB1.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Defensive type balance of the party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Invalid request or missing request context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 16 KiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            A pokemonId is not registered in the pokemon type read model (unknown_pokemon), or
            an abilityId is not registered in the ability read model (unknown_ability, message
            "unknown abilityId: <ID>"). pokemonId is resolved first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The pokemon type read model is not configured, or a member names an abilityId while the
            ability read model is not configured (master_unavailable). A request without any abilityId
            does not need the ability read model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string; no internal detail is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/balance/v1/team-balance/coverage:
    post:
      operationId: analyzeTeamCoverage
      summary: Analyze a party's offensive type coverage
      description: |
        Returns, for each member (request order), the attack types of its non-status moves
        (deduplicated, canonical order) and, for each of the 18 single defense types (canonical order),
        the best multiplier and whether it is effective (x1 or more) / super effective (x2).
        The team coverage counts members, not moves. Move type and category are resolved from moveId
        by the service-local move read model (ADR-0016).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageRequest'
      responses:
        '200':
          description: Offensive type coverage of the party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
        '400':
          description: Invalid request or missing request context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 16 KiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            A pokemonId is not registered in the pokemon type read model (unknown_pokemon), or
            a moveId is not registered in the move read model (unknown_move). pokemonId is resolved first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon type read model or the move read model is not configured (master_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string; no internal detail is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/balance/v1/team-balance/threats:
    post:
      operationId: analyzeTeamThreats
      summary: Check a party against hypothetical opponents
      description: |
        For each threat (request order), returns the attack types of its non-status moves (deduplicated,
        canonical order) and, for each member (request order), the largest multiplier the member receives
        from the threat's attack moves (incoming) and the largest multiplier the member's attack moves deal
        to the threat (outgoing). Both use the type matchup and the defender's ability (ADR-0017), never
        STAB, items, power or field effects. safe = incoming < 1; superEffective = outgoing >= 2.
        safeMembers / superEffectiveMembers count those members per threat (ADR-0400).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatsRequest'
      responses:
        '200':
          description: Matchups of the party against each threat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatsResponse'
        '400':
          description: Invalid request or missing request context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 16 KiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            A pokemonId is not registered (unknown_pokemon, "unknown pokemonId: <ID>"), then a moveId
            (unknown_move, "unknown moveId: <ID>"), then an abilityId (unknown_ability, "unknown abilityId: <ID>").
            Within each kind, members are checked before threats, in request order; the first one is reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The pokemon type read model is not configured, or any entry names a moveId while the move
            read model is not configured, or any entry names an abilityId while the ability read model
            is not configured (master_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error), including a multiplier product overflow. The message is a fixed string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/balance/v1/team-balance/recommendations:
    post:
      operationId: recommendTeamTypes
      summary: Recommend types (and pokemon with them) that fill the party's holes
      description: |
        defenseHoles are the attack types (canonical order) that no member resists or is immune to
        (resist + immune = 0 in the analyze team summary, member abilities included). offenseHoles are the
        single defense types (canonical order) whose team coverage bestMultiplier is null or below x1; a party
        without any attack move (status moves do not count) has no offenseHoles. Each of the 171 defense type sets (18 single + 153 dual) is a
        candidate: defenseCovered are the defenseHoles it takes below x1 (types only, no ability),
        offenseCovered are the offenseHoles its own types hit at x1 or more, and weaknesses is the number of
        attack types that hit it at x2 or more. Candidates that fill no hole are left out. The order is
        defenseCovered + offenseCovered (descending), then weaknesses (ascending), then the canonical order
        (single types first, then dual types by their first and second type). At most `limit` (default 10)
        candidates are returned. pokemon lists, for a dual-type candidate, the pokemon whose type set equals it;
        for a single-type candidate, the pokemon that contain its type, except those whose other type no longer
        takes one of its defenseCovered below x1 (exact matches first, then pokemonId ascending; ADR-0401 §8). abilityOptions lists, per defense hole, the pokemon that one of their
        abilities (abilityIds of the read model) takes below x1 while their types alone do not; it is empty
        when the ability read model is not configured (ADR-0401).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationsRequest'
      responses:
        '200':
          description: Holes of the party and the recommended types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '400':
          description: Invalid request or missing request context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 16 KiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            A pokemonId is not registered (unknown_pokemon, "unknown pokemonId: <ID>"), then a moveId
            (unknown_move, "unknown moveId: <ID>"), then an abilityId (unknown_ability, "unknown abilityId: <ID>").
            Within each kind, members are checked in request order; the first one is reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The pokemon read model is not configured, or any member names a moveId while the move read model
            is not configured, or any member names an abilityId while the ability read model is not configured
            (master_unavailable). A missing ability read model alone only empties abilityOptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/balance/v1/move-range/analyze:
    post:
      operationId: analyzeMoveRange
      summary: Analyze the offensive range of a move set and who walls it
      description: |
        Takes one to four moveIds only (no pokemon: a move set alone decides the offensive range,
        ADR-0404 §1). Status moves do not contribute to the range; a request whose moves are all
        status moves is rejected (400 invalid_request), so the range is never empty.
        attackTypes are the types of the non-status moves (deduplicated, canonical order).
        typeChart has one entry per single defense type (canonical order) with the best multiplier
        of the move set against it, and whether that is effective (x1 or more) / super effective (x2);
        it is the same calculation as one member's coverage entry in TB2.
        walledBy lists every pokemon of the read model whose own types (a single or dual type,
        abilities not considered) take the move set at x1/2 or less, pokemonId ascending.
        walledByAbility separately lists the pokemon whose types alone do NOT reach x1/2 or less but
        one of their read model abilityIds does (an immunity or absorption counts too), pokemonId
        then abilityId ascending; it is empty when the ability read model is not configured.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRangeRequest'
      responses:
        '200':
          description: Offensive range of the move set and the pokemon that wall it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveRangeResponse'
        '400':
          description: |
            Invalid request or missing request context (invalid_request / missing_request_context):
            moveIds absent, empty, more than four, malformed, duplicated, or resolving to status moves only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 16 KiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            A moveId is not registered in the move read model (unknown_move, "unknown moveId: <ID>").
            The first one in request order is reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The move read model is not configured, or the pokemon read model (catalog) is not
            configured (master_unavailable). The move read model is checked first, since moveIds are
            always required. A missing ability read model alone only empties walledByAbility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - members
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/AnalyzeRequestMember'
    AnalyzeRequestMember:
      type: object
      additionalProperties: false
      required:
        - pokemonId
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        abilityId:
          $ref: '#/components/schemas/AbilityId'
    AbilityId:
      description: Optional ability of the member (ADR-0017). Omit it for a member without an ability.
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: ability-9001
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    ErrorCode:
      type: string
      enum:
        - missing_request_context
        - invalid_request
        - request_too_large
        - unknown_pokemon
        - unknown_move
        - unknown_ability
        - master_unavailable
        - internal_error
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required:
        - members
        - teamSummary
      properties:
        members:
          description: One entry per request member, in request order. Duplicated pokemonId values are kept.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/MemberDefense'
        teamSummary:
          description: One entry per attack type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/TeamSummaryEntry'
    MemberDefense:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - types
        - defense
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        abilityId:
          description: The request abilityId, present only when the request member named one.
          allOf:
            - $ref: '#/components/schemas/AbilityId'
        types:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TypeId'
        defense:
          description: One entry per attack type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/DefenseEntry'
    DefenseEntry:
      type: object
      additionalProperties: false
      required:
        - attackType
        - multiplier
        - category
        - source
        - effect
      properties:
        attackType:
          $ref: '#/components/schemas/TypeId'
        multiplier:
          $ref: '#/components/schemas/DefenseMultiplier'
        category:
          $ref: '#/components/schemas/DefenseCategory'
        source:
          $ref: '#/components/schemas/EffectSource'
        effect:
          $ref: '#/components/schemas/DefenseEffect'
    DefenseMultiplier:
      description: |
        Exact defensive multiplier as an irreducible fraction "numerator/denominator" (ADR-0017 §3).
        A denominator of 1 is written as the integer only ("0", "1", "2", "3", "4"); otherwise the
        fraction is in lowest terms ("1/4", "1/2", "3/4", "5/4", "3/2", "5/2"). Never a float.
        The TB1 values "0", "1/4", "1/2", "1", "2", "4" are a subset.
      type: string
      pattern: '^(0|[1-9][0-9]*(/([2-9]|[1-9][0-9]+))?)$'
      example: 3/4
    DefenseCategory:
      description: |
        Classification by value range (ADR-0017 §3): x0: immune, 0 < x <= 1/4: quad_resist,
        1/4 < x < 1: resist, x1: neutral, 1 < x < 4: weak, x >= 4: quad_weak.
      type: string
      enum:
        - quad_weak
        - weak
        - neutral
        - resist
        - quad_resist
        - immune
    EffectSource:
      description: |
        Origin of the multiplier. "type" when the value comes from the type matchup alone (including a
        type immunity, which the ability cannot change); "ability" when the member's ability changed it.
      type: string
      enum:
        - type
        - ability
    DefenseEffect:
      description: |
        Kind of ability effect that decided the value (ADR-0017 §3). "immune" / "absorb": the ability
        made the attack type x0 (absorb ignores its recovery or stat side effects). "multiplier": the ability
        changed the value by a type multiplier or a super effective multiplier. "none": otherwise
        (every entry of a member without an ability whose value is not x0 is "none").
      type: string
      enum:
        - none
        - immune
        - absorb
        - multiplier
      x-enum-varnames:
        - EffectNone
        - EffectImmune
        - EffectAbsorb
        - EffectMultiplier
    TeamSummaryEntry:
      description: |
        Per attack type team counts by DefenseCategory. weak = weak and quad_weak members,
        quadWeak = quad_weak members (subset of weak), resist = resist and quad_resist members (immune excluded),
        immune = x0 members (type or ability immunity, and ability absorption), neutral = x1 members.
        Invariant: weak + resist + immune + neutral = number of members.
      type: object
      additionalProperties: false
      required:
        - attackType
        - weak
        - quadWeak
        - resist
        - immune
        - neutral
      properties:
        attackType:
          $ref: '#/components/schemas/TypeId'
        weak:
          type: integer
          minimum: 0
          maximum: 6
        quadWeak:
          type: integer
          minimum: 0
          maximum: 6
        resist:
          type: integer
          minimum: 0
          maximum: 6
        immune:
          type: integer
          minimum: 0
          maximum: 6
        neutral:
          type: integer
          minimum: 0
          maximum: 6
    CoverageRequest:
      type: object
      additionalProperties: false
      required:
        - members
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/CoverageRequestMember'
    CoverageRequestMember:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - moveIds
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        moveIds:
          description: Zero to four moveIds. Duplicates within one member are rejected (400).
          type: array
          minItems: 0
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MoveId'
    MoveId:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: move-9001
    CoverageResponse:
      type: object
      additionalProperties: false
      required:
        - members
        - teamCoverage
      properties:
        members:
          description: One entry per request member, in request order.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/MemberCoverage'
        teamCoverage:
          description: One entry per single defense type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/TeamCoverageEntry'
    MemberCoverage:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - moveIds
        - attackTypes
        - coverage
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        moveIds:
          description: The request moveIds, in request order.
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/MoveId'
        attackTypes:
          description: Types of the non-status moves, without duplicates, in canonical type order.
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/TypeId'
        coverage:
          description: One entry per single defense type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/DefenseCoverageEntry'
    DefenseCoverageEntry:
      description: |
        bestMultiplier is the best multiplier of the member's attack moves against this defense type,
        or null when the member has no attack move (then effective and superEffective are false).
        effective = bestMultiplier is x1 or more; superEffective = bestMultiplier is x2.
      type: object
      additionalProperties: false
      required:
        - defenseType
        - bestMultiplier
        - effective
        - superEffective
      properties:
        defenseType:
          $ref: '#/components/schemas/TypeId'
        bestMultiplier:
          $ref: '#/components/schemas/CoverageMultiplier'
        effective:
          type: boolean
        superEffective:
          type: boolean
    TeamCoverageEntry:
      description: |
        Per defense type team counts. bestMultiplier is the best over all members (null when no member
        has an attack move). effectiveMembers = members with x1 or more; superEffectiveMembers = members
        with x2 (subset of effectiveMembers). Members are counted once regardless of how many moves they have.
      type: object
      additionalProperties: false
      required:
        - defenseType
        - bestMultiplier
        - effectiveMembers
        - superEffectiveMembers
      properties:
        defenseType:
          $ref: '#/components/schemas/TypeId'
        bestMultiplier:
          $ref: '#/components/schemas/CoverageMultiplier'
        effectiveMembers:
          type: integer
          minimum: 0
          maximum: 6
        superEffectiveMembers:
          type: integer
          minimum: 0
          maximum: 6
    CoverageMultiplier:
      description: Exact display form of a single-type offensive multiplier; null when there is no attack move.
      type: string
      nullable: true
      enum:
        - '0'
        - '1/2'
        - '1'
        - '2'
      x-enum-varnames:
        - CoverageZero
        - CoverageHalf
        - CoverageNeutral
        - CoverageDouble
    TypeId:
      type: string
      enum:
        - normal
        - fire
        - water
        - electric
        - grass
        - ice
        - fighting
        - poison
        - ground
        - flying
        - psychic
        - bug
        - rock
        - ghost
        - dragon
        - dark
        - steel
        - fairy
    ThreatsRequest:
      type: object
      additionalProperties: false
      required:
        - members
        - threats
      properties:
        members:
          description: The own party, one to six entries.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/ThreatsRequestPokemon'
        threats:
          description: The hypothetical opponents, one to six entries.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/ThreatsRequestPokemon'
    ThreatsRequestPokemon:
      description: One member or threat (the same shape on both sides, ADR-0400 §2).
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - moveIds
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        moveIds:
          description: Zero to four moveIds. Duplicates within one entry are rejected (400).
          type: array
          minItems: 0
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MoveId'
        abilityId:
          $ref: '#/components/schemas/AbilityId'
    ThreatsResponse:
      type: object
      additionalProperties: false
      required:
        - threats
      properties:
        threats:
          description: One entry per request threat, in request order.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/ThreatResult'
    ThreatResult:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - attackTypes
        - matchups
        - safeMembers
        - superEffectiveMembers
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        abilityId:
          description: The request abilityId of the threat, present only when the request named one.
          allOf:
            - $ref: '#/components/schemas/AbilityId'
        attackTypes:
          description: Types of the threat's non-status moves, without duplicates, in canonical type order.
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/TypeId'
        matchups:
          description: One entry per request member, in request order. Duplicated pokemonId values are kept.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/ThreatMatchup'
        safeMembers:
          description: Number of matchups whose safe is true.
          type: integer
          minimum: 0
          maximum: 6
        superEffectiveMembers:
          description: Number of matchups whose superEffective is true.
          type: integer
          minimum: 0
          maximum: 6
    ThreatMatchup:
      description: |
        incoming is the largest multiplier the member receives from the threat's attack moves (member's
        types and ability); null when the threat has no attack move. outgoing is the largest multiplier the
        member's attack moves deal to the threat (threat's types and ability); null when the member has no
        attack move. safe = incoming < 1 (false when null); superEffective = outgoing >= 2 (false when null).
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - incoming
        - outgoing
        - safe
        - superEffective
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        incoming:
          $ref: '#/components/schemas/MatchupMultiplier'
        outgoing:
          $ref: '#/components/schemas/MatchupMultiplier'
        safe:
          type: boolean
        superEffective:
          type: boolean
    MatchupMultiplier:
      description: |
        Exact multiplier as an irreducible fraction, in the same form as DefenseMultiplier (ADR-0017 §3):
        "0", "1/4", "1/2", "3/4", "1", "3/2", "2", "3", "4" and so on. null when there is no attack move.
      type: string
      nullable: true
      pattern: '^(0|[1-9][0-9]*(/([2-9]|[1-9][0-9]+))?)$'
      example: 3/2
    RecommendationsRequest:
      type: object
      additionalProperties: false
      required:
        - members
      properties:
        members:
          description: The own party, one to six entries.
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/RecommendationsRequestMember'
        limit:
          description: The largest number of candidates to return. Defaults to 10 when omitted.
          type: integer
          minimum: 1
          maximum: 20
          default: 10
    RecommendationsRequestMember:
      description: One party member (the same shape as a threats entry, ADR-0401 §6).
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - moveIds
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        moveIds:
          description: Zero to four moveIds. Duplicates within one member are rejected (400).
          type: array
          minItems: 0
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MoveId'
        abilityId:
          $ref: '#/components/schemas/AbilityId'
    RecommendationsResponse:
      type: object
      additionalProperties: false
      required:
        - defenseHoles
        - offenseHoles
        - candidates
        - abilityOptions
      properties:
        defenseHoles:
          description: Attack types that no member resists or is immune to, in canonical type order.
          type: array
          minItems: 0
          maxItems: 18
          items:
            $ref: '#/components/schemas/TypeId'
        offenseHoles:
          description: Single defense types the party cannot hit at x1 or more, in canonical type order. Empty when no member has an attack move (status moves do not count).
          type: array
          minItems: 0
          maxItems: 18
          items:
            $ref: '#/components/schemas/TypeId'
        candidates:
          description: Recommended type sets in the ADR-0401 §3 order, at most `limit` entries.
          type: array
          minItems: 0
          maxItems: 20
          items:
            $ref: '#/components/schemas/TypeCandidate'
        abilityOptions:
          description: One entry per defense hole (canonical order) when the ability read model is configured; empty otherwise.
          type: array
          minItems: 0
          maxItems: 18
          items:
            $ref: '#/components/schemas/AbilityOption'
    TypeCandidate:
      type: object
      additionalProperties: false
      required:
        - types
        - defenseCovered
        - offenseCovered
        - weaknesses
        - pokemon
      properties:
        types:
          description: One or two types in canonical type order.
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TypeId'
        defenseCovered:
          description: The defense holes this type set takes below x1 (types only), in canonical type order.
          type: array
          minItems: 0
          maxItems: 18
          items:
            $ref: '#/components/schemas/TypeId'
        offenseCovered:
          description: The offense holes this type set's own types hit at x1 or more, in canonical type order.
          type: array
          minItems: 0
          maxItems: 18
          items:
            $ref: '#/components/schemas/TypeId'
        weaknesses:
          description: Number of attack types that hit this type set at x2 or more (used only to break ties).
          type: integer
          minimum: 0
          maximum: 18
        pokemon:
          description: The pokemon for this candidate (ADR-0401 §8). A dual type set lists the exact matches; a single type also lists the pokemon containing it that still take its defenseCovered below x1. Exact matches first, then pokemonId ascending.
          type: array
          items:
            $ref: '#/components/schemas/CandidatePokemon'
    CandidatePokemon:
      description: |
        A pokemon for a candidate (ADR-0401 §8). A single-type candidate also lists the pokemon that
        contain its type (unless their other type loses one of the candidate's covered defense holes);
        exact type-set matches come first, then pokemonId ascending.
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - types
        - exactMatch
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        nameJa:
          $ref: '#/components/schemas/PokemonNameJa'
        types:
          description: The pokemon's types in the read model order.
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TypeId'
        exactMatch:
          description: Whether the pokemon's type set equals the candidate's.
          type: boolean
    PokemonNameJa:
      description: Japanese name from the read model, present only when the read model has one.
      type: string
      minLength: 1
      maxLength: 64
    AbilityOption:
      type: object
      additionalProperties: false
      required:
        - attackType
        - pokemon
      properties:
        attackType:
          $ref: '#/components/schemas/TypeId'
        pokemon:
          description: |
            Pairs of a pokemon and one of its abilities (read model abilityIds) that take attackType below x1,
            while the pokemon's types alone do not. pokemonId ascending.
          type: array
          items:
            $ref: '#/components/schemas/AbilityOptionPokemon'
    AbilityOptionPokemon:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - abilityId
        - multiplier
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        nameJa:
          $ref: '#/components/schemas/PokemonNameJa'
        abilityId:
          description: The ability that takes attackType below x1.
          allOf:
            - $ref: '#/components/schemas/AbilityId'
        multiplier:
          $ref: '#/components/schemas/DefenseMultiplier'
    MoveRangeRequest:
      description: A move set on its own (ADR-0404 §2). No pokemon is named.
      type: object
      additionalProperties: false
      required:
        - moveIds
      properties:
        moveIds:
          description: One to four moveIds. Duplicates are rejected (400).
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MoveId'
    MoveRangeResponse:
      type: object
      additionalProperties: false
      required:
        - attackTypes
        - typeChart
        - walledBy
        - walledByAbility
      properties:
        attackTypes:
          description: Types of the non-status moves, without duplicates, in canonical type order. Never empty.
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/TypeId'
        typeChart:
          description: One entry per single defense type, in canonical type order (normal ... fairy).
          type: array
          minItems: 18
          maxItems: 18
          items:
            $ref: '#/components/schemas/MoveRangeTypeEntry'
        walledBy:
          description: |
            The read model pokemon whose own types take the move set at x1/2 or less (abilities not
            considered), pokemonId ascending. Empty when no pokemon walls the move set.
          type: array
          items:
            $ref: '#/components/schemas/WalledByPokemon'
        walledByAbility:
          description: |
            Pairs of a pokemon and one of its read model abilityIds that take the move set at x1/2 or
            less while its types alone do not, pokemonId then abilityId ascending. Empty when the
            ability read model is not configured.
          type: array
          items:
            $ref: '#/components/schemas/WalledByAbilityPokemon'
    MoveRangeTypeEntry:
      description: |
        bestMultiplier is the best multiplier of the move set's attack moves against this single
        defense type; it always has a value (a request without any attack move is rejected with 400).
        effective = bestMultiplier is x1 or more; superEffective = bestMultiplier is x2.
      type: object
      additionalProperties: false
      required:
        - defenseType
        - bestMultiplier
        - effective
        - superEffective
      properties:
        defenseType:
          $ref: '#/components/schemas/TypeId'
        bestMultiplier:
          $ref: '#/components/schemas/MoveRangeMultiplier'
        effective:
          type: boolean
        superEffective:
          type: boolean
    MoveRangeMultiplier:
      description: |
        Exact display form of a single-type offensive multiplier. Unlike CoverageMultiplier it is
        never null: the move set always has at least one attack move (ADR-0404 §2).
      type: string
      enum:
        - '0'
        - '1/2'
        - '1'
        - '2'
      x-enum-varnames:
        - MoveRangeZero
        - MoveRangeHalf
        - MoveRangeNeutral
        - MoveRangeDouble
    WalledByPokemon:
      description: |
        One read model pokemon that walls the move set by its types alone. bestMultiplier is the
        largest multiplier the move set deals to its actual (single or dual) types, so it is x1/2 or less.
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - types
        - bestMultiplier
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        nameJa:
          $ref: '#/components/schemas/PokemonNameJa'
        types:
          description: The pokemon's types in the read model order.
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TypeId'
        bestMultiplier:
          $ref: '#/components/schemas/DefenseMultiplier'
    WalledByAbilityPokemon:
      description: |
        One read model pokemon and one of its abilities that bring the move set to x1/2 or less while
        its types alone do not. bestMultiplier is the largest multiplier with that ability applied.
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - abilityId
        - bestMultiplier
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        nameJa:
          $ref: '#/components/schemas/PokemonNameJa'
        abilityId:
          description: The ability that brings the move set to x1/2 or less.
          allOf:
            - $ref: '#/components/schemas/AbilityId'
        bestMultiplier:
          $ref: '#/components/schemas/DefenseMultiplier'
