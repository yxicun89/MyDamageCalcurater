openapi: 3.0.3
info:
  title: pokecalc speed API
  version: 0.7.0
  description: |
    素早さ比較の独立サービスの契約。
    SP0 はヘルスチェックと、既定のレギュレーションで使用可能なポケモンの一覧(素早さ種族値つき)を返す。
    SP1 は素早さの表(各ポケモン 6 行のプリセットを速い順に並べ、同じ値を 1 つの段にまとめたもの)を返す。
    SP2 は自分のポケモンの実数値と、その表の中の位置(自分より速い行の数・同速の行・遅い行の数)を返す。
    契約の正は docs/adr/0600-speed-sp0-foundation.md・docs/adr/0601-speed-sp1-table.md・
    docs/adr/0602-speed-sp2-position.md と docs/speed-design.md。
    0.4.0: X-Device-Id / X-Session-Id を gateway と同じ正準形 UUID で検証し、ヘッダー起因の 400 の code を
    missing_header / invalid_header に分けた(破壊的変更。ADR-0606)。
    0.5.0: 追い風・まひ・トリックルームを足した(ADR-0607)。表は tailwind / trickRoom のクエリ、自分の位置は
    tailwind / paralysis / tableTailwind の欄(すべて省略可で、省略は false = 従来と同じ応答)。後方互換。
    0.7.0: 「相手を選んで上を取る最低ライン」の POST /api/speed/v1/matchup と、自分の素早さの「族」の区切りの
    POST /api/speed/v1/reach を足した(ADR-0610。I-speed-4)。既存の API・応答は変えない。後方互換。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      summary: Pod health check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/speed/healthz:
    get:
      operationId: publicHealth
      summary: Ingress smoke check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/speed/v1/pokemon:
    get:
      operationId: listPokemon
      summary: List the pokemon available in the default regulation
      description: |
        Returns the pokemon of the service-local read model (ADR-0600 §4), which is the available set of
        one regulation, sorted by pokemonId in ascending order (ADR-0600 §5).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The available pokemon with their base speed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokemonListResponse'
        '400':
          description: |
            X-Device-Id or X-Session-Id is missing or empty (missing_header), or is not a canonical
            8-4-4-4-12 hex UUID or is sent more than once (invalid_header). If both apply, missing_header wins (ADR-0606 §2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon read model is not configured (master_unavailable), or the service is overloaded or past its request deadline (overloaded, with Retry-After; ADR-0801)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string; no internal detail is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/speed/v1/table:
    get:
      operationId: getSpeedTable
      summary: Get the speed table of the default regulation
      description: |
        Returns, for every pokemon of the service-local read model (ADR-0600 §4), one row per selected preset
        (ADR-0601 §2), grouped into tiers of the same speed (ADR-0601 §3). Tiers are sorted by speed in
        descending order (ascending when trickRoom=true. ADR-0607 §4); inside a tier, entries are sorted by pokemonId ascending, then by the preset order
        of ADR-0601 §2. A tier with two or more entries is a speed tie.
        Check order: headers (400) → query (400) → read model absent (503) → 200 (ADR-0601 §5).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: presets
          in: query
          required: false
          description: |
            The rows to include, comma separated (ADR-0601 §4). Omitted means all six presets.
            The order given does not affect the result. An unknown ID, a duplicate, or an empty value
            (`presets=`) is 400 invalid_request.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: '#/components/schemas/PresetId'
          example:
            - max-scarf
        - name: tailwind
          in: query
          required: false
          description: |
            Whether a tailwind is on the side of every row of the table (ADR-0607 §2): every row's speed
            is doubled, chained with the Choice Scarf of the max-scarf row before one rounding. Omitted
            means false (the same table as before). A value that is not a boolean, an empty value, or the
            parameter sent more than once is 400 invalid_request.
          schema:
            type: boolean
            default: false
        - name: trickRoom
          in: query
          required: false
          description: |
            Whether Trick Room is in effect (ADR-0607 §4). The speeds are not changed; only the order of
            the tiers is reversed so that the table is in move order (ascending speed). The order inside
            a tier (pokemonId ascending, then the preset order) is not reversed, and a speed tie stays one
            tier. Omitted means false. A value that is not a boolean, an empty value, or the parameter
            sent more than once is 400 invalid_request.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The speed table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '400':
          description: |
            X-Device-Id or X-Session-Id is missing or empty (missing_header), or is not a canonical
            8-4-4-4-12 hex UUID or is sent more than once (invalid_header). If both apply, missing_header wins (ADR-0606 §2).
            presets is unknown, duplicated, or empty (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon read model is not configured (master_unavailable), or the service is overloaded or past its request deadline (overloaded, with Retry-After; ADR-0801)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string; no internal detail is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/speed/v1/position:
    post:
      operationId: getSpeedPosition
      summary: Locate one's own pokemon in the speed table
      description: |
        Returns the in-battle speed of one's own pokemon and where it falls in the speed table of the
        default regulation (ADR-0602 §3). The table is always the full six presets of ADR-0601 §2:
        `faster` and `slower` count its rows above and below the given speed, and `tie` lists the rows
        with exactly that speed (empty means no speed tie).

        Field effects (ADR-0607): `tailwind` and `paralysis` apply to one's own pokemon (preset and
        custom only); `tableTailwind` applies to every row of the table the position is counted in (any
        mode). All are optional and default to false, which gives the same response as before.
        Trick Room is not an input here: `faster` / `slower` compare speeds and do not depend on it
        (under Trick Room, the rows that move before one's own pokemon are the `slower` rows. ADR-0607 §4).

        The input has three shapes, selected by `mode` (ADR-0602 §2):
        `preset` needs pokemonId, preset and scarf (the minimal choice: the SP, nature and rank of the
        chosen row of ADR-0601 §2, with the Choice Scarf switched independently);
        `custom` needs pokemonId, sp, nature, rank and scarf;
        `raw` needs value, the in-battle speed itself, and may name pokemonId for display only (its base
        speed is not used); `tailwind` and `paralysis` are not allowed for raw. A field the chosen mode does not need, a missing required field, a pokemonId
        not matching the NNNN-NNN format, or a value out of range is 400 invalid_request. A JSON `null`
        for an optional field is treated the same as omitting it.

        Check order: headers (400) → body (400, or 413 request_too_large over 4 KiB) → read model
        absent (503) → unknown pokemonId (422) → 200.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionRequest'
      responses:
        '200':
          description: The speed of one's own pokemon and its position in the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          description: |
            X-Device-Id or X-Session-Id is missing or empty (missing_header), or is not a canonical
            8-4-4-4-12 hex UUID or is sent more than once (invalid_header). If both apply, missing_header wins (ADR-0606 §2).
            The body is not one JSON object, or the fields do not match the given mode, or a value is out
            of range (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 4 KiB limit (request_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: pokemonId is not in the read model (unknown_pokemon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon read model is not configured (master_unavailable), or the service is overloaded or past its request deadline (overloaded, with Retry-After; ADR-0801)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string; no internal detail is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/speed/v1/matchup:
    post:
      operationId: getSpeedMatchup
      summary: The minimum speed investment for one's own pokemon to move before a chosen opponent
      description: |
        For one's own pokemon and a chosen opponent, returns per opponent assumption (how the opponent
        invested in speed) and per nature effect of one's own pokemon, the range of speed SP (0 to 32)
        with which one's own pokemon moves first by speed alone, and the range that gives a speed tie
        (ADR-0610 §1・§2). Speeds are engine.FinalSpeed (ADR-0179 §2) and the order is engine.CompareSpeed
        (ADR-0179 §3): without Trick Room the faster moves first; under Trick Room the slower moves
        first; equal speeds are a tie and never count as moving first. Move priority is not considered
        (the combo calculation of the calc screen covers moves).

        `self.rank` / `scarf` / `tailwind` / `paralysis` are the fixed conditions of one's own pokemon
        (omitted = 0 / false). `self.current` (optional) is the current SP and nature; with it, every
        line also carries the current turn order. `opponent.assumptions` omitted means the four
        assumptions uninvested, neutral-max, max and max-scarf, in that order; each assumption has
        exactly one of `preset` or `custom`. `opponent.tailwind` / `paralysis` apply to every assumption.

        Check order: headers (400) → body (400, or 413 over 4 KiB) → read model absent (503) → unknown
        pokemonId (422) → 200. Added in 0.7.0 (additive).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchupRequest'
      responses:
        '200':
          description: The SP ranges per opponent assumption and nature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchupResponse'
        '400':
          description: |
            Header errors as for /position (missing_header / invalid_header, ADR-0606 §2), or the body is
            not one JSON object, has unknown fields, an assumption with both or neither of preset and
            custom, a duplicate preset, or a value out of range (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 4 KiB limit (request_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: self.pokemonId or opponent.pokemonId is not in the read model (unknown_pokemon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon read model is not configured (master_unavailable), or the service is overloaded (overloaded, with Retry-After; ADR-0801)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/speed/v1/reach:
    post:
      operationId: getSpeedReach
      summary: Which base speeds one's own speed is above, tied with and below, per table preset
      description: |
        Takes the same body as POST /api/speed/v1/position and, for the speed it gives, returns per row
        preset of the table (ADR-0601 §2, in that order) the base speeds (1 to 255) whose speed with that
        preset is slower than, equal to and faster than one's own speed (ADR-0610 §1, "族"), with the
        number of available pokemon in each group and the boundary pokemon. `tableTailwind` applies to
        the preset side. The comparison is of speeds and does not depend on Trick Room (as for
        /position; ADR-0607 §4). Validation and check order are the same as /position. Added in 0.7.0
        (additive).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionRequest'
      responses:
        '200':
          description: The base speed ranges per preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReachResponse'
        '400':
          description: As for POST /api/speed/v1/position (missing_header / invalid_header / invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the 4 KiB limit (request_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: pokemonId is not in the read model (unknown_pokemon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The pokemon read model is not configured (master_unavailable), or the service is overloaded (overloaded, with Retry-After; ADR-0801)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected internal error (internal_error). The message is a fixed string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        Canonical 8-4-4-4-12 hex UUID (case-insensitive, any version). Braces, a urn:uuid: prefix, or the
        32-digit form without hyphens are invalid_header; a missing or empty value is missing_header; sending
        the header more than once is invalid_header (ADR-0606, same rule as the gateway).
      schema:
        type: string
        minLength: 1
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      description: |
        Canonical 8-4-4-4-12 hex UUID (case-insensitive, any version). Braces, a urn:uuid: prefix, or the
        32-digit form without hyphens are invalid_header; a missing or empty value is missing_header; sending
        the header more than once is invalid_header (ADR-0606, same rule as the gateway).
      schema:
        type: string
        minLength: 1
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
        dataVersion:
          type: string
          description: |
            Version of the read model this process loaded (metadata.json next to the read model, ADR-0138).
            Omitted when the read model has no metadata.json (unknown). Public master data version only.
    PokemonListResponse:
      type: object
      additionalProperties: false
      required:
        - regulationId
        - pokemon
      properties:
        regulationId:
          description: The regulation whose available set the list is (ADR-0600 §4).
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: example
        pokemon:
          description: The available pokemon, sorted by pokemonId in ascending order.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SpeedPokemon'
    SpeedPokemon:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - nameJa
        - types
        - baseSpeed
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        nameJa:
          type: string
          minLength: 1
          example: テストカソウドリ
        types:
          description: One or two lowercase type IDs, for display only (the 18 types are not listed in the contract).
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            pattern: '^[a-z]+$'
            example: fire
        baseSpeed:
          type: integer
          minimum: 1
          maximum: 255
          example: 100
    PresetId:
      description: |
        A row preset of the speed table (ADR-0601 §2), listed in the table order. Display names are client
        resources and are not part of the contract.
        uninvested = SP 0, neutral nature; neutral-max = SP 32, neutral; max = SP 32, speed-up nature;
        max-scarf = max with Choice Scarf; max-plus1 = max at +1; max-plus2 = max at +2.
      type: string
      enum:
        - uninvested
        - neutral-max
        - max
        - max-scarf
        - max-plus1
        - max-plus2
      example: max-scarf
    TableResponse:
      type: object
      additionalProperties: false
      required:
        - regulationId
        - presets
        - tiers
      properties:
        regulationId:
          description: The regulation whose available set the table is (ADR-0600 §4).
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: example
        presets:
          description: The presets actually used, in the order of ADR-0601 §2 (not the query order).
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PresetId'
        tiers:
          description: |
            Tiers of the same speed, sorted by speed in descending order, or in ascending order when
            trickRoom=true (move order. ADR-0607 §4).
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SpeedTier'
    SpeedTier:
      type: object
      additionalProperties: false
      required:
        - speed
        - entries
      properties:
        speed:
          description: The in-battle speed shared by every entry of the tier.
          type: integer
          minimum: 1
          example: 250
        entries:
          description: |
            The rows with this speed, sorted by pokemonId ascending, then by the preset order of ADR-0601 §2.
            Two or more entries mean a speed tie.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SpeedTableEntry'
    SpeedTableEntry:
      type: object
      additionalProperties: false
      required:
        - pokemonId
        - nameJa
        - types
        - baseSpeed
        - preset
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        nameJa:
          type: string
          minLength: 1
          example: テストカソウドリ
        types:
          description: One or two lowercase type IDs, for display only (the 18 types are not listed in the contract).
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            pattern: '^[a-z]+$'
            example: fire
        baseSpeed:
          type: integer
          minimum: 1
          maximum: 255
          example: 100
        preset:
          $ref: '#/components/schemas/PresetId'
    MinimalPresetId:
      description: |
        A preset one can pick for one's own pokemon (ADR-0602 §5): the three rows of ADR-0601 §2 that carry
        no Choice Scarf, because `scarf` is chosen separately in a position request. The SP, nature and rank
        of each are the ones PresetId describes.
      type: string
      enum:
        - uninvested
        - neutral-max
        - max
      example: max
    NatureId:
      description: |
        The effect of the nature on speed (ADR-0600 §3, the same meaning as the core's NatureEffect):
        minus = speed-down, neutral = no nature change, plus = speed-up.
      type: string
      enum:
        - minus
        - neutral
        - plus
      example: plus
    PositionRequest:
      description: |
        One's own pokemon, in one of the three shapes of ADR-0602 §2. Only `mode` is always required;
        which of the other fields must be present, and which must be absent, depends on `mode`.
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          description: |
            Which shape the request has (ADR-0602 §2).
            preset: pokemonId + preset + scarf. custom: pokemonId + sp + nature + rank + scarf.
            raw: value, with an optional pokemonId for display only.
          type: string
          enum:
            - preset
            - custom
            - raw
          example: preset
        pokemonId:
          description: |
            The pokemon of the read model. Required for preset and custom (its base speed is the input of
            the formula); optional for raw, where it only resolves the name and types of the response.
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        preset:
          $ref: '#/components/schemas/MinimalPresetId'
        scarf:
          description: Whether one's own pokemon holds a Choice Scarf (preset and custom only).
          type: boolean
          example: false
        tailwind:
          description: |
            Whether a tailwind is on one's own side (preset and custom only; not allowed for raw). Doubles
            the speed, chained with the Choice Scarf before one rounding (ADR-0607 §2). Omitted means false.
          type: boolean
          example: false
        paralysis:
          description: |
            Whether one's own pokemon is paralyzed (preset and custom only; not allowed for raw). Halves
            the speed (rounded down) after the other modifiers (ADR-0607 §3). Omitted means false.
          type: boolean
          example: false
        tableTailwind:
          description: |
            Whether a tailwind is on the side of every row of the table the position is counted in (any
            mode). The same effect as the tailwind query of GET /api/speed/v1/table (ADR-0607 §2).
            Omitted means false.
          type: boolean
          example: false
        sp:
          description: |
            The speed SP (custom only). The upper bound is the per-stat SP cap of the domain
            (CLAUDE.md のドメイン規約・ADR-0600 §3。コアは engine.MaxSPPerStat を使う)。
          type: integer
          minimum: 0
          maximum: 32
          example: 32
        nature:
          $ref: '#/components/schemas/NatureId'
        rank:
          description: The speed rank (custom only), -6 to +6 (ADR-0600 §3).
          type: integer
          minimum: -6
          maximum: 6
          example: 1
        value:
          description: |
            The in-battle speed itself (raw only), used as given. Accepted values are the theoretical
            minimum and maximum of the formula of ADR-0600 §3 over every base speed, SP, nature, rank and
            Choice Scarf (ADR-0602 §3); the service derives those bounds from the formula, so they are
            deliberately not repeated here as numbers.
          type: integer
          minimum: 1
          example: 301
    PositionResponse:
      type: object
      additionalProperties: false
      required:
        - speed
        - faster
        - slower
        - tie
      properties:
        speed:
          description: The in-battle speed of one's own pokemon (ADR-0602 §3).
          type: integer
          minimum: 1
          example: 301
        pokemon:
          description: |
            The pokemon the request named, for display. Present only when the request had a pokemonId,
            so a raw request without one has no pokemon field (ADR-0602 §4).
          $ref: '#/components/schemas/SpeedPokemon'
        faster:
          description: |
            The number of table rows strictly faster than `speed`. A speed comparison that does not
            depend on Trick Room (under Trick Room these rows move after one's own pokemon. ADR-0607 §4).
          type: integer
          minimum: 0
          example: 12
        slower:
          description: |
            The number of table rows strictly slower than `speed`. A speed comparison that does not
            depend on Trick Room (under Trick Room these rows move before one's own pokemon. ADR-0607 §4).
          type: integer
          minimum: 0
          example: 30
        tie:
          description: |
            The table rows with exactly this speed, sorted as a tier is (pokemonId ascending, then the
            preset order of ADR-0601 §2). An empty array means no speed tie.
          type: array
          items:
            $ref: '#/components/schemas/SpeedTableEntry'
    MatchupRequest:
      description: One's own pokemon and a chosen opponent (ADR-0610 §2).
      type: object
      additionalProperties: false
      required:
        - self
        - opponent
      properties:
        self:
          $ref: '#/components/schemas/MatchupSelf'
        opponent:
          $ref: '#/components/schemas/MatchupOpponent'
        trickRoom:
          description: Whether Trick Room is up (the slower moves first). Omitted means false.
          type: boolean
          example: false
    MatchupSelf:
      type: object
      additionalProperties: false
      required:
        - pokemonId
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9001-000
        rank:
          description: The speed rank, -6 to +6. Omitted means 0.
          type: integer
          minimum: -6
          maximum: 6
          example: 0
        scarf:
          description: Whether one's own pokemon holds a Choice Scarf. Omitted means false.
          type: boolean
          example: false
        tailwind:
          description: Whether a tailwind is on one's own side. Omitted means false.
          type: boolean
          example: false
        paralysis:
          description: Whether one's own pokemon is paralyzed. Omitted means false.
          type: boolean
          example: false
        current:
          $ref: '#/components/schemas/SpeedInvestment'
    SpeedInvestment:
      description: A speed SP and a nature effect.
      type: object
      additionalProperties: false
      required:
        - sp
        - nature
      properties:
        sp:
          type: integer
          minimum: 0
          maximum: 32
          example: 32
        nature:
          $ref: '#/components/schemas/NatureId'
    MatchupOpponent:
      type: object
      additionalProperties: false
      required:
        - pokemonId
      properties:
        pokemonId:
          type: string
          maxLength: 8
          pattern: '^\d{4}-\d{3}$'
          example: 9004-000
        assumptions:
          description: |
            How the opponent may have invested in speed. Omitted means uninvested, neutral-max, max and
            max-scarf. The response keeps this order.
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/OpponentAssumption'
        tailwind:
          description: Whether a tailwind is on the opponent's side (every assumption). Omitted means false.
          type: boolean
          example: false
        paralysis:
          description: Whether the opponent is paralyzed (every assumption). Omitted means false.
          type: boolean
          example: false
    OpponentAssumption:
      description: Exactly one of `preset` (a row preset of the table) or `custom`.
      type: object
      additionalProperties: false
      properties:
        preset:
          $ref: '#/components/schemas/PresetId'
        custom:
          $ref: '#/components/schemas/OpponentCustom'
    OpponentCustom:
      type: object
      additionalProperties: false
      required:
        - sp
        - nature
      properties:
        sp:
          type: integer
          minimum: 0
          maximum: 32
          example: 0
        nature:
          $ref: '#/components/schemas/NatureId'
        rank:
          description: Omitted means 0.
          type: integer
          minimum: -6
          maximum: 6
          example: 0
        scarf:
          description: Omitted means false.
          type: boolean
          example: false
    MatchupResponse:
      type: object
      additionalProperties: false
      required:
        - self
        - opponent
        - trickRoom
        - lines
      properties:
        self:
          $ref: '#/components/schemas/SpeedPokemon'
        opponent:
          $ref: '#/components/schemas/SpeedPokemon'
        trickRoom:
          type: boolean
          example: false
        selfSpeed:
          description: The current speed of one's own pokemon. Present only when self.current was given.
          type: integer
          minimum: 1
          example: 167
        lines:
          type: array
          items:
            $ref: '#/components/schemas/MatchupLine'
    MatchupLine:
      type: object
      additionalProperties: false
      required:
        - assumption
        - opponentSpeed
        - natures
      properties:
        assumption:
          $ref: '#/components/schemas/OpponentAssumption'
        opponentSpeed:
          description: The opponent's in-battle speed under this assumption.
          type: integer
          minimum: 1
          example: 150
        current:
          $ref: '#/components/schemas/TurnOrder'
        natures:
          description: Always three entries, in the order minus, neutral, plus.
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/NatureLine'
    TurnOrder:
      description: |
        The turn order by speed alone (engine.CompareSpeed; the same vocabulary as the combo calculation).
        Present only when self.current was given.
      type: string
      enum:
        - self_first
        - opponent_first
        - speed_tie
      example: self_first
    NatureLine:
      description: |
        For one nature effect of one's own pokemon: `movesFirst` is the SP range with which one's own
        pokemon moves first (without Trick Room [min, 32], where min is the minimum line; under Trick
        Room [0, max]); `tie` is the SP range of a speed tie. An absent field means no SP qualifies.
      type: object
      additionalProperties: false
      required:
        - nature
      properties:
        nature:
          $ref: '#/components/schemas/NatureId'
        movesFirst:
          $ref: '#/components/schemas/SpRange'
        tie:
          $ref: '#/components/schemas/SpRange'
    SpRange:
      description: An inclusive SP range.
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 0
          maximum: 32
          example: 18
        max:
          type: integer
          minimum: 0
          maximum: 32
          example: 32
    ReachResponse:
      type: object
      additionalProperties: false
      required:
        - speed
        - lines
      properties:
        speed:
          description: One's own in-battle speed (the same value as /position).
          type: integer
          minimum: 1
          example: 167
        pokemon:
          description: Present only when the request had a pokemonId (as for /position).
          $ref: '#/components/schemas/SpeedPokemon'
        lines:
          description: Six entries, one per row preset in the table order (ADR-0601 §2).
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/ReachLine'
    ReachLine:
      description: |
        For one row preset: the base speeds whose speed with this preset is slower than (`slower`),
        equal to (`tie`) and faster than (`faster`) one's own speed. An absent range means no base speed
        (1 to 255) is in that group. The counts and the boundary pokemon are over the available pokemon.
      type: object
      additionalProperties: false
      required:
        - preset
        - slowerCount
        - tieCount
        - fasterCount
      properties:
        preset:
          $ref: '#/components/schemas/PresetId'
        slower:
          $ref: '#/components/schemas/BaseSpeedRange'
        tie:
          $ref: '#/components/schemas/BaseSpeedRange'
        faster:
          $ref: '#/components/schemas/BaseSpeedRange'
        slowerCount:
          type: integer
          minimum: 0
          example: 5
        tieCount:
          type: integer
          minimum: 0
          example: 1
        fasterCount:
          type: integer
          minimum: 0
          example: 2
        fastestSlower:
          description: The fastest available pokemon in `slower` (lowest pokemonId on equal base speed).
          $ref: '#/components/schemas/SpeedPokemon'
        slowestFaster:
          description: The slowest available pokemon in `faster` (lowest pokemonId on equal base speed).
          $ref: '#/components/schemas/SpeedPokemon'
    BaseSpeedRange:
      description: An inclusive base speed range ("族").
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 1
          maximum: 255
          example: 1
        max:
          type: integer
          minimum: 1
          maximum: 255
          example: 99
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - missing_header
        - invalid_header
        - unknown_pokemon
        - request_too_large
        - master_unavailable
        - overloaded
        - internal_error
        - not_found
