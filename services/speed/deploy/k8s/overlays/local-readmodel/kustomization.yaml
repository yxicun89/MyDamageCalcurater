# ローカル k3d で pokedex export の read model(Git 管理外)を読む overlay(ADR-0603)。
# ConfigMap speed-readmodel は Git に置かず、make speed-k3d-deploy-readmodel が
# data/generated/readmodel/speed-pokemon.json から作る(Kustomize の load restrictor で
# overlay 外のファイルを参照できないため。balance の local-readmodel と同じ形)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pokecalc
resources:
  - ../../base
patches:
  - path: deployment-readmodel-patch.yaml
images:
  - name: pokecalc/speed
    newName: pokecalc/speed
    newTag: local
