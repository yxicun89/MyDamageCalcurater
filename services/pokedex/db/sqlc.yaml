# sqlc 設定(ADR-0100 §1)。バージョン固定は tools/go.mod の tool ディレクティブで行う。
# 生成は `make gen-sql`。生成物(../internal/store)はコミットし、make gen の差分検査の対象にする。
version: "2"
sql:
  - engine: "mysql"
    schema: "migrations"
    queries: "query"
    gen:
      go:
        package: "store"
        out: "../internal/store"
        emit_json_tags: false
        emit_interface: true
        # LEFT JOIN で NULL になりうる JSON 列(公開 API の effect。ADR-0218)は *json.RawMessage で受ける
        # (NULL を json.RawMessage に Scan できないため。nil = 効果の行が無い)。
        # この上書きは「NULL になりうる JSON 列すべて」に効く(今は LEFT JOIN した effect だけ。足すときは型の変化に注意)。
        overrides:
          - db_type: "json"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
