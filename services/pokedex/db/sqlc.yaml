# sqlc 設定(ADR-0100 §1)。バージョン固定は tools/go.mod の tool ディレクティブで行う。
# 生成は `make gen-sql`(make gen に含む)。生成物(../internal/store)は Git に置かない(ADR-0171)。
version: "2"
sql:
  - engine: "mysql"
    schema: "migrations"
    queries: "query"
    gen:
      go:
        package: "store"
        out: "../internal/store"
        emit_json_tags: false
        emit_interface: true
