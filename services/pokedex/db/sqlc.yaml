# sqlc 設定(ADR-0015 §1)。バージョン固定は tools/go.mod の tool ディレクティブで行う。
# 生成は `make gen-sql`。生成物(../internal/store)はコミットし、make gen の差分検査の対象にする。
version: "2"
sql:
  - engine: "mysql"
    schema: "migrations"
    queries: "query"
    gen:
      go:
        package: "store"
        out: "../internal/store"
        emit_json_tags: false
        emit_interface: true
