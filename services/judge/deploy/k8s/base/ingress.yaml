# judge の /api/judge は traefik の最長一致で judge の Ingress に届く(balance・speed と同じ形。
# ADR-0700 §4-3。gateway は変更しない)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: judge
  labels:
    app.kubernetes.io/name: judge
    app.kubernetes.io/part-of: pokecalc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/judge
            pathType: Prefix
            backend:
              service:
                name: judge
                port:
                  name: http
