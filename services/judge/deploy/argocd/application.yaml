apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokecalc-judge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/pokecalc.git
    targetRevision: main
    path: services/judge/deploy/k8s/overlays/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: pokecalc
