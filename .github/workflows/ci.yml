name: CI

# issue #215: main への push・PR で test/lint/build/golden/wasm/kustomize/check-publishable を
# 機械的に検証する(ADR-0119)。Secret は使わない(private リポジトリの無料枠内で完結させる)。
#
# 対象外(理由):
#   - iOS(`make ios-test`): macOS ランナー + Xcode が要り、無料枠(private は月2,000分。macOS ランナーは
#     消費倍率10倍)の消費が大きい。署名・実機確認は人間の作業(CLAUDE.md)。
#   - k3d へ実際に apply するもの(`make up`・`*-k3d-deploy`・`web-k3d-e2e` 等):
#     k3d クラスタの起動が要り、GitHub-hosted ランナーだけでは完結しない(#72 で別途検討)。
#   (Web の Playwright e2e のうち k3d を使わないもの〈`web-e2e`・`web-e2e-online`・`web-e2e-container`〉は、
#    2026-10-03 から別ジョブ `web-e2e` で走らせる。種族欄が select から検索欄に変わったとき e2e だけが壊れて
#    CI を素通りした事故を受けた。ADR-0119 追記)
#
# バージョンはワークフローに二重に書かず、リポジトリ内の正から読む:
#   - Go: go-version-file に go.work(全 Go モジュール共通の `go 1.27.1` を1箇所で宣言している)
#   - Node: node-version-file に web/.node-version(web/package.json の engines.node と同じ値)
#
# `make test` / `make lint` / `make build` は Makefile 側で Web・balance・speed・judge を
# 前提条件として合成済み(ドキュメント: docs/impl/make-targets.md「test/lint/build の合成結果」)。
# そのため「go ジョブ」「web ジョブ」に分けると Web 分が二重実行になり無料枠を浪費するので、
# 1 ジョブにまとめて上から順に実行する。

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: test / lint / build / golden / wasm / kustomize / check-publishable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 各ステップにも timeout-minutes を付ける(job 全体の 25 分だけだと、どのコマンドが固まったか
    # 特定できないまま 25 分待つことになる。2026-09-25: check-publishable の正規表現が O(n^2) 走査に
    # なり make lint が刺さった事故を受けて追加。ステップ側の上限は job 全体の 25 分より小さく取り、
    # 単体でどのステップが原因か早く分かるようにする)。
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: setup go (go.work の go ディレクティブから版を読む)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: setup node (web/.node-version から版を読む)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # deploytest(services/gateway/deploytest)の t.Skip を 0 件にする(kubectl kustomize の描画にも要る)。
      # 版は https://dl.k8s.io/release/stable.txt(2026-09-25 時点 v1.37.1)に合わせて固定する。
      - name: setup kubectl (stable.txt の v1.37.1 に固定)
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        timeout-minutes: 5
        with:
          version: v1.37.1

      # engine・services・tools・balance・speed・judge の単体テスト + Web の vitest(web-deps が
      # 未インストールなら npm ci を自動実行する)。
      - name: make test
        run: make test
        timeout-minutes: 10

      # gofmt・go vet(mysql/tidb タグ含む)・シェル/Node構文・kustomize描画(k8s-render)・
      # check-publishable(-selftest)・各レーンの lint・Web の tsc/eslint/prettier。
      - name: make lint
        run: make lint
        timeout-minutes: 10

      - name: make build
        run: make build
        timeout-minutes: 5

      # 計算ロジックの @smogon/calc 0.12.0 照合(testdata/golden はコミット済みなのでネットワーク不要)。
      - name: make test-golden
        run: make test-golden
        timeout-minutes: 5

      # engine を GOOS=js/GOARCH=wasm でビルドし、ネイティブ Go の結果と Node 上の wasm 実行結果が
      # バイト一致することを確認する。
      - name: make test-wasm
        run: make test-wasm
        timeout-minutes: 5

      # 公開前検査(絶対パス・秘密・追跡禁止ファイル・第三者データ)。make lint に含まれるが、
      # Actions のログで単独の合否として見えるように明示的に走らせる。
      - name: make check-publishable
        run: make check-publishable
        timeout-minutes: 3

  # Web の Playwright e2e(k3d を使わない3つ)。上のジョブと並行して走らせる(待ち時間を増やさない)。
  # web-e2e: 本番ビルドを preview で配りオフライン(WASM)・キャッシュ・画面の流れを確かめる(engine.wasm のビルドに Go が要る)。
  # web-e2e-online: 例データで calc-svc を起動してオンライン(API)を確かめる(Go が要る)。
  # web-e2e-container: 本番イメージ(nginx)を docker で起動し、配信設定・CSP・WASM をコンテナ越しに確かめる(docker は ubuntu-latest にある)。
  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: setup go (go.work の go ディレクティブから版を読む)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: setup node (web/.node-version から版を読む)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: make web-deps
        timeout-minutes: 5

      # Linux のランナーは chromium の実行に要るシステムライブラリも入れる(--with-deps)。
      - name: playwright の chromium を入れる
        run: cd web && npx --no-install playwright install --with-deps chromium
        timeout-minutes: 8

      - name: make web-e2e
        run: make web-e2e
        timeout-minutes: 10

      - name: make web-e2e-online
        run: make web-e2e-online
        timeout-minutes: 8

      - name: make web-e2e-container
        run: make web-e2e-container
        timeout-minutes: 12
