# API レーンだけを k3d に載せるための overlay(ADR-0203 追記。§apply の分離)。
#
# クラスタ全体の立ち上げ(namespace・mysql・pokedex-migrate Job を含む)は `make up`
# (scripts/up.sh)が担う。`deploy/k8s/overlays/local`(共有)を丸ごと apply すると、
# pokedex-migrate Job の再実行(spec.template は immutable なので既存 Job と食い違うと
# 失敗する)や mysql の意図しない上書きを引き起こしうる(k3d クラスタは他レーンと共有)。
#
# `services/gateway/Makefile` の `api-k3d-deploy` は常にここ(base/calc・base/gateway と、
# それぞれへの local overlay の Component `local/api` のパッチだけ)を適用する。他レーンの
# リソース(namespace・mysql・pokedex-migrate Job)には一切触らない。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pokecalc
resources:
  - ../../base/calc
  - ../../base/gateway
components:
  - ../local/api
