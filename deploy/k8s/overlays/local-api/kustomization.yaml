# API レーンだけを k3d に載せるための overlay(ADR-0203 追記。§apply の分離)。
#
# `deploy/k8s/overlays/local`(共有)は base 全体(namespace・pokedex・calc・gateway)と mysql を含む。
# `pokedex-migrate` Job は `mysql-auth` Secret(データレーンが `make up`/`scripts/up.sh` で作る。
# .env 由来の値なので Git に置かない)を前提にしており、その Secret が無いクラスタでは Pod が
# `CreateContainerConfigError` のまま残る。API レーンの `make api-k3d-deploy` は他レーンの
# Secret を勝手に作ったり、他レーンのリソースを不完全な状態で持ち込んだりしない
# (CLAUDE.md「サービスは自分の DB にだけ触る」・「人間の確認が必要なこと」)。
#
# そのため `services/gateway/Makefile` の `api-k3d-deploy` は、`mysql-auth` Secret が無いクラスタでは
# ここ(calc・gateway と、それぞれの local overlay の Component のパッチだけ)を適用する。
# Secret があるクラスタ(`make up` 済み)では従来どおり `deploy/k8s/overlays/local` を丸ごと適用する。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pokecalc
resources:
  - ../../base/calc
  - ../../base/gateway
components:
  - ../local/api
