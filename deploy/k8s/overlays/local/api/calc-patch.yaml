# calc-svc に例のマスタ一式の場所を渡す(ADR-0204 §4)。ConfigMap は読み取り専用でマウントする。
# 相性表はマスタ一式(MasterExport)に含まれるので、別の ConfigMap・マウントは要らない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc
spec:
  template:
    spec:
      containers:
        - name: calc
          env:
            - name: CALC_MASTER_PATH
              value: /etc/pokecalc/master.json
          volumeMounts:
            - name: master
              mountPath: /etc/pokecalc/master.json
              subPath: master.json
              readOnly: true
      volumes:
        - name: master
          configMap:
            name: calc-master-example
