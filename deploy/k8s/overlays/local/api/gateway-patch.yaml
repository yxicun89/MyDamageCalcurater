# local overlay だけ Vite の開発サーバのオリジンを CORS で許可する(ADR-0203 §3)。
# GATEWAY_WEB_URL は Web レーンの Service 名(ADR-0205)。base には置かない(クラウドの Web の置き方は未定)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: GATEWAY_CORS_ALLOWED_ORIGINS
              value: http://localhost:5173
            - name: GATEWAY_WEB_URL
              value: http://web
