# local overlay だけ Vite の開発サーバのオリジンを CORS で許可する(ADR-0203 §3)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: GATEWAY_CORS_ALLOWED_ORIGINS
              value: http://localhost:5173
