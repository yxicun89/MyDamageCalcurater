# local overlay 専用の Kustomize Component(ADR-0203 §3)。gateway に Vite の開発サーバのオリジンを CORS で
# 許可する(base は持たない。CORS の許可オリジンは local 専用のため)。
#
# calc へのマスタの渡し方(ConfigMap 経由のファイル方式)は ADR-0206 で廃止した。calc・gateway とも
# pokedex-svc の Service(http://pokedex)を base の環境変数だけで指すので、この Component は calc に patch を
# 当てない(local と local-api が同じ内容の Deployment calc を描画する)。
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: gateway-patch.yaml

images:
  - name: pokecalc/calc
    newName: pokecalc/calc
    newTag: local
  - name: pokecalc/gateway
    newName: pokecalc/gateway
    newTag: local
