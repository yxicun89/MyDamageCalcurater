# ローカル(k3d)専用の MySQL(ADR-0100 §9)。クラウドはマネージド DB を想定するため
# cloud overlay には置かない。Secret mysql-auth はコミットせず scripts/up.sh が作る。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: pokecalc
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: pokecalc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: mysql-root-password
            # pokedex-dsn(secret)が指す DB 名。無いと migrate が
            # 「Unknown database 'pokedex'」で失敗し続ける(初回起動時にだけ効く)。
            - name: MYSQL_DATABASE
              value: pokedex
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/charset.cnf
              subPath: charset.cnf
          # timeoutSeconds の既定は 1 秒。import(全置換の投入)中は CPU 上限(500m)に張り付き、ping が 1 秒を
          # 超えて liveness が失敗 → 取り込みの最中に再起動されていた(2026-09-25 に k3d で再現)。
          # 応答が遅いだけのときに殺さないよう、タイムアウトと失敗回数に余裕を持たせる(約 2 分応答が無ければ再起動)。
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: mysql-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
