# pokedex-svc の Service。クラスタ内だけ(ClusterIP。Ingress は作らない。ADR-0105 §6)。
# 公開の /api/pokedex/* は gateway 経由(ADR-0202)、内部 API は gateway でも 404。
# calc-svc は http://pokedex を使う(ADR-0204 §5)。
apiVersion: v1
kind: Service
metadata:
  name: pokedex
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/part-of: pokecalc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pokedex
  ports:
    - name: http
      port: 80
      targetPort: http
