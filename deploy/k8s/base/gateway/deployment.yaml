# gateway(クライアントの唯一の入口。ADR-0202)。GATEWAY_CALC_URL・GATEWAY_POKEDEX_URL・GATEWAY_RECORD_URL・GATEWAY_TEAM_URL は
# calc・pokedex・record・team の Service 名(クラウドでも同じなので base に置く。ADR-0206 §1)。GATEWAY_ASSETS_URL は画像配信ができるまで
# 未設定(→ 404。ADR-0203 §3)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: pokecalc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: pokecalc
    spec:
      automountServiceAccountToken: false
      # preStop(5秒)+ shutdownTimeout(gateway/cmd/gateway/main.go。5秒)より長い。ADR-0129 §4・issue #324。
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: pokecalc/gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # メトリクス専用ポート(GATEWAY_METRICS_ADDR の既定 :9090)。/metrics はここだけ。Ingress は http のまま
            # (公開入口から見せない。issue #216・ADR-0406 §1 追記)。
            - name: metrics
              containerPort: 9090
          env:
            - name: GATEWAY_CALC_URL
              value: http://calc
            - name: GATEWAY_POKEDEX_URL
              value: http://pokedex
            # record・team の Service 名(クラウドでも同じ。ADR-0220 §1)。TiDB が無くても gateway は起動し、
            # /api/record/*・/api/team/* が 503 upstream_unavailable になるだけ(calc・pokedex は影響しない)。
            - name: GATEWAY_RECORD_URL
              value: http://record
            - name: GATEWAY_TEAM_URL
              value: http://team
            # limits.memory の 64Mi に対して少し余裕を持たせた値(GC が OOMKill の前に働くように)。
            - name: GOMEMLIMIT
              value: 56MiB
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        # イメージ(services/gateway/Dockerfile)の USER 65532:65532 と合わせて明示する。
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
