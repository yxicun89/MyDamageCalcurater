apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: pokecalc
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    # Prometheus(ServiceMonitor)専用。Ingress の backend は http だけ(issue #216)。
    - name: metrics
      port: 9090
      targetPort: metrics
