# gateway はクライアントの唯一の入口(ADR-0202)。ホスト指定なし・path "/" Prefix で全トラフィックを受ける。
# /api/balance/* は gateway が balance へ転送する(GATEWAY_BALANCE_URL。balance の直結 Ingress は撤去。ADR-0414)。
# /api/speed/*・/api/judge/* も同様に gateway が転送する(GATEWAY_SPEED_URL・GATEWAY_JUDGE_URL。直結 Ingress は撤去。ADR-0416)。
#
# この Ingress は local(k3d/Traefik)専用。ホスト指定なし・TLS なしのため、クラウドの一般的な
# Ingress Controller にそのまま渡すと公開ロードバランサーになりうる。cloud overlay では使わない
# (deploy/k8s/overlays/cloud で `$patch: delete` により取り除く。ADR-0210 §2)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: pokecalc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
