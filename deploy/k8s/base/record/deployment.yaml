# record-svc(計算イベントの保存・よく使う相手・お気に入り。ADR-0209・ADR-0211)。
# DB の DSN は Secret record-db-auth の app ロール(SELECT・INSERT・UPDATE・DELETE。ADR-0211 §4)から渡す。
# 起動時に DB へ接続しない(sql.Open だけ)。TiDB・Secret・NATS が無くても Pod は起動し、readiness(/readyz)が
# DB に届くまで Ready にならないだけ。calc・gateway・pokedex には影響しない(CLAUDE.md 絶対ルール5。ADR-0220 §1)。
# 保持日数は ConfigMap record-retention から読む(失効ジョブの CronJob と同じ値)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: record
  labels:
    app.kubernetes.io/name: record
    app.kubernetes.io/part-of: pokecalc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: record
  template:
    metadata:
      labels:
        app.kubernetes.io/name: record
        app.kubernetes.io/part-of: pokecalc
    spec:
      automountServiceAccountToken: false
      # preStop(5秒)+ shutdownTimeout(cmd/record/main.go。10秒)より長い。ADR-0129 §4。
      terminationGracePeriodSeconds: 30
      containers:
        - name: record
          image: pokecalc/record:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: record-retention
          env:
            - name: RECORD_APP_DSN
              valueFrom:
                secretKeyRef:
                  name: record-db-auth
                  key: record-app-dsn
            # 計算イベントの購読(calc と同じ NATS)。NATS が落ちていても起動する。
            - name: RECORD_NATS_URL
              value: nats://nats:4222
            # RECORD_DECAY_HALF_LIFE_DAYS: よく使う相手の時間減衰の半減期(日。ADR-0209 §4 の仮置き。生イベントの保持日数より短いこと)
            - name: RECORD_DECAY_HALF_LIFE_DAYS
              value: "14"
            - name: RECORD_PURGE_BATCH_LIMIT
              value: "500"
            # limits.memory の 128Mi に対して少し余裕を持たせた値(GC が OOMKill の前に働くように)。
            - name: GOMEMLIMIT
              value: 100MiB
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        # イメージ(services/record/Dockerfile)の server ターゲットの USER 65532:65532 と合わせて明示する。
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
