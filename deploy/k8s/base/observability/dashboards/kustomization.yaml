apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 計算API SLO ダッシュボード(ADR-0407 §4)。
# kube-prometheus-stack の Grafana sidecar は grafana_dashboard: "1" ラベルを持つ ConfigMap を
# 自動で読み込む(chart 既定機能)。calc-slo.json をそのまま data に入れて ConfigMap 化する。
# 検査: scripts/observability-slo_test.sh
namespace: observability
configMapGenerator:
  - name: calc-slo-dashboard
    files:
      - calc-slo.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
