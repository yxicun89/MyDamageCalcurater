# team の ServiceMonitor(ADR-0220 §2・ADR-0406 §4)。Service(Kustomize base)は変更せず、
# こちら側からラベルセレクタで参照する。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: team
  namespace: observability
  labels:
    app.kubernetes.io/name: team
    app.kubernetes.io/part-of: pokecalc
spec:
  namespaceSelector:
    matchNames:
      - pokecalc
  selector:
    matchLabels:
      app.kubernetes.io/name: team
  endpoints:
    - port: http
      path: /metrics
