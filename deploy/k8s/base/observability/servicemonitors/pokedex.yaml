# pokedex の ServiceMonitor(ADR-0406 §4)。Service(既存の Kustomize base)は変更せず、
# こちら側からラベルセレクタで参照する。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pokedex
  namespace: observability
  labels:
    app.kubernetes.io/name: pokedex
    app.kubernetes.io/part-of: pokecalc
spec:
  namespaceSelector:
    matchNames:
      - pokecalc
  selector:
    matchLabels:
      app.kubernetes.io/name: pokedex
  endpoints:
    - port: http
      path: /metrics
