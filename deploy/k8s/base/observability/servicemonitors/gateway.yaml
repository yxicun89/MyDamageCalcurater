# gateway の ServiceMonitor(ADR-0406 §4)。Service(Kustomize base。gateway は metrics ポートを足してある)を
# ラベルセレクタで参照する。gateway だけ /metrics をメトリクス専用ポート(metrics)で出す
# (公開入口の http ポートには出さない。issue #216・ADR-0406 §1 追記)。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: pokecalc
spec:
  namespaceSelector:
    matchNames:
      - pokecalc
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  endpoints:
    - port: metrics
      path: /metrics
