# pokecalc の全 Pod の ingress を既定で拒否する。許可は同ディレクトリの allow-*.yaml(ADR-0132)。
# 戻し方: kubectl -n pokecalc delete networkpolicy default-deny-ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
