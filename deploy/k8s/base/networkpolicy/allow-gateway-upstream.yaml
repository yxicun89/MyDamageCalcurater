# gateway から上流(calc・pokedex・web・balance・speed・judge・record・team)の Pod ポート 8080 へ。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-upstream
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [calc, pokedex, web, balance, speed, judge, record, team]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8080
