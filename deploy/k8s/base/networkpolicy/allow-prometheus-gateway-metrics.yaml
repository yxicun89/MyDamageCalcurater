# Prometheus(observability)から gateway のメトリクス専用ポート(9090)へ(issue #216)。
# 公開ポート(8080)の許可は Traefik だけ(allow-traefik-ingress.yaml)なので、Prometheus は /metrics 以外に届かない。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-gateway-metrics
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
