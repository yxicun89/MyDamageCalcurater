# TiDB クラスタ内(pd・tikv・tidb 相互)の通信。同じ instance の Pod 同士だけ。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tidb-internal
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: pokecalc-tidb
      app.kubernetes.io/managed-by: tidb-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: pokecalc-tidb
              app.kubernetes.io/managed-by: tidb-operator
