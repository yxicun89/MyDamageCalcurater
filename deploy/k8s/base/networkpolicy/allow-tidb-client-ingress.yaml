# record-migrate・team-migrate から TiDB(tidb-operator のラベルを想定。TiDB 起動後に要確認。ADR-0132)の 4000 へ。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tidb-client-ingress
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: pokecalc-tidb
      app.kubernetes.io/component: tidb
      app.kubernetes.io/managed-by: tidb-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [record-migrate, team-migrate]
      ports:
        - protocol: TCP
          port: 4000
