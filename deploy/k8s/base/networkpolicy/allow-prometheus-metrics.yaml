# Prometheus(observability)から ServiceMonitor 対象 7 サービスの /metrics(Pod ポート 8080)へ。
# gateway だけはメトリクス専用ポート(9090)なので allow-prometheus-gateway-metrics.yaml で許可する(issue #216)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [calc, pokedex, balance, speed, judge, record, team]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
