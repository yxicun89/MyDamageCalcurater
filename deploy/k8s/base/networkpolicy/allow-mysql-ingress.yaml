# pokedex・migrate Job・importer CronJob から mysql の 3306 へ。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-ingress
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [pokedex, pokedex-migrate, pokedex-import]
      ports:
        - protocol: TCP
          port: 3306
