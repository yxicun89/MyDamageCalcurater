# pokedex・migrate Job・importer CronJob、および balance・speed(initContainer readmodel-export の pokedex export)から mysql の 3306 へ。
# Pod 単位の許可なので balance・speed の本体コンテナも同じ Pod として届く(ADR-0412 §4 追記)。DSN は initContainer にだけ渡す。
# 別アプリ wishlist(apps/wishlist。名前空間 wishlist)の api・migrate Job・refresher CronJob からも許す。
# DB は同じインスタンスの別データベース `wishlist`(専用ユーザー。ユーザー決定 2026-10-03)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-ingress
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [pokedex, pokedex-migrate, pokedex-import, balance, speed]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wishlist
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [wishlist-api, wishlist-migrate, wishlist-refresher]
      ports:
        - protocol: TCP
          port: 3306
