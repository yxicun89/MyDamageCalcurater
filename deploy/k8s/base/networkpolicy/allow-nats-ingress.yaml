# calc(発行)と record・team(購読。ADR-0212・ADR-0213・ADR-0220 §2)から nats の 4222 へ。失効ジョブは NATS に触れない。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats-ingress
  labels:
    app.kubernetes.io/part-of: pokecalc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [calc, record, team]
      ports:
        - protocol: TCP
          port: 4222
