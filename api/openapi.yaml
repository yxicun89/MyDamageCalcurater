openapi: 3.0.3
info:
  title: pokecalc API
  version: 0.1.0
  description: |
    ポケモンチャンピオンズ対応のダメージ計算・構築ビルダー API。
    仕様先行(この YAML が唯一の正)。Go(Echo)/ TypeScript / Swift のコードを生成する。

    ドメイン規約(CLAUDE.md):
    - Lv50 固定、個体値 31 固定。能力ポイント SP は 1ステータス最大 32・合計 66。
    - ステータスキーは Showdown 規約に合わせ hp/atk/def/spa/spd/spe。
    - 認証なし。全リクエストに端末ID(X-Device-Id)とセッションID(X-Session-Id)を付与する(UUID。gateway が検証する。ADR-0202)。
servers:
  - url: /
    description: gateway 経由

tags:
  - name: pokedex
    description: マスタ参照(種族・技・持ち物・特性・性格)
  - name: calc
    description: ダメージ計算・一括計算・逆算・調整(指数・最小 SP・SP 配分。ADR-0250)
  - name: record
    description: |
      計算の記録(自動保存された計算イベントから作る「よく使う相手」の集計・お気に入り)と、
      端末単位の全削除(ADR-0209 §5)。すべて `X-Device-Id` の端末の中だけを見る(ADR-0209 §6)。
      端末 ID はボディ・クエリ・パスで受け取らない(送られたら 400 `unknown_field`)。
  - name: team
    description: |
      構築(パーティ)の CRUD と、端末単位の全削除(ADR-0209 §5・ADR-0213)。
      すべて `X-Device-Id` の端末の中だけを見る(ADR-0209 §6)。端末 ID はボディ・クエリ・パスで
      受け取らない(送られたら 400 `unknown_field`)。他端末の構築 ID を指した要求は 404 `not_found`
      (403 にしない。存在の有無も漏らさない。ADR-0209 §6-2)。

      team-svc は `speciesKey` / `moveIds` / `itemId` / `abilityId` / `natureId` がマスタに実在するかを
      **検証しない**(pokedex-svc の DB に触らない。CLAUDE.md 絶対ルール4・ADR-0213 §3)。ID の妥当性は
      クライアントが pokedex-svc の検索 API から選ばせる時点と、calc-svc が計算時に `unknown_species` 等で
      返す時点で担保する。Showdown 形式のテキストとの相互変換もクライアント側の担当(ADR-0213 §4)。
  - name: internal
    description: |
      サービス間の内部 API(ADR-0204)。gateway は公開しない(`/internal/*` は gateway で 404 `not_found`)。
      クラスタ内の Service からだけ呼ぶ。端末ID(X-Device-Id)/ セッションID(X-Session-Id)は要らない。

paths:
  /api/pokedex/species:
    get:
      tags: [pokedex]
      operationId: searchSpecies
      summary: ポケモンを日本語名で前方一致検索
      description: |
        既定のレギュレーション(コードに書かず DB から引く。ADR-0105)の使用可能集合だけを返す(並びは ID 順)。
        `format` は v1 では結果に影響しない(使用可能集合は形式で分かれていない)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: 日本語名の前方一致(空なら全件・limit まで)
          schema: { type: string }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/Format' }
        - name: limit
          in: query
          description: 範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 一致した種族の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SpeciesSummary' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/species/{key}:
    get:
      tags: [pokedex]
      operationId: getSpecies
      summary: 種族の詳細(タイプ・種族値・特性・覚える技)
      description: |
        使用可能集合の外の種族も返す(絞り込みは検索の仕事)。`abilities` は slot 順、
        `learnset` は習得技 ∩ 既定のレギュレーションの使用可能な技(ID 昇順)。
        `abilities` の各特性は効果を持てば `effect` を伴う(ADR-0218)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: key
          in: path
          required: true
          description: '{図鑑番号4桁}-{フォルム3桁} 例 0445-000。形式が違えば 400 `invalid_input`'
          schema: { $ref: '#/components/schemas/SpeciesKey' }
      responses:
        '200':
          description: 種族詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeciesDetail' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: 該当する種族が無い(`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves:
    get:
      tags: [pokedex]
      operationId: searchMoves
      summary: 技を日本語名で前方一致検索
      description: 既定のレギュレーションの使用可能集合だけを返す(並びは日本語名の照合順序の昇順・同順位は ID 昇順。ADR-0105 §3)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: 日本語名の前方一致(空なら全件・limit まで)
          schema: { type: string }
        - name: limit
          in: query
          description: 範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 技の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Move' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves/{key}:
    get:
      tags: [pokedex]
      operationId: getMove
      summary: 技の詳細(タイプ・分類・威力・優先度)
      description: |
        使用可能集合の外の技も返す(絞り込みは検索の仕事。既定のレギュレーションを引かないため、
        マスタが未投入で技が0件のときも 404 `not_found` になる。0行を 503 にする searchMoves 等の
        一覧系とは異なる。ADR-0105 §3 追記)。判定レーンが技の優先度(`priority`)を個別に引くための
        経路(2026-09-22 の依頼。DECISIONS.md)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: key
          in: path
          required: true
          description: 技の ID(例 highhorsepower)。マスタに無ければ 404 `not_found`
          schema: { type: string }
      responses:
        '200':
          description: 技詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Move' }
        '404':
          description: 該当する技が無い。マスタが未投入(技が0件)のときも同じ(`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves/batch:
    get:
      tags: [pokedex]
      operationId: getMovesByIds
      summary: 技を ID のまとめ取りで解決する
      description: |
        `getMove` の複数版。`getSpecies` の `learnset`(ID配列)のような、既に確定した ID の集合を
        1回の呼び出しで実体(名前・タイプ・分類・威力・優先度)に解決するための経路
        (ADR-0304 §3。Web のオンライン学習技表示の欠落の解消)。`getMove` と同様に既定のレギュレーションで
        絞らない(使用可能集合の外の技も返す)。マスタに無い ID は黙って省く(部分一致は無い。エラーにしない)。
        応答の順序は `ids` と同じ(見つからなかった ID は詰めて省く)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: ids
          in: query
          required: true
          description: |
            技の ID の配列(繰り返しクエリ。例 `?ids=highhorsepower&ids=tackle`)。1〜64件。
            パラメータ自体の省略・65件以上は 400 `invalid_input`。1件の集合が64件を超える場合(例:
            `getSpecies` の `learnset` が64件を超える種族)は、呼び出し側が64件ずつに分割して複数回
            呼ぶこと(1回で必ず収まる集合サイズの保証はしない)。空文字列の要素・重複した ID は
            エラーにせず、マスタに無い ID と同様にその要素だけ結果から省く(一致すれば重複したまま返る)
          schema:
            type: array
            items: { type: string }
            minItems: 1
            maxItems: 64
      responses:
        '200':
          description: 見つかった技の一覧(ids の順。見つからなかった ID は省く。マスタ未投入で0件のときも
            `searchMoves` と異なり 503 ではなく空配列 `[]`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Move' }
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves/{key}/learners:
    get:
      tags: [pokedex]
      operationId: listMoveLearners
      summary: 技を覚えるポケモンの一覧(learnset の逆引き)
      description: |
        技 `key` を覚える種族の要約を返す(調整タブの機能 1。ADR-0251)。既定のレギュレーション
        (コードに書かず DB から引く。ADR-0105)で絞る:
        種族が使用可能集合にあり、かつ技が使用可能集合にあるときだけ返す。`getSpecies` の `learnset`
        (習得技 ∩ 使用可能な技)と同じ規則で、使用可能な種族 S について「S がこの一覧に出る」と
        「`getSpecies(S).learnset` にこの技がある」は一致する。技がマスタにあっても使用可能集合の外なら
        200 `[]`(404 ではない)。
        並びは `searchSpecies` と同じ図鑑番号・フォルム番号の昇順(決定的)。ページングは `limit` と
        `offset`。返った件数が `limit` 未満なら最後のページ(総数は返さない)。
        既定のレギュレーションが無い(マスタ未投入)は 503 `master_unavailable`(一覧系の流儀。
        `getMove` の 404 とは異なる)。既定のレギュレーションはあるが技がマスタに無いときは 404 `not_found`。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: key
          in: path
          required: true
          description: 技の ID(例 highhorsepower)。マスタに無ければ 404 `not_found`
          schema: { type: string }
        - name: limit
          in: query
          description: 1ページの件数。範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          description: 先頭から飛ばす件数。範囲外・整数でない値は 400 `invalid_input`。末尾を超えれば 200 `[]`
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: 技を覚える種族の要約(図鑑番号・フォルム番号の昇順。一致なしは `[]`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SpeciesSummary' }
        '404':
          description: 技がマスタに無い(`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/items:
    get:
      tags: [pokedex]
      operationId: searchItems
      summary: 持ち物を日本語名で前方一致検索
      description: |
        既定のレギュレーションの使用可能集合だけを返す(並びは日本語名の照合順序の昇順・同順位は ID 昇順。ADR-0105 §3)。
        各持ち物は効果を持てば `effect` を伴う(ADR-0218)。各持ち物は計算での役割 `roles` とメガストーンかどうか
        `isMegaStone` を常に伴う(ADR-0175)。役割で絞る検索条件は無い(クライアントが `roles` で絞る。
        オフラインのキャッシュでも同じ式で絞れるようにするため)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: 日本語名の前方一致(空なら全件・limit まで)
          schema: { type: string }
        - name: limit
          in: query
          description: 範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 持ち物の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/natures:
    get:
      tags: [pokedex]
      operationId: listNatures
      summary: 性格の一覧(補正する能力)
      description: 使用可能集合で絞らない(全性格。並びは ID 順。ADR-0105)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 性格一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nature' }
        '503':
          description: gateway から pokedex-svc に届かない、pokedex-svc 自身の過負荷・締め切り超過(`upstream_unavailable`)、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc:
    post:
      tags: [calc]
      operationId: calcDamage
      summary: 1 vs 1 のダメージ計算
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalcRequest' }
      responses:
        '200':
          description: 計算結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalcResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない、または calc-svc 自身の過負荷・締め切り超過(`upstream_unavailable`。ADR-0202・ADR-0801)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/bulk:
    post:
      tags: [calc]
      operationId: calcBulk
      summary: 防御側の代表調整すべてに対する一括計算
      description: |
        攻撃側は1つに固定し、防御側の種族に対して代表的な調整(DefenderPreset)すべての結果を一度に返す(ADR-0009)。
        - 既定セット(`presets` 省略、または `presets: []`): 物理技なら none/hp/hb_boost/hb/hb_full の5件、
          特殊技なら none/hp/hd_boost/hd/hd_full の5件、**変化技は none/hp の2件のみ**。
        - `presets` を指定したときは、その順に行を返す。重複した preset は 400 `duplicate_preset`。
        - 持ち物の差し替え候補(itemVariants)を渡すと調整×持ち物の組合せを返す。null 要素は「持ち物なし」。
        - **行の順序はプリセット優先**(presets × itemVariants。プリセットごとに itemVariants の順に並ぶ)。
          行数は `len(presets) × len(itemVariants)`(itemVariants 省略時は 1)。
        - 各行の `defender` は、その行で使った防御側の SP・性格補正・実数値(ADR-0011 §3 の WASM 境界と同じ形)。
        - 件数の上限(ADR-0208): `presets` は 8 件以下、`itemVariants` は 64 件以下で重複なし。
          超えたものは ID の解決・計算より前に 400 `invalid_input` で拒否する(本文の 1MiB 制限とは別)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCalcRequest' }
      responses:
        '200':
          description: 調整ごとの結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCalcResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない、または calc-svc 自身の過負荷・締め切り超過(`upstream_unavailable`。ADR-0202・ADR-0801)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/reverse:
    post:
      tags: [calc]
      operationId: calcReverse
      summary: 観測ダメージから相手の調整候補を逆算
      description: |
        与えた/受けたダメージの観測から、相手の調整候補(性格クラス × 持ち物ごとの SP の範囲)を返す(ADR-0010 §R)。
        - `side=defender`: 自分が与えたダメージから、相手の防御側(H32 前提で B または D の SP 0..32)を逆算する。
          `known` は自分=攻撃側。
        - `side=attacker`: 自分が受けたダメージから、相手の攻撃側(A または C の SP 0..32)を逆算する。
          `known` は自分=防御側。
        - 候補は「性格クラス(neutral / plus)× itemCandidates」の全組合せで、説明できない候補も最も近い SP 付きで返す。
        - 並びは Mismatch 昇順 → Support 降順 → SPCount 降順 → 定義順(性格クラス neutral→plus、itemCandidates の添字)の
          全順序(ADR-0010 §R4)。`maxCandidates` は並べた後に上から切る。`exactCount` は切る前の値。
        - 件数の上限(ADR-0208): `itemCandidates` は 64 件以下で重複なし、`observations` は 16 件以下、
          `maxCandidates` は 0〜128。超えたものは ID の解決・計算より前に 400 `invalid_input` で拒否する
          (`maxCandidates` は返却件数だけの上限で、計算量は減らないため別に上限を置く)。
        正確さより候補の提示を優先する。複数観測で絞り込む。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '200':
          description: 調整候補
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReverseResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない、または calc-svc 自身の過負荷・締め切り超過(`upstream_unavailable`。ADR-0202・ADR-0801)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/adjust/indices:
    post:
      tags: [calc]
      operationId: adjustIndices
      summary: 調整の指数(火力指数・耐久指数)と HP の 16n / 16n-1 ライン
      description: |
        自分の個体1体の育成で決まる量を返す(ADR-0150 §2〜§4・ADR-0250)。ステートレスで、計算イベントは発行しない。
        - 火力指数 = floor(攻撃実数値 × 威力 × modifier / 4096)。`moveId` を省略したら `firepowerIndex` は null。
          技の分類が physical なら A、special なら C。変化技・威力 0 の技は 400 `invalid_input`。
        - 耐久指数 = floor(H × B(D) × 4096 / damageModifier)。物理・特殊の両方を返す(技は見ない)。
        - 実数値はランク補正を含めない(`individual.ranks`・`status`・`itemId`・`abilityId` は指数に使わない。
          持ち物・特性・タイプ一致の倍率はクライアントが `modifier` / `damageModifier` に掛け合わせて渡す)。
        - HP ラインは `individual.sp.hp` と種族の HP 種族値から求める(合計 66 は見ない。ADR-0150 §4)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustIndicesRequest' }
      responses:
        '200':
          description: 指数と HP ライン
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustIndicesResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/adjust/min-sp-to-ko:
    post:
      tags: [calc]
      operationId: adjustMinSpToKo
      summary: 相手を n 発で倒せる最小の A / C の SP
      description: |
        自分 = `attacker`、相手 = `defender`。自分の A(物理)/ C(特殊)の SP を 0 から探し、`hits` 発で倒す確率が
        `thresholdPercent` 以上になる最小の SP を返す(ADR-0150 §7・ADR-0250)。
        - `attacker.sp` の探索する能力(物理なら atk、特殊なら spa)の値は無視する(上書きする)。それ以外の SP の合計が
          66 を超えると 400 `invalid_input`。
        - 満たせない(上限まで振っても届かない・タイプ相性で無効)ときもエラーにせず `feasible: false` を返す。
        - 変化技・威力 0 の技は 400 `invalid_input`。探索量は `hits`(1〜10)と SP 0〜32 で上限が決まる(ADR-0250 §5)。
        - ステートレスで、計算イベントは発行しない。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustSearchRequest' }
      responses:
        '200':
          description: 最小の SP(または届かないときの上限での結果)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustKOResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/adjust/min-sp-to-survive:
    post:
      tags: [calc]
      operationId: adjustMinSpToSurvive
      summary: 相手の技を n 発耐える最小の H と B / D の SP の組
      description: |
        自分 = `defender`、相手 = `attacker`。自分の H と B(物理)/ D(特殊)の SP の組を探し、`hits` 発受けて耐える
        確率が `thresholdPercent` 以上になる組のうち、合計 SP 最小(同点は耐久指数が大きい → H が小さい)を返す
        (ADR-0150 §7・ADR-0250)。
        - `defender.sp` の hp と探索する能力(物理なら def、特殊なら spd)の値は無視する(上書きする)。
        - 満たせないときもエラーにせず `feasible: false` で、耐える確率が最大の組を返す。
        - 変化技・威力 0 の技は 400 `invalid_input`。探索は最大 33² 組(ADR-0250 §5)。
        - ステートレスで、計算イベントは発行しない。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustSearchRequest' }
      responses:
        '200':
          description: 最小の SP の組(または届かないときの最も耐える組)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustSurviveResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/adjust/allocation:
    post:
      tags: [calc]
      operationId: adjustAllocation
      summary: SP 配分の提案(指数最大の組と、目標を満たす最小 SP の組)
      description: |
        `self.sp` を各能力の下限(「ここまで振りたい」)として固定し、残りの SP(66 − 下限の合計)を `mode` の側に回す
        (ADR-0150 §8・ADR-0250)。
        - `mode: bulk` は H・B・D に回す(素早さは見ない)。`focus` が必須。`minSpeed` は 0 以外なら 400 `invalid_input`。
        - `mode: offense` は A(`offenseCategory: physical`)または C(`special`)と S に回す。`offenseCategory` が必須。
        - `ceiling` は回す能力の上限。**省略した能力は 32**(engine のゼロ値「振らない」をそのまま渡さない。ADR-0150 §8)。
          明示した 0 は「下限より上には振らない」。下限 ≤ 上限 ≤ 32 でなければ 400 `invalid_input`。
        - `goal` を渡したときだけ `minSp` を返す(省略時は null)。判定は min-sp-to-ko / min-sp-to-survive と同じ。
        - 探索は耐久側で最大 33³ ≈ 3.6 万候補、攻撃側で 33² 候補(ADR-0250 §5)。ステートレスで、計算イベントは発行しない。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustAllocationRequest' }
      responses:
        '200':
          description: 提案する SP の組
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustAllocationResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/record/frequent-opponents:
    get:
      tags: [record]
      operationId: listFrequentOpponents
      summary: この端末でよく計算した相手(防御側の種族)を頻度×時間減衰の順に返す
      description: |
        `X-Device-Id` の端末の計算イベント(`calc_events`)だけから作った集計を、スコアの降順で返す
        (requirements.md §2「よく使うポケモン」・ADR-0209 §3 #2・§6-3)。他端末のイベントは混ぜない。

        - スコアは「頻度 × 時間減衰(半減期は record-svc の設定。生イベントの保持期間 90日より短い。ADR-0209 §4)」で、
          絶対値に意味は無い(並び順と相対比較のためだけの値)。
        - 返すのは `speciesKey` だけで、名前・タイプ・画像は返さない(マスタは pokedex-svc の担当。
          CLAUDE.md 絶対ルール4)。クライアントは必要なら `/api/pokedex/species/{key}` を引く。
        - 記録が1件も無い端末は空配列(404 にしない)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          description: 返す上限。範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: スコアの降順(同点は speciesKey の昇順)。記録が無ければ空配列
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FrequentOpponent' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            record-svc が TiDB に届かない(`store_unavailable`)、または gateway から record-svc に届かない
            (`upstream_unavailable`。ADR-0202・ADR-0209 §5.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/record/device-data:
    delete:
      tags: [record]
      operationId: deleteRecordDeviceData
      summary: この端末の記録(計算イベント・集計・お気に入り)をすべて削除する
      description: |
        X-Device-Id の端末に紐づく record DB の行をすべて消す(ADR-0209 §5)。冪等で、
        何も無い端末でも 200 `completed` を返す(404 にしない)。1回で消しきれない場合は
        `partial` を返すので、同じ要求を `completed` になるまで繰り返す。
        削除の時点を墓石として記録し、それ以前に発生した計算イベントが JetStream から
        後から届いても保存しない(ADR-0209 §7)。team DB は消さないので、
        クライアントは `DELETE /api/team/device-data` も呼ぶ。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 削除の結果(`partial` なら残りがある)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDeletionResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: record-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/record/favorites:
    get:
      tags: [record]
      operationId: listFavorites
      summary: この端末のお気に入り(手動ピン留めした個体)を一覧する
      description: |
        `X-Device-Id` の端末のお気に入りだけを、更新の新しい順(同時刻は `id` の新しい順)で返す
        (requirements.md §2「お気に入り(手動ピン留め)」・ADR-0209 §3 #3・§6-1・§6-3・ADR-0227)。
        他端末のお気に入りは混ざらない。1件も無ければ空配列(404 にしない)。

        ページングは持たない(1端末が持てるお気に入りは **100件**で頭打ちなので、一覧は常に有限で小さい。ADR-0227 §3)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: この端末のお気に入り(更新の新しい順)。無ければ空配列
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/Favorite' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            record-svc が TiDB に届かない(`store_unavailable`)、または gateway から record-svc に届かない
            (`upstream_unavailable`。ADR-0202・ADR-0209 §5.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    post:
      tags: [record]
      operationId: createFavorite
      summary: 個体を1つお気に入りにする(ピン留め)
      description: |
        ピン留めした時点の個体を**スナップショットとして**保存する(計算イベントを参照しない。ADR-0209 §3 #3)。
        任意の `calc` を付けると、その時点の計算の入力全体(`CalcRequest`)も一緒に保存し、一覧から選んで
        そのまま `POST /api/calc` を呼べる(ADR-0228)。
        `id` と `createdAt` / `updatedAt` はサーバーが決める(要求に含めたら 400 `unknown_field`)。

        - **冪等**: この端末に同じ内容(`label` と、既定値を補った `individual`)のお気に入りがすでにあれば、
          新しく作らずにそれを **200** で返す(`updatedAt` だけ現在時刻に進むので一覧の先頭に来る)。
          新しく作ったときは **201**。二重送信で同じピンが2つにならない(ADR-0227 §2)。
        - 1端末が持てるお気に入りは **100件**まで。上限に達している端末からの(重複でない)作成は 400 `invalid_input`。
        - 既定値を補った保存内容が 4096 バイトを超える作成は 400 `invalid_input`(ADR-0228 §3)。
        - `individual.speciesKey` などの ID はマスタと照合しない(record-svc は pokedex-svc に依存しない。
          存在しない ID でも保存できる。ADR-0227 §2・ADR-0213 §3 と同じ理由)。形式と範囲(SP・ランク・ラベルの長さ)は検証する。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteInput' }
      responses:
        '200':
          description: 同じ内容のお気に入りがすでにあった(新しく作らず、`updatedAt` を進めた既存のものを返す)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '201':
          description: 作ったお気に入り(サーバーが決めた `id` と時刻を含む)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: record-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/record/favorites/{favoriteId}:
    delete:
      tags: [record]
      operationId: deleteFavorite
      summary: お気に入りを1つ削除する(ピン留めを外す)
      description: |
        成功は 204(本文なし)。先に端末 ID で絞ってから `favoriteId` を照合する(ADR-0209 §6-2)。
        この端末が持っていない `favoriteId`(他端末のもの・実在しないもの・形式が違うものを区別しない)は 404 `not_found`。
        同じお気に入りをもう一度削除しても 404(1件の削除は「消した」と「もともと無い」を区別する。ADR-0213 §2 と同じ)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FavoriteId'
      responses:
        '204':
          description: 削除した(本文なし)
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          description: record-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/team/teams:
    get:
      tags: [team]
      operationId: listTeams
      summary: この端末の構築を一覧する
      description: |
        `X-Device-Id` の端末の構築だけを、更新の新しい順(同時刻は `id` の昇順)で返す
        (ADR-0209 §6-1・§6-3)。他端末の構築は混ざらない。1件も無ければ空配列(404 にしない)。

        メンバーまで含めた完全な `Team` を返す。ページングは持たない(1端末が持てる構築は
        **100件**で頭打ちなので、一覧は常に有限で小さい。ADR-0213 §2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: この端末の構築(更新の新しい順)。無ければ空配列
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            team-svc が TiDB に届かない(`store_unavailable`)、または gateway から team-svc に届かない
            (`upstream_unavailable`。ADR-0202・ADR-0209 §5.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    post:
      tags: [team]
      operationId: createTeam
      summary: 構築を1つ作る
      description: |
        `id` と `createdAt` / `updatedAt` はサーバーが決める(要求には含めない。含めたら 400 `unknown_field`)。
        1端末が持てる構築は **100件**まで。上限に達している端末からの作成は 400 `invalid_input`(ADR-0213 §2)。
        `name` は省略できる。省略・空なら既定名「名称未設定」で保存する(ADR-0229)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: 作った構築(サーバーが決めた `id` と時刻を含む)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/team/teams/{teamId}:
    get:
      tags: [team]
      operationId: getTeam
      summary: 構築を1つ取得する
      description: |
        先に端末 ID で絞ってから `teamId` を照合する(ADR-0209 §6-2)。この端末が持っていない
        `teamId`(他端末のもの・実在しないもの・形式が違うものを区別しない)は 404 `not_found`。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: 構築
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    put:
      tags: [team]
      operationId: updateTeam
      summary: 構築を丸ごと置き換える
      description: |
        名前とメンバー全体を要求の内容で置き換える(部分更新・メンバー個別の更新は持たない。ADR-0213 §2)。
        `members` を省略した場合は「メンバーなし」に置き換わる(消し忘れではなく明示の置換として扱う)。
        `name` を省略・空にした場合は既定名「名称未設定」に置き換わる(前の名前を残さない。ADR-0229)。
        この端末が持っていない `teamId` は 404 `not_found`(ADR-0209 §6-2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: 置き換えた後の構築(`updatedAt` は更新される)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    delete:
      tags: [team]
      operationId: deleteTeam
      summary: 構築を1つ削除する
      description: |
        成功は 204(本文なし)。この端末が持っていない `teamId` は 404 `not_found` で、
        同じ構築をもう一度削除しても 404 になる(端末単位の全削除 `deleteTeamDeviceData` とは違い、
        1件の削除は「消した」と「もともと無い」を区別する。ADR-0213 §2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: 削除した(本文なし)
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/team/device-data:
    delete:
      tags: [team]
      operationId: deleteTeamDeviceData
      summary: この端末の構築をすべて削除する
      description: |
        X-Device-Id の端末に紐づく team DB の行(構築とその個体)をすべて消す。
        冪等性・`partial` の扱いは deleteRecordDeviceData と同じ(ADR-0209 §5)。
        削除の時点を墓石として記録し、それ以前に発生した計算イベントが JetStream から
        後から届いても `devices.last_seen_at` を進めない(ADR-0209 §7・ADR-0213 §5)。
        record DB は消さないので、クライアントは `DELETE /api/record/device-data` も呼ぶ。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 削除の結果(`partial` なら残りがある)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDeletionResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /internal/pokedex/master:
    get:
      tags: [internal]
      operationId: getMasterExport
      summary: 計算用のマスタ一式(pokedex-svc → calc-svc)
      description: |
        pokedex-svc が自分の DB(マスタの正本。CLAUDE.md 絶対ルール4)から、calc-svc が計算に使うマスタ一式を
        DB の行に近い形で返す(ADR-0204)。calc-svc は起動時に1度取得し、`services/internal/master` の写像で
        engine の型にしてメモリに載せる(取得後の再取得はしない。マスタの更新は calc-svc の再起動で反映する)。
        - 使用可能集合(レギュレーション)で絞らない。計算は全件を扱える必要がある(絞り込みは pokedex の検索の仕事)。
        - 並び順に意味は持たせない(タイプの表示順は `types[].sortOrder`)。
        - gateway は公開しない。端末ID/セッションID は要らない。
      responses:
        '200':
          description: マスタ一式
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterExport' }
        '503':
          description: マスタを返せない(DB に未投入・DB に接続できない。`master_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        クライアント生成の端末 UUID(正準形 8-4-4-4-12 の16進。大文字小文字・版は問わない)。
        gateway が検証する(ADR-0202): 欠落・空は 400 `missing_header`、UUID でない値・同名ヘッダの重複は 400 `invalid_header`。
        下流のサービスは UUID 形式を検証しない(生成型は string のまま。x-go-type)。

        保存データ(record / team。M2)では、この値を**データの分割キー**として使う。秘密ではなく所有権の証明でもない
        (**認証ではない**)ので、v1 の公開範囲は個人利用 + Tailscale 内に限る。端末 ID が変わると前のデータには戻れない。
        公開範囲・保持期間・端末単位の全削除は ADR-0209。
      schema:
        type: string
        format: uuid
        x-go-type: string
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      description: |
        セッション UUID(形式と gateway の検証は X-Device-Id と同じ。ADR-0202)。

        保存データでは、計算イベントに「どの一連の操作か」として記録するだけで、**分割キーにはしない**
        (データの分離・削除・保持期間の判定は端末 ID だけで行う。ADR-0209 §2)。
      schema:
        type: string
        format: uuid
        x-go-type: string
    TeamId:
      name: teamId
      in: path
      required: true
      description: |
        構築の ID(作成時にサーバーが発行する UUID。ADR-0213 §2)。
        端末 ID は**パスに含めない**(ヘッダだけが正。ADR-0209 §2・§6-4)。
        この端末が持っていない ID は、他端末のものか実在しないかを区別せず 404 `not_found`(§6-2)。
      schema: { $ref: '#/components/schemas/TeamId' }
    FavoriteId:
      name: favoriteId
      in: path
      required: true
      description: |
        お気に入りの ID(作成時にサーバーが発行する。ADR-0227 §2)。端末 ID は**パスに含めない**(ヘッダだけが正。ADR-0209 §2・§6-4)。
        この端末が持っていない ID は、他端末のもの・実在しないもの・形式が違うものを区別せず 404 `not_found`(§6-2)。
      schema: { $ref: '#/components/schemas/FavoriteId' }

  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: |
        エラーの本文。HTTP ステータスは `code` から決まる(ErrorCode の対応表)。
        `message` は日本語の説明で、Go の内部情報(スタック・型名)を含めない。
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    ErrorCode:
      type: string
      description: |
        安定したエラーコード。WASM 境界(engine/wasmapi の Code* 定数。ADR-0011 §5・§13)と語彙を共通にし、
        **同じ失敗は HTTP と WASM で同じ code** になる(ADR-0200)。

        WASM 境界と共通:
        | code | 意味 | HTTP |
        |---|---|---|
        | invalid_json | JSON として壊れている / 型が合わない(整数のフィールドに小数を含む) | 400 |
        | unknown_field | 契約にないフィールド | 400 |
        | invalid_enum | 列挙(形式・タイプ・天候・フィールド・状態異常)の値が未知 | 400 |
        | invalid_input | 入力検証(SP の範囲・合計、ランク、レベル、性格が HP など)。候補・観測の件数上限(`maxItems`)超過、持ち物候補の重複(`uniqueItems`)、`maxCandidates` の範囲外を含む(ADR-0208)。calc-svc では `sp` と StatBlock の6キー(null 値を含む)の欠落も含む(ADR-0200 §4)。`getMovesByIds` の `ids` の件数超過・欠落も含む。調整(`/api/calc/adjust/*`)の発数・しきい値・補正・上限(ceiling)の範囲外、変化技での探索、下限が上限を超える配分(ADR-0250)も含む。team では構築名の長さ・メンバー数・技の重複・SP の範囲と合計・1端末が持てる構築の上限(ADR-0213 §2)も含む。record のお気に入りではラベルの長さ・個体の範囲・speciesKey の形式・1端末が持てるお気に入りの上限(ADR-0227 §3)も含む | 400 |
        | unknown_preset | 未知の防御側プリセット | 400 |
        | duplicate_preset | 防御側プリセットの重複 | 400 |
        | invalid_preset | 防御側プリセットの定義が不正 | 400 |
        | invalid_reverse_side | 逆算の side が defender / attacker のどちらでもない | 400 |
        | no_observation | 観測が1件も無い | 400 |
        | invalid_observation | 観測の指定が不正(percent / percentTenths / damage のちょうど1つでない・範囲外) | 400 |
        | type_chart_missing | タイプ相性表が無い(HTTP では常にマスタ = 起動時に読み込んだ Store 側の不備で、クライアントの入力起因では起こらない) | 500 |
        | invalid_type_chart | タイプ相性表の定義が不正(同上。HTTP では常にマスタ側の不備) | 500 |
        | unknown_type | 相性表に無いタイプ | 400 |
        | internal | 上記以外の失敗(回復した panic を含む) | 500 |

        HTTP だけのもの:
        | code | 意味 | HTTP |
        |---|---|---|
        | missing_header | X-Device-Id / X-Session-Id が無い・空 | 400 |
        | invalid_header | X-Device-Id / X-Session-Id が UUID でない・同名ヘッダの重複(UUID 形式の検証は gateway だけが行う。ADR-0202) | 400 |
        | unknown_species | speciesKey がマスタに無い | 400 |
        | unknown_move | moveId がマスタに無い | 400 |
        | unknown_item | itemId がマスタに無い | 400 |
        | unknown_ability | abilityId がマスタに無い | 400 |
        | unknown_nature | natureId がマスタに無い | 400 |
        | not_found | ルートが無い / このサービスの担当外の操作 / この端末が持っていないリソース ID(他端末のものか実在しないかを区別しない。403 にしない。ADR-0209 §6-2) | 404 |
        | master_unavailable | マスタ(pokedex の MySQL)を参照できない | 503 |
        | store_unavailable | 保存データの DB(record / team の TiDB)を参照できない。`master_unavailable` と分けるのは原因も復旧手順も別で、「計算はできるが保存はできない」状態(CLAUDE.md 絶対ルール5)をクライアントが区別できる必要があるため(ADR-0209 §5.3) | 503 |
        | upstream_unavailable | gateway から下流のサービスに届かない(接続できない・タイムアウト・上流が未設定。ADR-0202)。calc・pokedex は自サービスの過負荷・締め切り超過でも返す(ADR-0801) | 503 |
      enum: [invalid_json, unknown_field, invalid_enum, invalid_input,
             unknown_preset, duplicate_preset, invalid_preset,
             invalid_reverse_side, no_observation, invalid_observation,
             type_chart_missing, invalid_type_chart, unknown_type, internal,
             missing_header, invalid_header, unknown_species, unknown_move, unknown_item, unknown_ability, unknown_nature,
             not_found, master_unavailable, store_unavailable, upstream_unavailable]

    Format:
      type: string
      description: |
        対戦形式。計算(/api/calc・/api/calc/bulk・/api/calc/reverse)では double のとき次を掛ける(issue 232 案B のダブル分・ADR-0222)。
        - 防御側の壁(リフレクター・ひかりのかべ・オーロラベール): ×2732/4096(single は ×1/2)。急所は壁を無視する
        - 全体技(技の対象が相手全体・自分以外全体): 基礎ダメージに ×3072/4096(天候・急所より前)。
          1対1の計算なので、全体技は常に2体以上に当たる前提で掛ける。味方の効果(てだすけ等)は扱わない
        技の対象をマスタが持たない間(issue 288)は、double の攻撃技に UnsupportedMark
        (target=move・reason=move_target_unknown)を付け、全体技の補正は掛けない(壁は掛ける)。
        double は計算に反映するので形式の印は付けない。engine に未知の形式が届いたときだけ安全側で
        target format・reason unsupported_effect の印が付く(ADR-0160・ADR-0222 §5)。
      enum: [single, double]
      default: single

    SpeciesKey:
      type: string
      description: '{図鑑番号4桁}-{フォルム3桁}'
      pattern: '^[0-9]{4}-[0-9]{3}$'
      example: '0445-000'

    StatKey:
      type: string
      enum: [hp, atk, def, spa, spd, spe]

    PokeType:
      type: string
      enum: [normal, fire, water, electric, grass, ice, fighting, poison, ground,
             flying, psychic, bug, rock, ghost, dragon, dark, steel, fairy]

    MoveCategory:
      type: string
      enum: [physical, special, status]

    StatusCondition:
      type: string
      enum: [none, burn, paralysis, poison, badly_poison, sleep, freeze]
      default: none

    Weather:
      type: string
      enum: [none, sun, rain, sand, snow]
      default: none

    Terrain:
      type: string
      enum: [none, electric, grassy, misty, psychic]
      default: none

    SpeciesSummary:
      type: object
      required: [key, dexNo, form, nameJa, types]
      properties:
        key: { $ref: '#/components/schemas/SpeciesKey' }
        dexNo: { type: integer }
        form: { type: integer, description: フォルム番号 }
        nameJa: { type: string }
        types:
          type: array
          items: { $ref: '#/components/schemas/PokeType' }
          minItems: 1
          maxItems: 2

    SpeciesDetail:
      allOf:
        - $ref: '#/components/schemas/SpeciesSummary'
        - type: object
          required: [baseStats, abilities]
          properties:
            baseStats: { $ref: '#/components/schemas/StatBlock' }
            abilities:
              type: array
              items: { $ref: '#/components/schemas/Ability' }
            learnset:
              type: array
              description: 覚える技の ID 一覧
              items: { type: string }
            baseSpeciesKey:
              type: string
              nullable: true
              description: |
                メガシンカ前の種族キー(ADR-0175)。メガでなければ null。pokedex-svc は null でもキーを常に返す
                (`requiredItemId` と同じ扱い)。古いサーバーは返さないため、クライアントは省略も null も「不明」と読む。
            baseSpeciesNameJa:
              type: string
              nullable: true
              description: |
                メガシンカ前の種族の日本語名(ADR-0175)。メガでなければ null。pokedex-svc は null でもキーを常に返す。
                メガ種族の持ち物を固定したときの表示「<基本種名>のメガストーン」に使う(メガストーンの日本語名は生成しない。ADR-0324 §2)。
                null・省略のときクライアントは名前を推測せず、基本種名を含まない文言にする。
            isMega:
              type: boolean
              description: |
                メガシンカ後の種族か(docs/mega-evolution-spec.md。issue 515)。pokedex-svc は常に返す。
                古いサーバーは返さないため、省略は「メガではない」と同じ扱い(クライアントの互換のため required にしていない)。
            requiredItemId:
              type: string
              nullable: true
              description: |
                メガシンカに要る持ち物(メガストーン)の ID。メガでなければ null。pokedex-svc は null でもキーを常に返す
                (ADR-0218 の `effect` は「キーごと省く」ので逆。クライアントは省略も null も「メガではない」と読む)。
                isMega が true の種族は、この ID の持ち物を持つ前提(クライアントが持ち物を固定する。ADR-0200 §4 の検証と同じ規則)。

    StatBlock:
      type: object
      description: 6ステータスの値(種族値・実数値・SPなどに共用)
      required: [hp, atk, def, spa, spd, spe]
      properties:
        hp: { type: integer }
        atk: { type: integer }
        def: { type: integer }
        spa: { type: integer }
        spd: { type: integer }
        spe: { type: integer }

    RankBlock:
      type: object
      description: ランク補正(-6..+6)。HP は持たない
      properties:
        atk: { type: integer, minimum: -6, maximum: 6, default: 0 }
        def: { type: integer, minimum: -6, maximum: 6, default: 0 }
        spa: { type: integer, minimum: -6, maximum: 6, default: 0 }
        spd: { type: integer, minimum: -6, maximum: 6, default: 0 }
        spe: { type: integer, minimum: -6, maximum: 6, default: 0 }

    Ability:
      type: object
      required: [id, nameJa]
      properties:
        id: { type: string }
        nameJa: { type: string }
        effect:
          allOf: [ { $ref: '#/components/schemas/MasterEffect' } ]
          description: |
            特性の効果定義(ability_effects の JSON。`getMasterExport` の `MasterAbility.effect` と同じ値・同じ形。
            issue 211・ADR-0218)。効果を持たない特性は**キーごと省く**(null を返さない)。
            pokedex-svc は返す前に共通マスタ(`services/internal/master.DecodeAbilityEffect`)で厳格に検証し、
            検証を通らない効果を含む応答は返さない(503 `master_unavailable`)。古いサーバーはこのキーを
            返さないため、クライアントは「キーが無い」を「効果なし」と「効果データを返さない版」の
            どちらとも区別できない。区別はクライアントの capabilities で行う(ADR-0304 A-1・ADR-0218 §4)。

    Move:
      type: object
      required: [id, nameJa, type, category, power]
      properties:
        id: { type: string }
        nameJa: { type: string }
        type: { $ref: '#/components/schemas/PokeType' }
        category: { $ref: '#/components/schemas/MoveCategory' }
        power: { type: integer, description: 威力(0 は変化技/固定ダメージ) }
        priority: { type: integer, default: 0 }
        target:
          type: string
          enum: [single, spread]
          # Format の single と定数名が衝突しないよう名前を明示する(衝突すると oapi-codegen が既存の定数名を変える)。
          x-enum-varnames: [MoveTargetSingle, MoveTargetSpread]
          description: |
            技の対象の分類(issue 288・ADR-0223)。ダブルの計算に使う: `spread` は相手の場の複数に当たる全体技
            (Showdown の allAdjacent・allAdjacentFoes。ダブルで ×3072/4096)、`single` はそれ以外(単体技・自分・味方・場の技)。
            値は engine の `MoveTarget`(WASM の技の `target`)と同じで、クライアントはそのまま渡せる。
            pokedex-svc がマスタの対象(`MasterMove.target` の Showdown の文字列)から分類して返す。
            対象がまだ取り込まれていない技は**キーごと省く**(null を返さない)。古いサーバーもこのキーを返さないため、
            クライアントは「キーが無い」を不明として扱う(ダブルの計算では単体として計算し、未対応の印 move_target_unknown が付く)。

    Item:
      type: object
      required: [id, nameJa]
      properties:
        id: { type: string }
        nameJa: { type: string }
        effect:
          allOf: [ { $ref: '#/components/schemas/MasterEffect' } ]
          description: |
            持ち物の効果定義(item_effects の JSON。`getMasterExport` の `MasterItem.effect` と同じ値・同じ形。
            issue 211・ADR-0218)。効果を持たない持ち物は**キーごと省く**(null を返さない)。
            pokedex-svc は返す前に共通マスタ(`services/internal/master.DecodeItemEffect`)で厳格に検証し、
            検証を通らない効果を含む応答は返さない(503 `master_unavailable`)。
        roles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ItemRole' }
          description: |
            ダメージ計算での役割(ADR-0175 §1)。`attacker` は攻撃側で持つとダメージが変わる(または未対応の印が付く)持ち物、
            `defender` は防御側で持つとダメージが変わる持ち物。両方なら両方(並びは attacker → defender)。
            効果を持たない持ち物とメガストーンは空配列。pokedex-svc は効果データから導いて常に返す(空配列可)。
            クライアントはその側の役割を含む持ち物だけを選択肢にする(効果データから再導出しない)。
            古いサーバー・古いキャッシュは返さないため、省略は「役割が不明(絞らない)」と読む。
        isMegaStone:
          type: boolean
          description: |
            メガストーンか(ADR-0175 §2)。いずれかのメガ種族の `requiredItemId` に現れる持ち物が true。
            使用可能集合で絞らずに判定する。pokedex-svc は常に返す。メガストーンの `roles` は常に空配列。
            古いサーバーは返さないため、省略は「不明」と読む。

    ItemRole:
      type: string
      description: 持ち物のダメージ計算での役割(ADR-0175)
      enum: [attacker, defender]
      # ReverseSide の attacker / defender と定数名が衝突しないよう名前を明示する。
      x-enum-varnames: [ItemRoleAttacker, ItemRoleDefender]

    Nature:
      type: object
      required: [id, nameJa]
      properties:
        id: { type: string, example: adamant }
        nameJa: { type: string, example: いじっぱり }
        plus:
          description: 上昇補正(+10%)を受ける能力。無補正性格は null
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
        minus:
          description: 下降補正(-10%)を受ける能力。無補正性格は null
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]

    Individual:
      type: object
      description: 計算に使う個体。SP と性格 ID から実数値を導出する
      required: [speciesKey, natureId, sp]
      properties:
        speciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        level: { type: integer, minimum: 50, maximum: 50, default: 50 }
        natureId: { type: string }
        abilityId: { type: string, nullable: true }
        itemId:
          type: string
          nullable: true
          description: |
            持ち物。メガシンカ後の種族(isMega)は、その requiredItemId の持ち物か持ち物なし(null・省略)だけ受け付け、
            別の持ち物は 400 `invalid_input`(ADR-0200 §4)。
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 能力ポイント。各 0..32、合計 <= 66
        ranks: { $ref: '#/components/schemas/RankBlock' }
        teraType:
          description: |
            テラスタイプ。省略・null はテラスタル無し(従来どおり)。ポケモンチャンピオンズ本編には無いが、
            指定したときだけテラスタル済みとして計算に反映する(オプションの機能。ADR-0224)。照合の正は
            @smogon/calc 0.12.0 の Champions 世代: 攻撃側はタイプ一致補正(テラス=元タイプ=技 ×2.0、
            テラスだけ一致 ×1.5、てきおうりょくはテラス=元タイプ ×2.25・テラスだけ一致 ×2.0)に、
            両側とも「そのタイプを持つか」の判定(接地・サイコフィールドの先制技・すなあらし/ゆきの防御補正)に使う。
            防御側のテラスはタイプ相性に反映しない(照合先の Champions 世代の挙動。本編 SV とは違う)ので、
            防御側に指定すると結果の unsupported に target defender_tera_type・reason unsupported_effect・
            id テラスタイプの印が付く(ADR-0160・ADR-0224 §3)。攻撃側のテラスには印を付けない。
          nullable: true
          allOf: [ { $ref: '#/components/schemas/PokeType' } ]
        status: { $ref: '#/components/schemas/StatusCondition' }

    Screens:
      type: object
      properties:
        reflect: { type: boolean, default: false }
        lightScreen: { type: boolean, default: false }
        auroraVeil: { type: boolean, default: false }

    FieldState:
      type: object
      properties:
        weather: { $ref: '#/components/schemas/Weather' }
        terrain: { $ref: '#/components/schemas/Terrain' }
        attackerScreens: { $ref: '#/components/schemas/Screens' }
        defenderScreens: { $ref: '#/components/schemas/Screens' }

    CalcOptions:
      type: object
      properties:
        critical: { type: boolean, default: false, description: 急所 }

    CalcRequest:
      type: object
      required: [format, attacker, defender, moveId]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        attacker: { $ref: '#/components/schemas/Individual' }
        defender: { $ref: '#/components/schemas/Individual' }
        moveId: { type: string, description: 使用する技 }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }

    KOChance:
      type: object
      description: 確定数/乱数n発
      required: [hits, guaranteed, displayChancePercent]
      properties:
        hits: { type: integer, description: 最大ダメージで倒すのに必要な攻撃回数(0 = 倒せない) }
        guaranteed: { type: boolean, description: 最小ダメージでも hits 回で倒せるなら true(確定n発) }
        chancePercent:
          type: number
          format: double
          description: |
            engine の生値。guaranteed が false のとき、hits 回で倒せる確率(%)を丸めずに返す
            (ADR-0006)。guaranteed が true のとき、および hits = 0(倒せない)のときは 0。
            **画面に出す値ではない**(確定なのに 0% と誤表示されるため)。表示には
            displayChancePercent を使う。
        displayChancePercent:
          type: number
          format: double
          description: |
            画面に出す「hits 回で倒せる確率(%)」。常に表示できる値であることを保証する。
            小数第1位(0.1%刻み。ADR-0010 §3)。
            - hits = 0(倒せない): 0
            - guaranteed = true(確定 n 発): 100.0
            - それ以外: chancePercent を 0.1% 単位に四捨五入し、[0.1, 99.9] に収める
              (確定・不可能と取り違えないため、0.0 と 100.0 はこの2つに予約する)

    UnsupportedMark:
      type: object
      description: |
        「この結果は正しくない可能性がある」印1つ(ADR-0123)。engine が正しく計算できない技の機構・
        持ち物・特性と、タイプ相性に反映しない防御側のテラスタイプ・未知の対戦形式(ADR-0160・ADR-0222 §5・
        ADR-0224 §3)に、数値は通常の式のまま付ける(400 で拒否しない)。
      required: [target, reason, id]
      properties:
        target:
          type: string
          description: |
            印の対象。現在の値は move・attacker_item・attacker_ability・defender_item・defender_ability・
            attacker_tera_type・defender_tera_type・format(並びもこの順)。format は engine に未知の形式が
            届いたときだけ(double は計算に反映するので付かない。ADR-0222 §5)。attacker_tera_type は
            攻撃側のテラスを計算に反映したので現在は付かない(値は互換のため残す。ADR-0224 §3)。
            値を足しても古いクライアントが応答全体をデコードできなくなるのを避けるため、enum にしない
            (クライアントは未知の値を「対象不明の印」として扱い、id をそのまま表示する。ADR-0215)。
        reason:
          type: string
          description: |
            印の理由。技は機構の値(MasterMove.mechanisms と同じ13種: alt_defense_stat・alt_offense_stat・
            always_crit・effectiveness_change・field_specific・fixed_damage・ignore_defense_ranks・
            move_specific・multi_hit・ohko・priority_change・type_change・variable_power)か
            zero_power(威力0の攻撃技。威力が技の処理で決まるため)・move_target_unknown(double で技の対象が
            不明なため全体技の補正を判断できない。ADR-0222)、持ち物・特性は
            unsupported_effect(効果スキーマで表せない)、防御側のテラスタイプ・未知の対戦形式も unsupported_effect
            (効果を計算に反映していない。防御側のテラスはタイプ相性に反映しない。ADR-0160・ADR-0224 §3)。target と同じ理由で enum にしない
            (クライアントは未知の値を汎用の文言で扱う。ADR-0215)。
        id:
          type: string
          description: |
            技・持ち物・特性の ID。target が attacker_tera_type / defender_tera_type のときはテラスタイプ
            (PokeType の値)、format のときは対戦形式(Format の値)。

    CalcResult:
      type: object
      required: [rolls, minDamage, maxDamage, minPercent, maxPercent, defenderHP, effectiveness, stab, category, ko, unsupported]
      properties:
        rolls:
          type: array
          description: 16 段階の乱数ダメージ(非減少)
          items: { type: integer }
          minItems: 16
          maxItems: 16
        minDamage: { type: integer }
        maxDamage: { type: integer }
        minPercent:
          type: number
          format: double
          description: |
            最小ダメージの表示%(防御側 HP に対する割合)。小数第1位(0.1%刻み)で、
            **切り捨て**る(「最低これくらい入る」を保守的に示すため。ADR-0010 §3)。
            整数%に丸めてから小数にした値ではない。HP 比率から直接求める。
            engine の 0.1% 単位の整数(tenths)を 10 で割っただけの値で、float で近似しない。
        maxPercent:
          type: number
          format: double
          description: |
            最大ダメージの表示%(防御側 HP に対する割合)。小数第1位(0.1%刻み)で、
            **四捨五入**する(ADR-0010 §3)。
            100 を超える場合は上限で切らず、そのまま返す(例 137.0)。
            逆算の入力の観測%(`Observation.percent` / `percentTenths`)とは別概念。
        defenderHP: { type: integer }
        effectiveness:
          type: number
          format: double
          description: タイプ相性(0, 0.25, 0.5, 1, 2, 4)
        stab: { type: boolean, description: タイプ一致 }
        category:
          allOf: [ { $ref: '#/components/schemas/MoveCategory' } ]
          description: 使った技の分類(WASM 境界の CalcResult と同じ。Web が型を共有するため)
        ko: { $ref: '#/components/schemas/KOChance' }
        unsupported:
          type: array
          description: |
            この結果に付いた「未対応」の印(ADR-0123)。印なしは空配列(WASM 境界の CalcResult と同じ形)。
          items: { $ref: '#/components/schemas/UnsupportedMark' }

    DefenderPreset:
      type: string
      description: |
        防御側の代表調整(耐久が上がる順)。SP は能力ポイント(Lv50・個体値31固定)。
        性格の「無補正」は上昇・下降なし、「+B/-A」は防御上昇・攻撃下降のこと。
        engine の PresetKey と同一文字列(docs/adr/0009-bulk-calc-presets.md §1)。
        - `none`: 無振り(SP なし・無補正)。全分類
        - `hp`: H振り(HP 32・無補正)。全分類
        - `hb_boost`: H振り+B補正(HP 32・防御上昇 +B/-A)。物理
        - `hb`: HB振り(HP 32・防御 32・無補正)。物理
        - `hb_full`: HB特化(HP 32・防御 32・防御上昇 +B/-A)。物理
        - `hd_boost`: H振り+D補正(HP 32・特防上昇 +D/-A)。特殊
        - `hd`: HD振り(HP 32・特防 32・無補正)。特殊
        - `hd_full`: HD特化(HP 32・特防 32・特防上昇 +D/-A)。特殊
      enum: [none, hp, hb_boost, hb, hb_full, hd_boost, hd, hd_full]

    DefenderOverride:
      type: object
      description: |
        防御側の上書き(issue 272・274。ADR-0126・ADR-0214・ADR-0216)。省略した項目は上書きしない。
        指定した値は生成するすべての行(全プリセット × 全 itemVariants × 全特性)の防御側に一律で当てる。
        プリセットが決める SP・性格・持ち物には触れない。省略・空オブジェクト・ゼロ値(ranks がすべて 0、
        status が none)の応答は、defenderOverride を送らないときとバイト単位で同じ。
        逆算(ReverseRequest)には無い(既知の側は known.ranks / known.status で渡す。ADR-0216 §4)。

        - `ranks`: 防御側のランク補正。省略した能力は 0。プリセットの防御側はランク 0 なので、指定した値が
          そのまま全行に当たる。ダメージに効くのは技の分類が使う側だけ(物理は def、特殊は spd)で、
          急所のときは正のランクを無視する(1対1の計算と同じ規則)。各値が -6..+6 の外なら
          400 `invalid_input`(使わない側の能力でも拒否する)。応答の行(BulkDefender)にはランクを出さない
          (`stats` はランク補正前の実数値のまま)。
        - `status`: 防御側の状態異常。未知の値は 400 `invalid_enum`(Individual.status と同じ)。
          **今のダメージ式は防御側の状態異常を見ない**(やけどの物理半減は攻撃側の状態だけ。ADR-0216 §3)ため、
          現時点では結果を変えない。防御側の状態で威力・防御が変わる技・特性に対応したときに効くようになる。
      properties:
        abilityId:
          type: string
          description: |
            防御側の特性を1つに固定する。省略時は防御側の種族が持つ特性(最大3件。4件目がある種族は
            Showdown の特殊枠 `"S"` を落とす。ADR-0105 §5 と同じ判断)をすべて候補として計算し、
            結果が完全に同じになる特性は1行にまとめ、違うときだけ行を分ける(ADR-0126)。
            指定した特性をその種族が持たない場合は 400 `invalid_input`、マスタに無い ID は
            400 `unknown_ability`。
        ranks: { $ref: '#/components/schemas/RankBlock' }
        status: { $ref: '#/components/schemas/StatusCondition' }

    BulkCalcRequest:
      type: object
      required: [format, attacker, defenderSpeciesKey, moveId]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        attacker: { $ref: '#/components/schemas/Individual' }
        defenderSpeciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        moveId: { type: string }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }
        defenderOverride: { $ref: '#/components/schemas/DefenderOverride' }
        presets:
          type: array
          description: |
            使う防御側プリセットと行の順序。省略と空配列(`[]`)は同じで、技の分類に応じた既定セットになる。
            物理技は 5 件(none, hp, hb_boost, hb, hb_full)、
            特殊技は 5 件(none, hp, hd_boost, hd, hd_full)、
            **変化技は 2 件(none, hp)のみ**。
            指定したときはその順に行を返す(分類に合わないプリセットも指定どおり返す)。
            同じ preset を2回以上含めると 400 `duplicate_preset`(`uniqueItems` 違反に対する
            この操作の code。ADR-0208)。9 件以上は 400 `invalid_input`。
            engine のカスタムプリセット定義(SP・性格を任意に決めたもの)は API に出さない。
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/DefenderPreset' }
        itemVariants:
          type: array
          description: |
            差し替えて比較する持ち物 ID(省略時は素の1通り)。null 要素は「持ち物なし」。
            defenderSpeciesKey がメガシンカ後の種族のとき、requiredItemId 以外の持ち物を含めると 400 `invalid_input`(ADR-0200 §4)。
            65 件以上、または同じ値(null どうしを含む)の重複は 400 `invalid_input`(ADR-0208)。
            行の基本数は `len(presets) × len(itemVariants)`(上限 8 × 64 = 512)。特性ごとに結果が違う
            ときだけ、その基本数のうち最大3倍(特性の候補数。ADR-0126・ADR-0214)まで行が分かれる。
            結果が同じ特性は1行にまとまるため、特性が効かない技では行数は変わらない。
          maxItems: 64
          uniqueItems: true
          items: { type: string, nullable: true }

    BulkCalcRow:
      type: object
      required: [preset, presetLabel, defender, result, abilityId, abilityIds]
      properties:
        preset: { $ref: '#/components/schemas/DefenderPreset' }
        presetLabel: { type: string, description: 表示名(例 HB振り / HB特化 / H振り+B補正) }
        itemId: { type: string, nullable: true, description: この行の防御側の持ち物(持ち物なしは null) }
        defender: { $ref: '#/components/schemas/BulkDefender' }
        result: { $ref: '#/components/schemas/CalcResult' }
        abilityId:
          type: string
          description: |
            この行の計算に使った防御側の特性(ADR-0126・ADR-0214)。種族は必ず1件以上の特性を持つため
            常に入る。
        abilityIds:
          type: array
          minItems: 1
          description: この行と結果が完全に同じになる特性の ID(abilityId が先頭。渡した/解決した順)。
          items: { type: string }

    NatureModifier:
      type: object
      description: |
        性格補正の構造値。plus が +10%、minus が -10% を受ける能力。無補正は両方 null。
        HP を指すことはない。
      required: [plus, minus]
      properties:
        plus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
        minus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]

    BulkDefender:
      type: object
      description: 一括計算の1行で使った防御側の調整(SP・性格補正・実数値)
      required: [sp, nature, natureId, stats]
      properties:
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 能力ポイント
        nature: { $ref: '#/components/schemas/NatureModifier' }
        natureId:
          type: string
          nullable: true
          description: |
            nature と (plus, minus) が一致するマスタの性格 ID。無補正は、マスタの無補正性格を
            ID の昇順で並べた最初のもの。該当する性格がマスタに無ければ null。
        stats:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 実数値(Lv50・個体値31)

    BulkCalcResult:
      type: object
      required: [defenderSpeciesKey, rows]
      properties:
        defenderSpeciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/BulkCalcRow' }

    ReverseSide:
      type: string
      description: どちら側の調整を逆算するか(defender=与ダメ観測 / attacker=被ダメ観測)
      enum: [defender, attacker]

    Observation:
      type: object
      description: |
        1発ぶんの観測。percent / percentTenths / damage の**ちょうど1つ**を指定する(ADR-0010 §R2)。
        0 個・2 個以上・範囲外は 400 `invalid_observation`。整数でなければ(例 12.5)400 `invalid_json`。
        表示%(CalcResult.minPercent など)とは別概念。percent は実機の表示と同じ切り捨てとして照合し、
        percentTenths は丸め規則に依存しない区間で照合する(ADR-0134)。
      properties:
        percent:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            整数%の観測(精度 1%)。実機の相手 HP 減少表示と同じ切り捨て(floor(100×ダメージ/最大HP)、100 で頭打ち)。
            v は真の割合 p が v ≤ p < v+1(v=100 は p ≥ 100)のダメージと両立する(ADR-0134)
        percentTenths:
          type: integer
          minimum: 1
          maximum: 1000
          description: |
            小数第1位の観測を 0.1% 単位の整数にしたもの(例 45.3% → 453)。出所の丸めが未確認なので、
            v−1 < p < v+1(0.1% 単位。v=1000 は上側を開ける)のダメージと両立する(ADR-0010 §R2)
        damage:
          type: integer
          minimum: 1
          description: HP の実点数の観測(自分の HP の減少量など)
        note: { type: string, description: 画面用のメモ。計算には使わない }

    ReverseRequest:
      type: object
      required: [format, side, known, unknownSpeciesKey, moveId, observations]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        side: { $ref: '#/components/schemas/ReverseSide' }
        known:
          allOf: [ { $ref: '#/components/schemas/Individual' } ]
          description: |
            既知の側(自分)の個体。side=defender なら自分=攻撃側、side=attacker なら自分=防御側。
            Individual に moveId は無い(技は moveId で指定する)。
        unknownSpeciesKey:
          allOf: [ { $ref: '#/components/schemas/SpeciesKey' } ]
          description: 逆算する相手の種族。SP・性格・持ち物は探索対象なので渡さない
        unknownAbilityId:
          type: string
          description: |
            相手の特性を1つに固定する(issue 272。ADR-0126・ADR-0214)。省略時は相手の種族が持つ特性
            (最大3件。BulkCalcRequest.defenderOverride.abilityId と同じ既定)をすべて候補にする。
            指定した特性をその種族が持たない場合は 400 `invalid_input`、マスタに無い ID は
            400 `unknown_ability`。
        moveId: { type: string, description: 観測したときの技(side=defender なら自分の技、attacker なら相手の技) }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }
        itemCandidates:
          type: array
          description: |
            相手の持ち物の候補(ID)。null 要素は「持ち物なし」。省略・空配列は [null] と同じ。
            unknownSpeciesKey がメガシンカ後の種族のとき、requiredItemId 以外の持ち物を含めると 400 `invalid_input`(ADR-0200 §4)。
            65 件以上、または同じ値(null どうしを含む)の重複は 400 `invalid_input`(ADR-0208)。
          maxItems: 64
          uniqueItems: true
          items: { type: string, nullable: true }
        observations:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            同じ技・同じ場・同じ既知側に対する別々の1発。0 件は 400 `no_observation`、
            17 件以上は 400 `invalid_input`(ADR-0208)。同じ内容の観測を繰り返してよい
            (絞り込みに寄与しないだけで矛盾しない)ので `uniqueItems` は付けない。
          items: { $ref: '#/components/schemas/Observation' }
        maxCandidates:
          type: integer
          minimum: 0
          maximum: 128
          default: 0
          description: |
            返す候補数の上限。0 は「許可された入力から生まれる候補の全件」(特性の候補分岐〈ADR-0126・
            ADR-0214〉により最大 2 性格クラス × 3 特性グループ × 64 itemCandidates = 384 件まで増えうる。
            特性が効かない技では従来どおり最大 128 件)。指定できる値自体は 1..128(この上限は変えていない。
            返る件数をこの値で切り詰めるだけで、384 件から絞り込みたいときに使う)。負の値と 129 以上は
            400 `invalid_input`。

    NatureClass:
      type: string
      description: 関連ステータスに対する性格補正のクラス(neutral=無補正 / plus=関連ステータス +10%)。下降補正は探索しない
      enum: [neutral, plus]

    SPRange:
      type: object
      description: SP の区間(両端を含む)
      required: [min, max]
      properties:
        min: { type: integer, minimum: 0, maximum: 32 }
        max: { type: integer, minimum: 0, maximum: 32 }

    ReverseCandidate:
      type: object
      description: 候補1件(性格クラス × 持ち物。ADR-0010 §R3)
      required: [natureClass, nature, natureId, itemId, ranges, spCount, exact, mismatch, support, minPercent, maxPercent, unsupported, abilityId, abilityIds]
      properties:
        natureClass: { $ref: '#/components/schemas/NatureClass' }
        nature: { $ref: '#/components/schemas/NatureModifier' }
        natureId:
          type: string
          nullable: true
          description: |
            nature と (plus, minus) が一致するマスタの性格 ID(BulkDefender.natureId と同じ規則)。
            無補正は、マスタの無補正性格を ID の昇順で並べた最初のもの。該当なしは null。
        itemId: { type: string, nullable: true, description: 持ち物(持ち物なしは null) }
        ranges:
          type: array
          minItems: 1
          description: 観測を説明できる SP の集合(昇順・互いに素・隣接しない極大連続区間)。説明できなければ距離最小の SP
          items: { $ref: '#/components/schemas/SPRange' }
        spCount: { type: integer, description: ranges に含まれる SP の数 }
        exact: { type: boolean, description: mismatch == 0(全観測を説明できる) }
        mismatch: { type: integer, description: 観測とのずれ(0.1% 単位の整数。0 は完全に説明できる) }
        support: { type: integer, description: ranges の各 SP で各観測を説明できるロールの延べ数 }
        minPercent:
          type: number
          format: double
          description: ranges 全体での想定ダメージ幅の下限(表示%。小数第1位・切り捨て。CalcResult.minPercent と同じ意味)
        maxPercent:
          type: number
          format: double
          description: ranges 全体での想定ダメージ幅の上限(表示%。小数第1位・四捨五入。CalcResult.maxPercent と同じ意味)
        unsupported:
          type: array
          description: |
            この候補の計算に付いた「未対応」の印(ADR-0123)。SP によらず同じ(技・場・既知側は候補間で共通)。
            印なしは空配列。
          items: { $ref: '#/components/schemas/UnsupportedMark' }
        abilityId:
          type: string
          description: |
            この候補の計算に使った相手の特性(ADR-0126・ADR-0214)。種族は必ず1件以上の特性を持つため
            常に入る。
        abilityIds:
          type: array
          minItems: 1
          description: この候補と結果が完全に同じになる特性の ID(abilityId が先頭。渡した/解決した順)。
          items: { type: string }

    ReverseResult:
      type: object
      required: [side, stat, assumedHpSp, exactCount, candidates]
      properties:
        side: { $ref: '#/components/schemas/ReverseSide' }
        stat:
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
          description: 逆算した関連ステータス(技の分類と side から決まる)
        assumedHpSp:
          type: integer
          description: 仮定した相手の H の SP(defender=32、attacker=0。ADR-0010 §R1)
        exactCount: { type: integer, description: exact な候補の数(maxCandidates で切る前) }
        candidates:
          type: array
          description: Mismatch 昇順 → Support 降順 → SPCount 降順 → 定義順(ADR-0010 §R4)
          items: { $ref: '#/components/schemas/ReverseCandidate' }

    AdjustModifier:
      type: integer
      minimum: 1
      maximum: 2097152
      default: 4096
      description: |
        4096 基準の補正(×1.0 = 4096。engine の MinEffectModifier..MaxEffectModifier)。省略は 4096。
        明示した 0 と範囲外は 400 `invalid_input`。

    AdjustThresholdPercent:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      maximum: 100
      default: 100
      description: |
        満たすべき確率(%)。省略は 100(確定 = 乱数の最悪側でも満たす)。比較は「確率 >= しきい値」。
        明示した 0・負・100 超は 400 `invalid_input`(engine のゼロ値「既定」をそのまま渡さない。ADR-0250 §3)。

    AdjustHits:
      type: integer
      minimum: 1
      maximum: 10
      description: 目標の発数 n(engine の MaxAdjustHits = 10)。範囲外は 400 `invalid_input`(ID の解決より前に検査する)

    AdjustIndicesRequest:
      type: object
      required: [individual]
      properties:
        individual:
          allOf: [ { $ref: '#/components/schemas/Individual' } ]
          description: 指数を求める自分の個体(SP 各 0..32・合計 66 以下)
        moveId:
          type: string
          description: 火力指数に使う技(分類と威力をマスタから引く)。省略すると firepowerIndex は null
        modifier:
          allOf: [ { $ref: '#/components/schemas/AdjustModifier' } ]
          description: |
            火力指数の補正(タイプ一致・持ち物・特性などをクライアントが掛け合わせたもの)。
            moveId を省略しても値域を検査する(明示した 0 と範囲外は 400 `invalid_input`)
        damageModifier:
          allOf: [ { $ref: '#/components/schemas/AdjustModifier' } ]
          description: 耐久指数の被ダメージ補正(受けるダメージの倍率。半減 2048 で指数が2倍)

    HPLineKind:
      type: string
      description: HP 実数値が属するライン(16n = HP mod 16 が 0、16n-1 = 15、none = どちらでもない)
      enum: [none, 16n, 16n-1]

    HPLinePoint:
      type: object
      required: [hp, sp, spDelta]
      properties:
        hp: { type: integer, description: そのラインの HP 実数値 }
        sp: { type: integer, minimum: 0, maximum: 32, description: その HP にする HP の SP }
        spDelta: { type: integer, description: 現在の SP からの差(次のラインは正、前のラインは負) }

    HPLineReport:
      type: object
      description: |
        HP の 16n / 16n-1 ライン(ADR-0150 §4)。next* は SP が現在より大きい中で最小、prev* は小さい中で最大のライン。
        HP の SP 0..32 の範囲に無ければ null。
      required: [hp, sp, current, next16n, prev16n, next16nMinus1, prev16nMinus1]
      properties:
        hp: { type: integer }
        sp: { type: integer, minimum: 0, maximum: 32 }
        current: { $ref: '#/components/schemas/HPLineKind' }
        next16n:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/HPLinePoint' } ]
        prev16n:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/HPLinePoint' } ]
        next16nMinus1:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/HPLinePoint' } ]
        prev16nMinus1:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/HPLinePoint' } ]

    AdjustIndicesResult:
      type: object
      required: [stats, firepowerIndex, physicalBulkIndex, specialBulkIndex, hpLines]
      properties:
        stats:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 実数値(ランク補正なし)
        firepowerIndex:
          type: integer
          format: int64
          nullable: true
          description: 火力指数。moveId を省略したら null
        physicalBulkIndex: { type: integer, format: int64, description: 物理耐久指数 floor(H × B × 4096 / damageModifier) }
        specialBulkIndex: { type: integer, format: int64, description: 特殊耐久指数 floor(H × D × 4096 / damageModifier) }
        hpLines: { $ref: '#/components/schemas/HPLineReport' }

    AdjustSearchRequest:
      type: object
      description: |
        最小 SP の探索の入力(ADR-0150 §7)。個体・技・場の指定は CalcRequest と同じ。どちらが自分かは操作で決まる
        (min-sp-to-ko は attacker、min-sp-to-survive は defender)。
      required: [format, attacker, defender, moveId, hits]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        attacker: { $ref: '#/components/schemas/Individual' }
        defender: { $ref: '#/components/schemas/Individual' }
        moveId: { type: string, description: attacker が使う技(attacker.moveId は読まない) }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }
        hits: { $ref: '#/components/schemas/AdjustHits' }
        thresholdPercent: { $ref: '#/components/schemas/AdjustThresholdPercent' }

    AdjustKOResult:
      type: object
      required: [stat, searchLimit, feasible, sp, chancePercent, unsupported]
      properties:
        stat:
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
          description: 探索した能力(物理 → atk、特殊 → spa)
        searchLimit: { type: integer, description: '探索した SP の上限 = min(32, 66 − 固定 SP の合計)' }
        feasible: { type: boolean, description: searchLimit 以内でしきい値を満たす SP があるか }
        sp: { type: integer, description: feasible なら満たす最小の SP、そうでなければ searchLimit }
        chancePercent:
          type: number
          format: double
          description: sp のときに hits 発で倒す確率(%。engine の生値。丸めない)
        unsupported:
          type: array
          description: 探索中の計算に付いた「未対応」の印(ADR-0123・ADR-0215)。SP によらず同じ。印なしは空配列
          items: { $ref: '#/components/schemas/UnsupportedMark' }

    AdjustSurviveResult:
      type: object
      required: [stat, searchLimit, feasible, hpSp, statSp, totalSp, bulkIndex, chancePercent, unsupported]
      properties:
        stat:
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
          description: H と組にして探索した能力(物理 → def、特殊 → spd)
        searchLimit: { type: integer, description: hpSp + statSp の上限 = 66 − 固定 SP の合計(各能力は別に 32 まで) }
        feasible: { type: boolean }
        hpSp: { type: integer }
        statSp: { type: integer }
        totalSp: { type: integer }
        bulkIndex: { type: integer, format: int64, description: 選んだ組の耐久指数(等倍。H 実数値 × B(D) 実数値) }
        chancePercent:
          type: number
          format: double
          description: 選んだ組で hits 発受けて耐える確率(%。engine の生値)
        unsupported:
          type: array
          description: 探索中の計算に付いた「未対応」の印(ADR-0123・ADR-0215)。印なしは空配列
          items: { $ref: '#/components/schemas/UnsupportedMark' }

    AllocMode:
      type: string
      description: 残り SP を回す側(bulk = H・B・D、offense = A または C と S)
      enum: [bulk, offense]
      # 汎用の名前(Bulk・Offense)が将来の列挙と衝突して既存の定数名を変えないよう、型名を前に付ける
      x-enum-varnames: [AllocModeBulk, AllocModeOffense]

    BulkFocus:
      type: string
      description: 耐久側の指数最大の基準(physical = H×B、special = H×D、both = min(H×B, H×D) → max)
      enum: [physical, special, both]
      # MoveCategory と同じ値を持つため、生成する Go の定数名を明示して MoveCategory 側の定数名(Physical など)を変えない
      x-enum-varnames: [BulkFocusPhysical, BulkFocusSpecial, BulkFocusBoth]

    AdjustCeiling:
      type: object
      description: |
        回す能力の SP の上限(0..32)。**省略した能力は 32**(ADR-0150 §8 の「既定は境界の責務」)。
        明示した 0 は「下限より上には振らない」。回さない能力の値は検査の範囲(0..32)以外では使わない。
      properties:
        hp: { type: integer, minimum: 0, maximum: 32 }
        atk: { type: integer, minimum: 0, maximum: 32 }
        def: { type: integer, minimum: 0, maximum: 32 }
        spa: { type: integer, minimum: 0, maximum: 32 }
        spd: { type: integer, minimum: 0, maximum: 32 }
        spe: { type: integer, minimum: 0, maximum: 32 }

    AdjustAllocGoal:
      type: object
      description: |
        最小 SP の組の目標(ADR-0150 §8)。bulk は「opponent の技を hits 発受けて耐える」、offense は
        「自分の技で opponent を hits 発で倒す」(技の分類は offenseCategory と一致させる。違えば 400 `invalid_input`)。
      required: [format, opponent, moveId, hits]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        opponent: { $ref: '#/components/schemas/Individual' }
        moveId: { type: string }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }
        hits: { $ref: '#/components/schemas/AdjustHits' }
        thresholdPercent: { $ref: '#/components/schemas/AdjustThresholdPercent' }

    AdjustAllocationRequest:
      type: object
      required: [self, mode]
      properties:
        self:
          allOf: [ { $ref: '#/components/schemas/Individual' } ]
          description: 自分の個体。sp は各能力の下限(結果の SP は各能力でこれ以上)
        ceiling: { $ref: '#/components/schemas/AdjustCeiling' }
        mode: { $ref: '#/components/schemas/AllocMode' }
        focus:
          allOf: [ { $ref: '#/components/schemas/BulkFocus' } ]
          description: mode=bulk で必須(欠けたら 400 `invalid_input`)。offense では読まない
        offenseCategory:
          allOf: [ { $ref: '#/components/schemas/MoveCategory' } ]
          description: mode=offense で必須(physical → A、special → C。欠落・status は 400 `invalid_input`)。bulk では読まない
        minSpeed:
          type: integer
          minimum: 0
          default: 0
          description: offense の素早さの目標(S 実数値の下限。相手の S + 1 を渡せば「超え」)。0 は目標なし。bulk で 0 以外は 400 `invalid_input`
        goal: { $ref: '#/components/schemas/AdjustAllocGoal' }

    AdjustAllocPlan:
      type: object
      required: [sp, totalSp, stats, physicalBulk, specialBulk, speedMet, goalMet, chancePercent]
      properties:
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 全6能力の SP(回さない能力は下限のまま)
        totalSp: { type: integer }
        stats:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 実数値(ランク補正なし)
        physicalBulk: { type: integer, format: int64, description: 等倍の物理耐久指数(H × B) }
        specialBulk: { type: integer, format: int64, description: 等倍の特殊耐久指数(H × D) }
        speedMet: { type: boolean, description: 素早さの目標を満たすか(bulk・minSpeed=0 では常に true) }
        goalMet: { type: boolean, description: goal を満たすか(goal を省略したら false) }
        chancePercent:
          type: number
          format: double
          description: goal の確率(bulk は耐える、offense は倒す確率。%)。goal を省略したら 0

    AdjustAllocationResult:
      type: object
      required: [remaining, maxIndex, minSp, unsupported]
      properties:
        remaining: { type: integer, description: 残り SP = 66 − 下限の合計 }
        maxIndex: { $ref: '#/components/schemas/AdjustAllocPlan' }
        minSp:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/AdjustAllocPlan' } ]
          description: goal を満たす最小 SP の組(満たせなければ最も近い組。GoalMet / SpeedMet で判別)。goal を省略したら null
        unsupported:
          type: array
          description: goal の計算に付いた「未対応」の印(ADR-0123)。goal を省略したら空配列
          items: { $ref: '#/components/schemas/UnsupportedMark' }

    MasterExport:
      type: object
      description: |
        calc-svc が計算に使うマスタ一式(ADR-0204)。形は pokedex の DB の行(`services/internal/master` の
        TypeRow / TypeChartRow / SpeciesRow + SpeciesAbilityRow / MoveRow / ItemRow / AbilityRow)に対応する。
        値の検証(ID の形式・範囲・組の整合・効果定義)は受け取った側が共通マスタの写像で行う。
      required: [schemaVersion, dataVersion, types, typeChart, species, moves, items, abilities, natures]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
          description: この形の版。いまは 1 だけ
        dataVersion:
          type: string
          minLength: 1
          description: |
            データの版の識別子(pokedex の data_versions に由来する)。calc-svc は記録とログに使うだけで、
            計算の結果には影響しない。
        types:
          type: array
          items: { $ref: '#/components/schemas/MasterType' }
        typeChart:
          type: array
          description: タイプ相性表の行(ADR-0013)。等倍(code 2)の組は省略してよい
          items: { $ref: '#/components/schemas/MasterTypeChartEntry' }
        species:
          type: array
          items: { $ref: '#/components/schemas/MasterSpecies' }
        moves:
          type: array
          items: { $ref: '#/components/schemas/MasterMove' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MasterItem' }
        abilities:
          type: array
          items: { $ref: '#/components/schemas/MasterAbility' }
        natures:
          type: array
          items: { $ref: '#/components/schemas/MasterNature' }

    MasterType:
      type: object
      description: types テーブルの行
      required: [id, sortOrder, nameJa]
      properties:
        id: { $ref: '#/components/schemas/PokeType' }
        sortOrder: { type: integer, description: 表示順(重複しない) }
        nameJa: { type: string }

    MasterTypeChartEntry:
      type: object
      description: type_chart テーブルの行。code は倍率を ×2 した整数(0=無効・1=いまひとつ・2=等倍・4=ばつぐん。ADR-0013)
      required: [attackType, defenseType, code]
      properties:
        attackType: { $ref: '#/components/schemas/PokeType' }
        defenseType: { $ref: '#/components/schemas/PokeType' }
        code: { type: integer, enum: [0, 1, 2, 4] }

    MasterSpecies:
      type: object
      description: |
        species テーブルの行と、その species_abilities の行。showdownId は取得元との突き合わせ用の ID で、
        共通マスタの写像が形式を検証する(ADR-0100 §2)。
      required: [key, dexNo, form, showdownId, nameJa, type1, type2, baseStats, isMega, baseSpeciesKey, requiredItemId, abilities]
      properties:
        key: { $ref: '#/components/schemas/SpeciesKey' }
        dexNo: { type: integer }
        form: { type: integer }
        showdownId: { type: string }
        nameJa: { type: string }
        type1: { $ref: '#/components/schemas/PokeType' }
        type2:
          description: 第2タイプ。単タイプは null
          nullable: true
          allOf: [ { $ref: '#/components/schemas/PokeType' } ]
        baseStats:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 種族値
        isMega: { type: boolean }
        baseSpeciesKey:
          type: string
          nullable: true
          description: メガシンカ前の種族キー(メガでなければ null)
        requiredItemId:
          type: string
          nullable: true
          description: メガシンカに要る持ち物の ID(メガでなければ null)
        abilities:
          type: array
          items: { $ref: '#/components/schemas/MasterSpeciesAbility' }

    MasterSpeciesAbility:
      type: object
      description: species_abilities テーブルの行
      required: [slot, abilityId]
      properties:
        slot: { type: integer, description: '1..4(Showdown の特性スロット "S" を含む。ADR-0103 §12)' }
        abilityId: { type: string }

    MasterMove:
      type: object
      description: moves テーブルの行(計算に使う列だけ)+ move_effects の effect(ADR-0107)
      required: [id, nameJa, type, category, power, priority, effect, mechanisms, target]
      properties:
        id: { type: string }
        nameJa: { type: string }
        type: { $ref: '#/components/schemas/PokeType' }
        category: { $ref: '#/components/schemas/MoveCategory' }
        power: { type: integer }
        priority: { type: integer }
        effect:
          allOf: [ { $ref: '#/components/schemas/MasterEffect' } ]
          description: |
            技の追加効果(命中時のランク変化。ADR-0107)。null は追加効果なし。
            ダメージ計算はこの値を読まない(ADR-0107 決定2)。発動するかどうかの判定も engine は行わず、
            「発動した場合の変化量」と「その確率」を持つだけ(ADR-0107 決定1)。
        mechanisms:
          type: array
          description: |
            技の機構(move_mechanisms。ADR-0121)。「威力・分類・タイプから通常の式で計算すると誤る」理由の
            分類で、1つの技が複数を持つことがある。昇順・重複なし。通常の技(変化技を含む)は空配列。
            calc-svc は engine.Move.Mechanisms にそのまま渡す(「未対応」の印の判定に使う。ADR-0123)。
            値は UnsupportedMark.reason の技側13種と同じ(正は engine.AllMoveMechanisms)。ここでは
            enum を付けない(意図的。ADR-0121 実装時の追記を参照): この内部 API は pokedex-svc → calc-svc
            のみで使い、値の妥当性は既に `services/internal/master.MoveMechanismsOf` が検証している。
            enum にすると oapi-codegen が別の Go 型を生成し、両サービスで `[]string` との相互変換が
            必要になるだけで、二重の検証にしかならない。
          items: { type: string }
        target:
          type: string
          nullable: true
          description: |
            技の対象(moves.target。ADR-0136・ADR-0223。issue 288)。Showdown の技データの `target` の文字列を
            そのまま返す(15種。正は `services/internal/master.AllMoveTargets`)。null はまだ取り込んでいない行
            (対象が不明)。キーは省かない(null を返す)。
            enum は付けない(mechanisms と同じ理由。値の検証は受け取った calc-svc が `master.MoveTargetOf` で行う)。
            calc-svc は全体技(allAdjacent・allAdjacentFoes)を engine の spread、その他の既知の値を single、
            null を不明("")として engine.Move.Target に写す(ダブルで不明の攻撃技には move_target_unknown の印。ADR-0222)。
            古い pokedex-svc(このキーを返さない版)からの取り込みは、キーが無いことを null と同じ「不明」として受け付ける
            (入れ替えの順序に依存させない。ADR-0223 §3)。

    MasterEffect:
      type: object
      additionalProperties: true
      nullable: true
      description: |
        効果定義(item_effects / ability_effects の JSON をそのまま。ADR-0005)。null は補正なし。
        形は共通マスタ(`services/internal/master` の DecodeItemEffect / DecodeAbilityEffect)が受け付けるもので、
        受け取った側がそこで厳格に検証する(未知のキー・4096 基準の整数でない値・空のオブジェクトは不正)。

    MasterItem:
      type: object
      description: items テーブルの行 + item_effects の effect
      required: [id, nameJa, effect]
      properties:
        id: { type: string }
        nameJa: { type: string }
        effect: { $ref: '#/components/schemas/MasterEffect' }

    MasterAbility:
      type: object
      description: abilities テーブルの行 + ability_effects の effect
      required: [id, nameJa, effect]
      properties:
        id: { type: string }
        nameJa: { type: string }
        effect: { $ref: '#/components/schemas/MasterEffect' }

    MasterNature:
      type: object
      description: 性格(ADR-0204 でデータレーンに natures テーブルを提案)。無補正は plus / minus とも null。HP を指すことはない
      required: [id, nameJa, plus, minus]
      properties:
        id: { type: string }
        nameJa: { type: string }
        plus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
        minus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]

    # --- record-svc(ADR-0209 §5.3 から移した契約。P5-3)-------------------------

    FrequentOpponent:
      type: object
      description: |
        「よく使う相手」1件(ADR-0209 §3 #2)。端末内の計算イベントの集計で、他端末のイベントは混ざらない。
        個体の中身(技・持ち物・特性・性格・SP)・ダメージの数値は返さない(集計に使うのは防御側の種族だけ)。
      required: [speciesKey, score, count, lastCalculatedAt]
      properties:
        speciesKey:
          allOf: [ { $ref: '#/components/schemas/SpeciesKey' } ]
          description: 防御側(相手)の種族。名前・タイプは pokedex-svc から引く
        score:
          type: number
          format: double
          minimum: 0
          description: 頻度 × 時間減衰。並び順のための相対値で、絶対値に意味は無い(ADR-0209 §4)
        count:
          type: integer
          minimum: 1
          description: 減衰をかける前の、集計対象として残っている計算イベントの件数
        lastCalculatedAt:
          type: string
          format: date-time
          description: この相手を最後に計算した時刻(イベントの `occurred_at`)

    DeletionStatus:
      type: string
      description: |
        `completed` = この端末のデータは残っていない。`partial` = 1回の上限に達したので残りがある
        (同じ要求を繰り返す。ADR-0209 §5.2)。
      enum: [completed, partial]

    RecordDeletionResult:
      type: object
      required: [status, purgedAt, deleted]
      properties:
        status: { $ref: '#/components/schemas/DeletionStatus' }
        purgedAt:
          type: string
          format: date-time
          description: 墓石の時刻。これ以前に発生した計算イベントは以後保存しない(ADR-0209 §7)
        deleted:
          type: object
          description: この呼び出しで消した行数(冪等なので2回目は 0 になる)
          required: [calcEvents, aggregates, favorites]
          properties:
            calcEvents: { type: integer, minimum: 0 }
            aggregates: { type: integer, minimum: 0 }
            favorites: { type: integer, minimum: 0 }

    FavoriteId:
      type: string
      description: |
        お気に入りの ID(サーバーが発行する正の整数の10進表記)。JSON の数値にしないのは、JavaScript の数値で
        精度を落とさないためと、形式違いを「持っていない ID」と同じ 404 に揃えるため(ADR-0227 §2)。
      pattern: '^[1-9][0-9]{0,18}$'
      example: '42'

    FavoriteInput:
      type: object
      description: |
        お気に入りの作成(`createFavorite`)で送る内容。`id` / `createdAt` / `updatedAt` はサーバーが決めるので送らない
        (送ったら 400 `unknown_field`)。契約に無いキーは、`individual` の中も含めて 400 `unknown_field`(ADR-0227 §2)。

        `individual` はピン留めする個体で、計算 API の `Individual` と同じ形(そのまま計算の攻撃側・防御側に使える。
        生成型でも同じ型になるよう `$ref` だけで参照する)。SP(各 0..32・合計 66 以下)・ランク(-6..+6)・
        レベル(50)の範囲外と `speciesKey` の形式違いは 400 `invalid_input`。ID がマスタに実在するかは照合しない(ADR-0227 §2)。

        `calc`(任意。ADR-0228)はピン留めした時点の**計算の入力全体**で、`POST /api/calc` の本文 `CalcRequest` と同じ形
        (`$ref` だけで参照し、生成型も `CalcRequest` そのもの)。一覧から選んだらそのまま `POST /api/calc` に渡して結果を出せる。
        - 省略・null は「計算の入力を持たない」従来のお気に入り(ADR-0227 の形。保存内容・重複判定は従来と同じ)。
        - `individual` は従来どおり必須(一覧の表示と、`calc` を読まない旧クライアントのため)。新しいクライアントは
          一覧に出したい側(通常は `calc.attacker`)を `individual` にも入れる。サーバーは両者の一致を求めない。
        - `calc` の中は `individual` と同じ検証(SP・ランク・レベル・`speciesKey` の形式、列挙の未知の値は 400 `invalid_enum`)に加え、
          `moveId` が空でないこと、`format` / `field.weather` / `field.terrain` の列挙を検証する。マスタとは照合しない。
          契約に無いキーは `calc` の中も含めて 400 `unknown_field`。
        - 冪等(同じ内容は 200)の「同じ内容」は `label`・既定値を補った `individual`・既定値を補った `calc` の組。
          `calc` の有無・中身が違えば別のお気に入り。
        - 既定値を補った保存内容(`label`・`individual`・`calc` の JSON)が **4096 バイト**を超える作成は 400 `invalid_input`
          (`calc` の有無にかかわらず。正当な入力は 2KB に満たない。ADR-0228 §3)。
      required: [individual]
      properties:
        label:
          type: string
          nullable: true
          maxLength: 30
          description: |
            任意の名前(例: 「HB特化」。文字数は Unicode コードポイントで数える)。空文字は null と同じ「未設定」として扱う。
            利用者の自由入力で個人を特定しうるため、**ログには出さない**(ADR-0209 §3)。
        individual: { $ref: '#/components/schemas/Individual' }
        calc: { $ref: '#/components/schemas/CalcRequest' }

    Favorite:
      type: object
      description: |
        保存済みのお気に入り(ADR-0227)。`individual` は保存時に既定値を補った形(`level` は 50、`ranks` は6値すべて、
        `status` は `none`。`abilityId` / `itemId` / `teraType` は未指定〈null・省略〉ならキーごと省く)で返す。

        `calc`(ADR-0228)は計算の入力を付けて保存したお気に入りだけが持ち、持たないものは**キーごと省く**(null を返さない)。
        持つときは既定値を補った形で返す: `format` は必ず入り、`attacker` / `defender` は `individual` と同じ正規化、
        `field` は `weather`・`terrain`・`attackerScreens`・`defenderScreens`(各3値)をすべて、`options` は `critical` を必ず持つ。
        クライアントはこの値をそのまま `POST /api/calc` の本文にできる(マスタとは照合していないので、計算が
        `unknown_move` 等で 400 になることはある。そのときは計算の失敗として表示する)。
      required: [id, label, individual, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/FavoriteId' }
        label: { type: string, nullable: true, maxLength: 30 }
        individual: { $ref: '#/components/schemas/Individual' }
        calc: { $ref: '#/components/schemas/CalcRequest' }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: |
            最終更新(作成時と、同じ内容の再ピン留め〈`createFavorite` の 200〉で進む)。一覧の並びと失効の判定に使う
            (`max(devices.last_seen_at, updatedAt)` から540日。ADR-0209 §4)

    # --- team-svc(ADR-0209 §5.3 から移した契約 + ADR-0213 の CRUD。P5-4)---------

    TeamId:
      type: string
      description: 構築の ID(サーバーが発行する UUID。正準形 8-4-4-4-12 の16進)
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      example: '11111111-2222-4333-8444-555555555555'

    TeamMember:
      type: object
      description: |
        構築の1体(ADR-0213 §3)。種族・技・持ち物・特性・性格・SP・テラスタイプは **ID のまま**運び、
        team-svc はマスタに実在するかを検証しない(CLAUDE.md 絶対ルール4)。
        並び順(パーティの何番目か)は `Team.members` の配列の順序そのもので、`slot` は持たない。
      required: [speciesKey, natureId, sp]
      properties:
        speciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        nickname:
          type: string
          nullable: true
          maxLength: 24
          description: |
            任意のニックネーム(文字数は Unicode コードポイントで数える)。空文字は null と同じ「未設定」として扱う。
            利用者の自由入力で個人を特定しうるため、**ログには出さない**(ADR-0209 §3)。
        moveIds:
          type: array
          description: 覚えさせる技(最大4つ・同一メンバー内で重複不可。並び順は表示順)
          items: { type: string }
          maxItems: 4
          uniqueItems: true
          default: []
        itemId: { type: string, nullable: true, description: 持ち物(持たせないときは null) }
        abilityId: { type: string, nullable: true, description: 特性(未選択のときは null) }
        natureId: { type: string }
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 能力ポイント。各 0..32、合計 <= 66(Individual.sp と同じ規則。範囲外は 400 `invalid_input`)
        teraType:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/PokeType' } ]

    TeamInput:
      type: object
      description: |
        構築の作成(`createTeam`)・置換(`updateTeam`)で送る内容。`id` / `createdAt` / `updatedAt` は
        サーバーが決めるので送らない(送ったら 400 `unknown_field`)。
        `name` は省略できる(ADR-0229。構築名の入力欄を持たない画面のため)。
      properties:
        name:
          type: string
          nullable: true
          maxLength: 50
          description: |
            構築名(任意。文字数は前後の空白を除いて Unicode コードポイントで数え、50文字まで)。
            省略・null・空文字・空白だけは「未設定」で、サーバーが既定名 **「名称未設定」** を入れて保存する
            (応答の `Team.name` は常に1文字以上の文字列。ADR-0229)。`updateTeam`(丸ごと置換)で省略したときも既定名に置き換わる
            (前の名前を残さない。`members` の省略と同じ扱い)。利用者の自由入力なので**ログには出さない**(ADR-0209 §3)。
        members:
          type: array
          description: パーティ(最大6体。省略・空配列は「メンバーなし」)
          items: { $ref: '#/components/schemas/TeamMember' }
          maxItems: 6
          default: []

    Team:
      type: object
      description: 保存済みの構築(ADR-0213 §2)
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/TeamId' }
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 構築名。入力で省略・空にしたものは既定名「名称未設定」が入る(常に1文字以上。ADR-0229)
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
          maxItems: 6
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: 最終更新。失効の判定に使う(`max(devices.last_seen_at, updatedAt)` から540日。ADR-0209 §4)

    TeamDeletionResult:
      type: object
      required: [status, purgedAt, deleted]
      properties:
        status: { $ref: '#/components/schemas/DeletionStatus' }
        purgedAt:
          type: string
          format: date-time
          description: 墓石の時刻。これ以前に発生した計算イベントは以後 last_seen_at を進めない(ADR-0209 §7)
        deleted:
          type: object
          description: この呼び出しで消した行数(冪等なので2回目は 0 になる)
          required: [teams, teamMembers]
          properties:
            teams: { type: integer, minimum: 0 }
            teamMembers: { type: integer, minimum: 0 }
