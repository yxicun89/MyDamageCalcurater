openapi: 3.0.3
info:
  title: pokecalc API
  version: 0.1.0
  description: |
    ポケモンチャンピオンズ対応のダメージ計算・構築ビルダー API。
    仕様先行(この YAML が唯一の正)。Go(Echo)/ TypeScript / Swift のコードを生成する。

    ドメイン規約(CLAUDE.md):
    - Lv50 固定、個体値 31 固定。能力ポイント SP は 1ステータス最大 32・合計 66。
    - ステータスキーは Showdown 規約に合わせ hp/atk/def/spa/spd/spe。
    - 認証なし。全リクエストに端末ID(X-Device-Id)とセッションID(X-Session-Id)を付与する(UUID。gateway が検証する。ADR-0202)。
servers:
  - url: /
    description: gateway 経由

tags:
  - name: pokedex
    description: マスタ参照(種族・技・持ち物・特性・性格)
  - name: calc
    description: ダメージ計算・一括計算・逆算
  - name: record
    description: |
      計算の記録(自動保存された計算イベントから作る「よく使う相手」の集計・お気に入り)と、
      端末単位の全削除(ADR-0209 §5)。すべて `X-Device-Id` の端末の中だけを見る(ADR-0209 §6)。
      端末 ID はボディ・クエリ・パスで受け取らない(送られたら 400 `unknown_field`)。
  - name: team
    description: |
      構築(パーティ)の CRUD と、端末単位の全削除(ADR-0209 §5・ADR-0213)。
      すべて `X-Device-Id` の端末の中だけを見る(ADR-0209 §6)。端末 ID はボディ・クエリ・パスで
      受け取らない(送られたら 400 `unknown_field`)。他端末の構築 ID を指した要求は 404 `not_found`
      (403 にしない。存在の有無も漏らさない。ADR-0209 §6-2)。

      team-svc は `speciesKey` / `moveIds` / `itemId` / `abilityId` / `natureId` がマスタに実在するかを
      **検証しない**(pokedex-svc の DB に触らない。CLAUDE.md 絶対ルール4・ADR-0213 §3)。ID の妥当性は
      クライアントが pokedex-svc の検索 API から選ばせる時点と、calc-svc が計算時に `unknown_species` 等で
      返す時点で担保する。Showdown 形式のテキストとの相互変換もクライアント側の担当(ADR-0213 §4)。
  - name: internal
    description: |
      サービス間の内部 API(ADR-0204)。gateway は公開しない(`/internal/*` は gateway で 404 `not_found`)。
      クラスタ内の Service からだけ呼ぶ。端末ID(X-Device-Id)/ セッションID(X-Session-Id)は要らない。

paths:
  /api/pokedex/species:
    get:
      tags: [pokedex]
      operationId: searchSpecies
      summary: ポケモンを日本語名で前方一致検索
      description: |
        既定のレギュレーション(コードに書かず DB から引く。ADR-0105)の使用可能集合だけを返す(並びは ID 順)。
        `format` は v1 では結果に影響しない(使用可能集合は形式で分かれていない)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: 日本語名の前方一致(空なら全件・limit まで)
          schema: { type: string }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/Format' }
        - name: limit
          in: query
          description: 範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 一致した種族の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SpeciesSummary' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/species/{key}:
    get:
      tags: [pokedex]
      operationId: getSpecies
      summary: 種族の詳細(タイプ・種族値・特性・覚える技)
      description: |
        使用可能集合の外の種族も返す(絞り込みは検索の仕事)。`abilities` は slot 順、
        `learnset` は習得技 ∩ 既定のレギュレーションの使用可能な技(ID 昇順)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: key
          in: path
          required: true
          description: '{図鑑番号4桁}-{フォルム3桁} 例 0445-000。形式が違えば 400 `invalid_input`'
          schema: { $ref: '#/components/schemas/SpeciesKey' }
      responses:
        '200':
          description: 種族詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeciesDetail' }
        '404':
          description: 該当する種族が無い(`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves:
    get:
      tags: [pokedex]
      operationId: searchMoves
      summary: 技を日本語名で前方一致検索
      description: 既定のレギュレーションの使用可能集合だけを返す(並びは日本語名の照合順序の昇順・同順位は ID 昇順。ADR-0105 §3)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: 日本語名の前方一致(空なら全件・limit まで)
          schema: { type: string }
        - name: limit
          in: query
          description: 範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 技の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Move' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves/{key}:
    get:
      tags: [pokedex]
      operationId: getMove
      summary: 技の詳細(タイプ・分類・威力・優先度)
      description: |
        使用可能集合の外の技も返す(絞り込みは検索の仕事。既定のレギュレーションを引かないため、
        マスタが未投入で技が0件のときも 404 `not_found` になる。0行を 503 にする searchMoves 等の
        一覧系とは異なる。ADR-0105 §3 追記)。判定レーンが技の優先度(`priority`)を個別に引くための
        経路(2026-09-22 の依頼。DECISIONS.md)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: key
          in: path
          required: true
          description: 技の ID(例 highhorsepower)。マスタに無ければ 404 `not_found`
          schema: { type: string }
      responses:
        '200':
          description: 技詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Move' }
        '404':
          description: 該当する技が無い。マスタが未投入(技が0件)のときも同じ(`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/moves/batch:
    get:
      tags: [pokedex]
      operationId: getMovesByIds
      summary: 技を ID のまとめ取りで解決する
      description: |
        `getMove` の複数版。`getSpecies` の `learnset`(ID配列)のような、既に確定した ID の集合を
        1回の呼び出しで実体(名前・タイプ・分類・威力・優先度)に解決するための経路
        (ADR-0304 §3。Web のオンライン学習技表示の欠落の解消)。`getMove` と同様に既定のレギュレーションで
        絞らない(使用可能集合の外の技も返す)。マスタに無い ID は黙って省く(部分一致は無い。エラーにしない)。
        応答の順序は `ids` と同じ(見つからなかった ID は詰めて省く)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: ids
          in: query
          required: true
          description: |
            技の ID の配列(繰り返しクエリ。例 `?ids=highhorsepower&ids=tackle`)。1〜64件。
            パラメータ自体の省略・65件以上は 400 `invalid_input`。1件の集合が64件を超える場合(例:
            `getSpecies` の `learnset` が64件を超える種族)は、呼び出し側が64件ずつに分割して複数回
            呼ぶこと(1回で必ず収まる集合サイズの保証はしない)。空文字列の要素・重複した ID は
            エラーにせず、マスタに無い ID と同様にその要素だけ結果から省く(一致すれば重複したまま返る)
          schema:
            type: array
            items: { type: string }
            minItems: 1
            maxItems: 64
      responses:
        '200':
          description: 見つかった技の一覧(ids の順。見つからなかった ID は省く。マスタ未投入で0件のときも
            `searchMoves` と異なり 503 ではなく空配列 `[]`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Move' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/items:
    get:
      tags: [pokedex]
      operationId: searchItems
      summary: 持ち物を日本語名で前方一致検索
      description: 既定のレギュレーションの使用可能集合だけを返す(並びは日本語名の照合順序の昇順・同順位は ID 昇順。ADR-0105 §3)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: 日本語名の前方一致(空なら全件・limit まで)
          schema: { type: string }
        - name: limit
          in: query
          description: 範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 持ち物の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/pokedex/natures:
    get:
      tags: [pokedex]
      operationId: listNatures
      summary: 性格の一覧(補正する能力)
      description: 使用可能集合で絞らない(全性格。並びは ID 順。ADR-0105)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 性格一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nature' }
        '503':
          description: gateway から pokedex-svc に届かない、または pokedex-svc 自身が DB 未投入・DB に届かない(`upstream_unavailable` / `master_unavailable`。ADR-0105・0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc:
    post:
      tags: [calc]
      operationId: calcDamage
      summary: 1 vs 1 のダメージ計算
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalcRequest' }
      responses:
        '200':
          description: 計算結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalcResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/bulk:
    post:
      tags: [calc]
      operationId: calcBulk
      summary: 防御側の代表調整すべてに対する一括計算
      description: |
        攻撃側は1つに固定し、防御側の種族に対して代表的な調整(DefenderPreset)すべての結果を一度に返す(ADR-0009)。
        - 既定セット(`presets` 省略、または `presets: []`): 物理技なら none/hp/hb_boost/hb/hb_full の5件、
          特殊技なら none/hp/hd_boost/hd/hd_full の5件、**変化技は none/hp の2件のみ**。
        - `presets` を指定したときは、その順に行を返す。重複した preset は 400 `duplicate_preset`。
        - 持ち物の差し替え候補(itemVariants)を渡すと調整×持ち物の組合せを返す。null 要素は「持ち物なし」。
        - **行の順序はプリセット優先**(presets × itemVariants。プリセットごとに itemVariants の順に並ぶ)。
          行数は `len(presets) × len(itemVariants)`(itemVariants 省略時は 1)。
        - 各行の `defender` は、その行で使った防御側の SP・性格補正・実数値(ADR-0011 §3 の WASM 境界と同じ形)。
        - 件数の上限(ADR-0208): `presets` は 8 件以下、`itemVariants` は 64 件以下で重複なし。
          超えたものは ID の解決・計算より前に 400 `invalid_input` で拒否する(本文の 1MiB 制限とは別)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCalcRequest' }
      responses:
        '200':
          description: 調整ごとの結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCalcResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/calc/reverse:
    post:
      tags: [calc]
      operationId: calcReverse
      summary: 観測ダメージから相手の調整候補を逆算
      description: |
        与えた/受けたダメージの観測から、相手の調整候補(性格クラス × 持ち物ごとの SP の範囲)を返す(ADR-0010 §R)。
        - `side=defender`: 自分が与えたダメージから、相手の防御側(H32 前提で B または D の SP 0..32)を逆算する。
          `known` は自分=攻撃側。
        - `side=attacker`: 自分が受けたダメージから、相手の攻撃側(A または C の SP 0..32)を逆算する。
          `known` は自分=防御側。
        - 候補は「性格クラス(neutral / plus)× itemCandidates」の全組合せで、説明できない候補も最も近い SP 付きで返す。
        - 並びは Mismatch 昇順 → Support 降順 → SPCount 降順 → 定義順(性格クラス neutral→plus、itemCandidates の添字)の
          全順序(ADR-0010 §R4)。`maxCandidates` は並べた後に上から切る。`exactCount` は切る前の値。
        - 件数の上限(ADR-0208): `itemCandidates` は 64 件以下で重複なし、`observations` は 16 件以下、
          `maxCandidates` は 0〜128。超えたものは ID の解決・計算より前に 400 `invalid_input` で拒否する
          (`maxCandidates` は返却件数だけの上限で、計算量は減らないため別に上限を置く)。
        正確さより候補の提示を優先する。複数観測で絞り込む。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '200':
          description: 調整候補
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReverseResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            下流が使えない。calc-svc がマスタを参照できない(`master_unavailable`)、または
            gateway から calc-svc に届かない(`upstream_unavailable`。ADR-0202)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/record/frequent-opponents:
    get:
      tags: [record]
      operationId: listFrequentOpponents
      summary: この端末でよく計算した相手(防御側の種族)を頻度×時間減衰の順に返す
      description: |
        `X-Device-Id` の端末の計算イベント(`calc_events`)だけから作った集計を、スコアの降順で返す
        (requirements.md §2「よく使うポケモン」・ADR-0209 §3 #2・§6-3)。他端末のイベントは混ぜない。

        - スコアは「頻度 × 時間減衰(半減期は record-svc の設定。生イベントの保持期間 90日より短い。ADR-0209 §4)」で、
          絶対値に意味は無い(並び順と相対比較のためだけの値)。
        - 返すのは `speciesKey` だけで、名前・タイプ・画像は返さない(マスタは pokedex-svc の担当。
          CLAUDE.md 絶対ルール4)。クライアントは必要なら `/api/pokedex/species/{key}` を引く。
        - 記録が1件も無い端末は空配列(404 にしない)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          description: 返す上限。範囲外・整数でない値は 400 `invalid_input`
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: スコアの降順(同点は speciesKey の昇順)。記録が無ければ空配列
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FrequentOpponent' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            record-svc が TiDB に届かない(`store_unavailable`)、または gateway から record-svc に届かない
            (`upstream_unavailable`。ADR-0202・ADR-0209 §5.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/record/device-data:
    delete:
      tags: [record]
      operationId: deleteRecordDeviceData
      summary: この端末の記録(計算イベント・集計・お気に入り)をすべて削除する
      description: |
        X-Device-Id の端末に紐づく record DB の行をすべて消す(ADR-0209 §5)。冪等で、
        何も無い端末でも 200 `completed` を返す(404 にしない)。1回で消しきれない場合は
        `partial` を返すので、同じ要求を `completed` になるまで繰り返す。
        削除の時点を墓石として記録し、それ以前に発生した計算イベントが JetStream から
        後から届いても保存しない(ADR-0209 §7)。team DB は消さないので、
        クライアントは `DELETE /api/team/device-data` も呼ぶ。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 削除の結果(`partial` なら残りがある)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDeletionResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: record-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/team/teams:
    get:
      tags: [team]
      operationId: listTeams
      summary: この端末の構築を一覧する
      description: |
        `X-Device-Id` の端末の構築だけを、更新の新しい順(同時刻は `id` の昇順)で返す
        (ADR-0209 §6-1・§6-3)。他端末の構築は混ざらない。1件も無ければ空配列(404 にしない)。

        メンバーまで含めた完全な `Team` を返す。ページングは持たない(1端末が持てる構築は
        **100件**で頭打ちなので、一覧は常に有限で小さい。ADR-0213 §2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: この端末の構築(更新の新しい順)。無ければ空配列
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: |
            team-svc が TiDB に届かない(`store_unavailable`)、または gateway から team-svc に届かない
            (`upstream_unavailable`。ADR-0202・ADR-0209 §5.3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    post:
      tags: [team]
      operationId: createTeam
      summary: 構築を1つ作る
      description: |
        `id` と `createdAt` / `updatedAt` はサーバーが決める(要求には含めない。含めたら 400 `unknown_field`)。
        1端末が持てる構築は **100件**まで。上限に達している端末からの作成は 400 `invalid_input`(ADR-0213 §2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: 作った構築(サーバーが決めた `id` と時刻を含む)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/team/teams/{teamId}:
    get:
      tags: [team]
      operationId: getTeam
      summary: 構築を1つ取得する
      description: |
        先に端末 ID で絞ってから `teamId` を照合する(ADR-0209 §6-2)。この端末が持っていない
        `teamId`(他端末のもの・実在しないもの・形式が違うものを区別しない)は 404 `not_found`。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: 構築
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    put:
      tags: [team]
      operationId: updateTeam
      summary: 構築を丸ごと置き換える
      description: |
        名前とメンバー全体を要求の内容で置き換える(部分更新・メンバー個別の更新は持たない。ADR-0213 §2)。
        `members` を省略した場合は「メンバーなし」に置き換わる(消し忘れではなく明示の置換として扱う)。
        この端末が持っていない `teamId` は 404 `not_found`(ADR-0209 §6-2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: 置き換えた後の構築(`updatedAt` は更新される)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

    delete:
      tags: [team]
      operationId: deleteTeam
      summary: 構築を1つ削除する
      description: |
        成功は 204(本文なし)。この端末が持っていない `teamId` は 404 `not_found` で、
        同じ構築をもう一度削除しても 404 になる(端末単位の全削除 `deleteTeamDeviceData` とは違い、
        1件の削除は「消した」と「もともと無い」を区別する。ADR-0213 §2)。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: 削除した(本文なし)
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /api/team/device-data:
    delete:
      tags: [team]
      operationId: deleteTeamDeviceData
      summary: この端末の構築をすべて削除する
      description: |
        X-Device-Id の端末に紐づく team DB の行(構築とその個体)をすべて消す。
        冪等性・`partial` の扱いは deleteRecordDeviceData と同じ(ADR-0209 §5)。
        削除の時点を墓石として記録し、それ以前に発生した計算イベントが JetStream から
        後から届いても `devices.last_seen_at` を進めない(ADR-0209 §7・ADR-0213 §5)。
        record DB は消さないので、クライアントは `DELETE /api/record/device-data` も呼ぶ。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 削除の結果(`partial` なら残りがある)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDeletionResult' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          description: team-svc が DB に届かない(`store_unavailable`)、または gateway から届かない(`upstream_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default:
          $ref: '#/components/responses/Error'

  /internal/pokedex/master:
    get:
      tags: [internal]
      operationId: getMasterExport
      summary: 計算用のマスタ一式(pokedex-svc → calc-svc)
      description: |
        pokedex-svc が自分の DB(マスタの正本。CLAUDE.md 絶対ルール4)から、calc-svc が計算に使うマスタ一式を
        DB の行に近い形で返す(ADR-0204)。calc-svc は起動時に1度取得し、`services/internal/master` の写像で
        engine の型にしてメモリに載せる(取得後の再取得はしない。マスタの更新は calc-svc の再起動で反映する)。
        - 使用可能集合(レギュレーション)で絞らない。計算は全件を扱える必要がある(絞り込みは pokedex の検索の仕事)。
        - 並び順に意味は持たせない(タイプの表示順は `types[].sortOrder`)。
        - gateway は公開しない。端末ID/セッションID は要らない。
      responses:
        '200':
          description: マスタ一式
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterExport' }
        '503':
          description: マスタを返せない(DB に未投入・DB に接続できない。`master_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        クライアント生成の端末 UUID(正準形 8-4-4-4-12 の16進。大文字小文字・版は問わない)。
        gateway が検証する(ADR-0202): 欠落・空は 400 `missing_header`、UUID でない値・同名ヘッダの重複は 400 `invalid_header`。
        下流のサービスは UUID 形式を検証しない(生成型は string のまま。x-go-type)。

        保存データ(record / team。M2)では、この値を**データの分割キー**として使う。秘密ではなく所有権の証明でもない
        (**認証ではない**)ので、v1 の公開範囲は個人利用 + Tailscale 内に限る。端末 ID が変わると前のデータには戻れない。
        公開範囲・保持期間・端末単位の全削除は ADR-0209。
      schema:
        type: string
        format: uuid
        x-go-type: string
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      description: |
        セッション UUID(形式と gateway の検証は X-Device-Id と同じ。ADR-0202)。

        保存データでは、計算イベントに「どの一連の操作か」として記録するだけで、**分割キーにはしない**
        (データの分離・削除・保持期間の判定は端末 ID だけで行う。ADR-0209 §2)。
      schema:
        type: string
        format: uuid
        x-go-type: string
    TeamId:
      name: teamId
      in: path
      required: true
      description: |
        構築の ID(作成時にサーバーが発行する UUID。ADR-0213 §2)。
        端末 ID は**パスに含めない**(ヘッダだけが正。ADR-0209 §2・§6-4)。
        この端末が持っていない ID は、他端末のものか実在しないかを区別せず 404 `not_found`(§6-2)。
      schema: { $ref: '#/components/schemas/TeamId' }

  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: |
        エラーの本文。HTTP ステータスは `code` から決まる(ErrorCode の対応表)。
        `message` は日本語の説明で、Go の内部情報(スタック・型名)を含めない。
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    ErrorCode:
      type: string
      description: |
        安定したエラーコード。WASM 境界(engine/wasmapi の Code* 定数。ADR-0011 §5・§13)と語彙を共通にし、
        **同じ失敗は HTTP と WASM で同じ code** になる(ADR-0200)。

        WASM 境界と共通:
        | code | 意味 | HTTP |
        |---|---|---|
        | invalid_json | JSON として壊れている / 型が合わない(整数のフィールドに小数を含む) | 400 |
        | unknown_field | 契約にないフィールド | 400 |
        | invalid_enum | 列挙(形式・タイプ・天候・フィールド・状態異常)の値が未知 | 400 |
        | invalid_input | 入力検証(SP の範囲・合計、ランク、レベル、性格が HP など)。候補・観測の件数上限(`maxItems`)超過、持ち物候補の重複(`uniqueItems`)、`maxCandidates` の範囲外を含む(ADR-0208)。`getMovesByIds` の `ids` の件数超過・欠落も含む。team では構築名の長さ・メンバー数・技の重複・SP の範囲と合計・1端末が持てる構築の上限(ADR-0213 §2)も含む | 400 |
        | unknown_preset | 未知の防御側プリセット | 400 |
        | duplicate_preset | 防御側プリセットの重複 | 400 |
        | invalid_preset | 防御側プリセットの定義が不正 | 400 |
        | invalid_reverse_side | 逆算の side が defender / attacker のどちらでもない | 400 |
        | no_observation | 観測が1件も無い | 400 |
        | invalid_observation | 観測の指定が不正(percent / percentTenths / damage のちょうど1つでない・範囲外) | 400 |
        | type_chart_missing | タイプ相性表が無い(HTTP では常にマスタ = 起動時に読み込んだ Store 側の不備で、クライアントの入力起因では起こらない) | 500 |
        | invalid_type_chart | タイプ相性表の定義が不正(同上。HTTP では常にマスタ側の不備) | 500 |
        | unknown_type | 相性表に無いタイプ | 400 |
        | internal | 上記以外の失敗(回復した panic を含む) | 500 |

        HTTP だけのもの:
        | code | 意味 | HTTP |
        |---|---|---|
        | missing_header | X-Device-Id / X-Session-Id が無い・空 | 400 |
        | invalid_header | X-Device-Id / X-Session-Id が UUID でない・同名ヘッダの重複(UUID 形式の検証は gateway だけが行う。ADR-0202) | 400 |
        | unknown_species | speciesKey がマスタに無い | 400 |
        | unknown_move | moveId がマスタに無い | 400 |
        | unknown_item | itemId がマスタに無い | 400 |
        | unknown_ability | abilityId がマスタに無い | 400 |
        | unknown_nature | natureId がマスタに無い | 400 |
        | not_found | ルートが無い / このサービスの担当外の操作 / この端末が持っていないリソース ID(他端末のものか実在しないかを区別しない。403 にしない。ADR-0209 §6-2) | 404 |
        | master_unavailable | マスタ(pokedex の MySQL)を参照できない | 503 |
        | store_unavailable | 保存データの DB(record / team の TiDB)を参照できない。`master_unavailable` と分けるのは原因も復旧手順も別で、「計算はできるが保存はできない」状態(CLAUDE.md 絶対ルール5)をクライアントが区別できる必要があるため(ADR-0209 §5.3) | 503 |
        | upstream_unavailable | gateway から下流のサービスに届かない(接続できない・タイムアウト・上流が未設定。ADR-0202) | 503 |
      enum: [invalid_json, unknown_field, invalid_enum, invalid_input,
             unknown_preset, duplicate_preset, invalid_preset,
             invalid_reverse_side, no_observation, invalid_observation,
             type_chart_missing, invalid_type_chart, unknown_type, internal,
             missing_header, invalid_header, unknown_species, unknown_move, unknown_item, unknown_ability, unknown_nature,
             not_found, master_unavailable, store_unavailable, upstream_unavailable]

    Format:
      type: string
      enum: [single, double]
      default: single

    SpeciesKey:
      type: string
      description: '{図鑑番号4桁}-{フォルム3桁}'
      pattern: '^[0-9]{4}-[0-9]{3}$'
      example: '0445-000'

    StatKey:
      type: string
      enum: [hp, atk, def, spa, spd, spe]

    PokeType:
      type: string
      enum: [normal, fire, water, electric, grass, ice, fighting, poison, ground,
             flying, psychic, bug, rock, ghost, dragon, dark, steel, fairy]

    MoveCategory:
      type: string
      enum: [physical, special, status]

    StatusCondition:
      type: string
      enum: [none, burn, paralysis, poison, badly_poison, sleep, freeze]
      default: none

    Weather:
      type: string
      enum: [none, sun, rain, sand, snow]
      default: none

    Terrain:
      type: string
      enum: [none, electric, grassy, misty, psychic]
      default: none

    SpeciesSummary:
      type: object
      required: [key, dexNo, form, nameJa, types]
      properties:
        key: { $ref: '#/components/schemas/SpeciesKey' }
        dexNo: { type: integer }
        form: { type: integer, description: フォルム番号 }
        nameJa: { type: string }
        types:
          type: array
          items: { $ref: '#/components/schemas/PokeType' }
          minItems: 1
          maxItems: 2

    SpeciesDetail:
      allOf:
        - $ref: '#/components/schemas/SpeciesSummary'
        - type: object
          required: [baseStats, abilities]
          properties:
            baseStats: { $ref: '#/components/schemas/StatBlock' }
            abilities:
              type: array
              items: { $ref: '#/components/schemas/Ability' }
            learnset:
              type: array
              description: 覚える技の ID 一覧
              items: { type: string }

    StatBlock:
      type: object
      description: 6ステータスの値(種族値・実数値・SPなどに共用)
      required: [hp, atk, def, spa, spd, spe]
      properties:
        hp: { type: integer }
        atk: { type: integer }
        def: { type: integer }
        spa: { type: integer }
        spd: { type: integer }
        spe: { type: integer }

    RankBlock:
      type: object
      description: ランク補正(-6..+6)。HP は持たない
      properties:
        atk: { type: integer, minimum: -6, maximum: 6, default: 0 }
        def: { type: integer, minimum: -6, maximum: 6, default: 0 }
        spa: { type: integer, minimum: -6, maximum: 6, default: 0 }
        spd: { type: integer, minimum: -6, maximum: 6, default: 0 }
        spe: { type: integer, minimum: -6, maximum: 6, default: 0 }

    Ability:
      type: object
      required: [id, nameJa]
      properties:
        id: { type: string }
        nameJa: { type: string }

    Move:
      type: object
      required: [id, nameJa, type, category, power]
      properties:
        id: { type: string }
        nameJa: { type: string }
        type: { $ref: '#/components/schemas/PokeType' }
        category: { $ref: '#/components/schemas/MoveCategory' }
        power: { type: integer, description: 威力(0 は変化技/固定ダメージ) }
        priority: { type: integer, default: 0 }

    Item:
      type: object
      required: [id, nameJa]
      properties:
        id: { type: string }
        nameJa: { type: string }

    Nature:
      type: object
      required: [id, nameJa]
      properties:
        id: { type: string, example: adamant }
        nameJa: { type: string, example: いじっぱり }
        plus:
          description: 上昇補正(+10%)を受ける能力。無補正性格は null
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
        minus:
          description: 下降補正(-10%)を受ける能力。無補正性格は null
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]

    Individual:
      type: object
      description: 計算に使う個体。SP と性格 ID から実数値を導出する
      required: [speciesKey, natureId, sp]
      properties:
        speciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        level: { type: integer, minimum: 50, maximum: 50, default: 50 }
        natureId: { type: string }
        abilityId: { type: string, nullable: true }
        itemId: { type: string, nullable: true }
        moveId: { type: string, nullable: true, description: 攻撃側で使う技 }
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 能力ポイント。各 0..32、合計 <= 66
        ranks: { $ref: '#/components/schemas/RankBlock' }
        teraType:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/PokeType' } ]
        status: { $ref: '#/components/schemas/StatusCondition' }

    Screens:
      type: object
      properties:
        reflect: { type: boolean, default: false }
        lightScreen: { type: boolean, default: false }
        auroraVeil: { type: boolean, default: false }

    FieldState:
      type: object
      properties:
        weather: { $ref: '#/components/schemas/Weather' }
        terrain: { $ref: '#/components/schemas/Terrain' }
        attackerScreens: { $ref: '#/components/schemas/Screens' }
        defenderScreens: { $ref: '#/components/schemas/Screens' }

    CalcOptions:
      type: object
      properties:
        critical: { type: boolean, default: false, description: 急所 }

    CalcRequest:
      type: object
      required: [format, attacker, defender, moveId]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        attacker: { $ref: '#/components/schemas/Individual' }
        defender: { $ref: '#/components/schemas/Individual' }
        moveId: { type: string, description: 使用する技(attacker.moveId より優先) }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }

    KOChance:
      type: object
      description: 確定数/乱数n発
      required: [hits, guaranteed, displayChancePercent]
      properties:
        hits: { type: integer, description: 最大ダメージで倒すのに必要な攻撃回数(0 = 倒せない) }
        guaranteed: { type: boolean, description: 最小ダメージでも hits 回で倒せるなら true(確定n発) }
        chancePercent:
          type: number
          format: double
          description: |
            engine の生値。guaranteed が false のとき、hits 回で倒せる確率(%)を丸めずに返す
            (ADR-0006)。guaranteed が true のとき、および hits = 0(倒せない)のときは 0。
            **画面に出す値ではない**(確定なのに 0% と誤表示されるため)。表示には
            displayChancePercent を使う。
        displayChancePercent:
          type: number
          format: double
          description: |
            画面に出す「hits 回で倒せる確率(%)」。常に表示できる値であることを保証する。
            小数第1位(0.1%刻み。ADR-0010 §3)。
            - hits = 0(倒せない): 0
            - guaranteed = true(確定 n 発): 100.0
            - それ以外: chancePercent を 0.1% 単位に四捨五入し、[0.1, 99.9] に収める
              (確定・不可能と取り違えないため、0.0 と 100.0 はこの2つに予約する)

    UnsupportedMark:
      type: object
      description: |
        「この結果は正しくない可能性がある」印1つ(ADR-0123)。engine が正しく計算できない技の機構・
        持ち物・特性に、数値は通常の式のまま付ける(400 で拒否しない)。
      required: [target, reason, id]
      properties:
        target:
          type: string
          description: 印の対象
          enum: [move, attacker_item, attacker_ability, defender_item, defender_ability]
        reason:
          type: string
          description: |
            印の理由。技は機構の値(MasterMove.mechanisms と同じ13種)か zero_power(威力0の攻撃技。
            威力が技の処理で決まるため)、持ち物・特性は unsupported_effect(効果スキーマで表せない)。
          enum: [alt_defense_stat, alt_offense_stat, always_crit, effectiveness_change, field_specific,
                 fixed_damage, ignore_defense_ranks, move_specific, multi_hit, ohko, priority_change,
                 type_change, variable_power, zero_power, unsupported_effect]
        id: { type: string, description: 技・持ち物・特性の ID }

    CalcResult:
      type: object
      required: [rolls, minDamage, maxDamage, minPercent, maxPercent, defenderHP, effectiveness, stab, category, ko, unsupported]
      properties:
        rolls:
          type: array
          description: 16 段階の乱数ダメージ(非減少)
          items: { type: integer }
          minItems: 16
          maxItems: 16
        minDamage: { type: integer }
        maxDamage: { type: integer }
        minPercent:
          type: number
          format: double
          description: |
            最小ダメージの表示%(防御側 HP に対する割合)。小数第1位(0.1%刻み)で、
            **切り捨て**る(「最低これくらい入る」を保守的に示すため。ADR-0010 §3)。
            整数%に丸めてから小数にした値ではない。HP 比率から直接求める。
            engine の 0.1% 単位の整数(tenths)を 10 で割っただけの値で、float で近似しない。
        maxPercent:
          type: number
          format: double
          description: |
            最大ダメージの表示%(防御側 HP に対する割合)。小数第1位(0.1%刻み)で、
            **四捨五入**する(ADR-0010 §3)。
            100 を超える場合は上限で切らず、そのまま返す(例 137.0)。
            逆算の入力の観測%(`Observation.percent` / `percentTenths`)とは別概念。
        defenderHP: { type: integer }
        effectiveness:
          type: number
          format: double
          description: タイプ相性(0, 0.25, 0.5, 1, 2, 4)
        stab: { type: boolean, description: タイプ一致 }
        category:
          allOf: [ { $ref: '#/components/schemas/MoveCategory' } ]
          description: 使った技の分類(WASM 境界の CalcResult と同じ。Web が型を共有するため)
        ko: { $ref: '#/components/schemas/KOChance' }
        unsupported:
          type: array
          description: |
            この結果に付いた「未対応」の印(ADR-0123)。印なしは空配列(WASM 境界の CalcResult と同じ形)。
          items: { $ref: '#/components/schemas/UnsupportedMark' }

    DefenderPreset:
      type: string
      description: |
        防御側の代表調整(耐久が上がる順)。SP は能力ポイント(Lv50・個体値31固定)。
        性格の「無補正」は上昇・下降なし、「+B/-A」は防御上昇・攻撃下降のこと。
        engine の PresetKey と同一文字列(docs/adr/0009-bulk-calc-presets.md §1)。
        - `none`: 無振り(SP なし・無補正)。全分類
        - `hp`: H振り(HP 32・無補正)。全分類
        - `hb_boost`: H振り+B補正(HP 32・防御上昇 +B/-A)。物理
        - `hb`: HB振り(HP 32・防御 32・無補正)。物理
        - `hb_full`: HB特化(HP 32・防御 32・防御上昇 +B/-A)。物理
        - `hd_boost`: H振り+D補正(HP 32・特防上昇 +D/-A)。特殊
        - `hd`: HD振り(HP 32・特防 32・無補正)。特殊
        - `hd_full`: HD特化(HP 32・特防 32・特防上昇 +D/-A)。特殊
      enum: [none, hp, hb_boost, hb, hb_full, hd_boost, hd, hd_full]

    BulkCalcRequest:
      type: object
      required: [format, attacker, defenderSpeciesKey, moveId]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        attacker: { $ref: '#/components/schemas/Individual' }
        defenderSpeciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        moveId: { type: string }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }
        presets:
          type: array
          description: |
            使う防御側プリセットと行の順序。省略と空配列(`[]`)は同じで、技の分類に応じた既定セットになる。
            物理技は 5 件(none, hp, hb_boost, hb, hb_full)、
            特殊技は 5 件(none, hp, hd_boost, hd, hd_full)、
            **変化技は 2 件(none, hp)のみ**。
            指定したときはその順に行を返す(分類に合わないプリセットも指定どおり返す)。
            同じ preset を2回以上含めると 400 `duplicate_preset`(`uniqueItems` 違反に対する
            この操作の code。ADR-0208)。9 件以上は 400 `invalid_input`。
            engine のカスタムプリセット定義(SP・性格を任意に決めたもの)は API に出さない。
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/DefenderPreset' }
        itemVariants:
          type: array
          description: |
            差し替えて比較する持ち物 ID(省略時は素の1通り)。null 要素は「持ち物なし」。
            65 件以上、または同じ値(null どうしを含む)の重複は 400 `invalid_input`(ADR-0208)。
            行数は `len(presets) × len(itemVariants)` なので、上限は 8 × 64 = 512 行。
          maxItems: 64
          uniqueItems: true
          items: { type: string, nullable: true }

    BulkCalcRow:
      type: object
      required: [preset, presetLabel, defender, result]
      properties:
        preset: { $ref: '#/components/schemas/DefenderPreset' }
        presetLabel: { type: string, description: 表示名(例 HB振り / HB特化 / H振り+B補正) }
        itemId: { type: string, nullable: true, description: この行の防御側の持ち物(持ち物なしは null) }
        defender: { $ref: '#/components/schemas/BulkDefender' }
        result: { $ref: '#/components/schemas/CalcResult' }

    NatureModifier:
      type: object
      description: |
        性格補正の構造値。plus が +10%、minus が -10% を受ける能力。無補正は両方 null。
        HP を指すことはない。
      required: [plus, minus]
      properties:
        plus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
        minus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]

    BulkDefender:
      type: object
      description: 一括計算の1行で使った防御側の調整(SP・性格補正・実数値)
      required: [sp, nature, natureId, stats]
      properties:
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 能力ポイント
        nature: { $ref: '#/components/schemas/NatureModifier' }
        natureId:
          type: string
          nullable: true
          description: |
            nature と (plus, minus) が一致するマスタの性格 ID。無補正は、マスタの無補正性格を
            ID の昇順で並べた最初のもの。該当する性格がマスタに無ければ null。
        stats:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 実数値(Lv50・個体値31)

    BulkCalcResult:
      type: object
      required: [defenderSpeciesKey, rows]
      properties:
        defenderSpeciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/BulkCalcRow' }

    ReverseSide:
      type: string
      description: どちら側の調整を逆算するか(defender=与ダメ観測 / attacker=被ダメ観測)
      enum: [defender, attacker]

    Observation:
      type: object
      description: |
        1発ぶんの観測。percent / percentTenths / damage の**ちょうど1つ**を指定する(ADR-0010 §R2)。
        0 個・2 個以上・範囲外は 400 `invalid_observation`。整数でなければ(例 12.5)400 `invalid_json`。
        表示%(CalcResult.minPercent など)とは別概念で、丸め規則に依存しない区間で照合する。
      properties:
        percent:
          type: integer
          minimum: 1
          maximum: 100
          description: 整数%の観測(精度 1%)
        percentTenths:
          type: integer
          minimum: 1
          maximum: 1000
          description: 小数第1位の観測を 0.1% 単位の整数にしたもの(例 45.3% → 453)
        damage:
          type: integer
          minimum: 1
          description: HP の実点数の観測(自分の HP の減少量など)
        note: { type: string, description: 画面用のメモ。計算には使わない }

    ReverseRequest:
      type: object
      required: [format, side, known, unknownSpeciesKey, moveId, observations]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        side: { $ref: '#/components/schemas/ReverseSide' }
        known:
          allOf: [ { $ref: '#/components/schemas/Individual' } ]
          description: |
            既知の側(自分)の個体。side=defender なら自分=攻撃側、side=attacker なら自分=防御側。
            known.moveId は使わない(技は moveId で指定する)。
        unknownSpeciesKey:
          allOf: [ { $ref: '#/components/schemas/SpeciesKey' } ]
          description: 逆算する相手の種族。SP・性格・持ち物は探索対象なので渡さない
        moveId: { type: string, description: 観測したときの技(side=defender なら自分の技、attacker なら相手の技) }
        field: { $ref: '#/components/schemas/FieldState' }
        options: { $ref: '#/components/schemas/CalcOptions' }
        itemCandidates:
          type: array
          description: |
            相手の持ち物の候補(ID)。null 要素は「持ち物なし」。省略・空配列は [null] と同じ。
            65 件以上、または同じ値(null どうしを含む)の重複は 400 `invalid_input`(ADR-0208)。
          maxItems: 64
          uniqueItems: true
          items: { type: string, nullable: true }
        observations:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            同じ技・同じ場・同じ既知側に対する別々の1発。0 件は 400 `no_observation`、
            17 件以上は 400 `invalid_input`(ADR-0208)。同じ内容の観測を繰り返してよい
            (絞り込みに寄与しないだけで矛盾しない)ので `uniqueItems` は付けない。
          items: { $ref: '#/components/schemas/Observation' }
        maxCandidates:
          type: integer
          minimum: 0
          maximum: 128
          default: 0
          description: |
            返す候補数の上限。0 は「許可された入力から生まれる候補の全件」(上限は
            2 性格クラス × 64 itemCandidates = 128 件)。負の値と 129 以上は 400 `invalid_input`。

    NatureClass:
      type: string
      description: 関連ステータスに対する性格補正のクラス(neutral=無補正 / plus=関連ステータス +10%)。下降補正は探索しない
      enum: [neutral, plus]

    SPRange:
      type: object
      description: SP の区間(両端を含む)
      required: [min, max]
      properties:
        min: { type: integer, minimum: 0, maximum: 32 }
        max: { type: integer, minimum: 0, maximum: 32 }

    ReverseCandidate:
      type: object
      description: 候補1件(性格クラス × 持ち物。ADR-0010 §R3)
      required: [natureClass, nature, natureId, itemId, ranges, spCount, exact, mismatch, support, minPercent, maxPercent, unsupported]
      properties:
        natureClass: { $ref: '#/components/schemas/NatureClass' }
        nature: { $ref: '#/components/schemas/NatureModifier' }
        natureId:
          type: string
          nullable: true
          description: |
            nature と (plus, minus) が一致するマスタの性格 ID(BulkDefender.natureId と同じ規則)。
            無補正は、マスタの無補正性格を ID の昇順で並べた最初のもの。該当なしは null。
        itemId: { type: string, nullable: true, description: 持ち物(持ち物なしは null) }
        ranges:
          type: array
          minItems: 1
          description: 観測を説明できる SP の集合(昇順・互いに素・隣接しない極大連続区間)。説明できなければ距離最小の SP
          items: { $ref: '#/components/schemas/SPRange' }
        spCount: { type: integer, description: ranges に含まれる SP の数 }
        exact: { type: boolean, description: mismatch == 0(全観測を説明できる) }
        mismatch: { type: integer, description: 観測とのずれ(0.1% 単位の整数。0 は完全に説明できる) }
        support: { type: integer, description: ranges の各 SP で各観測を説明できるロールの延べ数 }
        minPercent:
          type: number
          format: double
          description: ranges 全体での想定ダメージ幅の下限(表示%。小数第1位・切り捨て。CalcResult.minPercent と同じ意味)
        maxPercent:
          type: number
          format: double
          description: ranges 全体での想定ダメージ幅の上限(表示%。小数第1位・四捨五入。CalcResult.maxPercent と同じ意味)
        unsupported:
          type: array
          description: |
            この候補の計算に付いた「未対応」の印(ADR-0123)。SP によらず同じ(技・場・既知側は候補間で共通)。
            印なしは空配列。
          items: { $ref: '#/components/schemas/UnsupportedMark' }

    ReverseResult:
      type: object
      required: [side, stat, assumedHpSp, exactCount, candidates]
      properties:
        side: { $ref: '#/components/schemas/ReverseSide' }
        stat:
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
          description: 逆算した関連ステータス(技の分類と side から決まる)
        assumedHpSp:
          type: integer
          description: 仮定した相手の H の SP(defender=32、attacker=0。ADR-0010 §R1)
        exactCount: { type: integer, description: exact な候補の数(maxCandidates で切る前) }
        candidates:
          type: array
          description: Mismatch 昇順 → Support 降順 → SPCount 降順 → 定義順(ADR-0010 §R4)
          items: { $ref: '#/components/schemas/ReverseCandidate' }

    MasterExport:
      type: object
      description: |
        calc-svc が計算に使うマスタ一式(ADR-0204)。形は pokedex の DB の行(`services/internal/master` の
        TypeRow / TypeChartRow / SpeciesRow + SpeciesAbilityRow / MoveRow / ItemRow / AbilityRow)に対応する。
        値の検証(ID の形式・範囲・組の整合・効果定義)は受け取った側が共通マスタの写像で行う。
      required: [schemaVersion, dataVersion, types, typeChart, species, moves, items, abilities, natures]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
          description: この形の版。いまは 1 だけ
        dataVersion:
          type: string
          minLength: 1
          description: |
            データの版の識別子(pokedex の data_versions に由来する)。calc-svc は記録とログに使うだけで、
            計算の結果には影響しない。
        types:
          type: array
          items: { $ref: '#/components/schemas/MasterType' }
        typeChart:
          type: array
          description: タイプ相性表の行(ADR-0013)。等倍(code 2)の組は省略してよい
          items: { $ref: '#/components/schemas/MasterTypeChartEntry' }
        species:
          type: array
          items: { $ref: '#/components/schemas/MasterSpecies' }
        moves:
          type: array
          items: { $ref: '#/components/schemas/MasterMove' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MasterItem' }
        abilities:
          type: array
          items: { $ref: '#/components/schemas/MasterAbility' }
        natures:
          type: array
          items: { $ref: '#/components/schemas/MasterNature' }

    MasterType:
      type: object
      description: types テーブルの行
      required: [id, sortOrder, nameJa]
      properties:
        id: { $ref: '#/components/schemas/PokeType' }
        sortOrder: { type: integer, description: 表示順(重複しない) }
        nameJa: { type: string }

    MasterTypeChartEntry:
      type: object
      description: type_chart テーブルの行。code は倍率を ×2 した整数(0=無効・1=いまひとつ・2=等倍・4=ばつぐん。ADR-0013)
      required: [attackType, defenseType, code]
      properties:
        attackType: { $ref: '#/components/schemas/PokeType' }
        defenseType: { $ref: '#/components/schemas/PokeType' }
        code: { type: integer, enum: [0, 1, 2, 4] }

    MasterSpecies:
      type: object
      description: |
        species テーブルの行と、その species_abilities の行。showdownId は取得元との突き合わせ用の ID で、
        共通マスタの写像が形式を検証する(ADR-0100 §2)。
      required: [key, dexNo, form, showdownId, nameJa, type1, type2, baseStats, isMega, baseSpeciesKey, requiredItemId, abilities]
      properties:
        key: { $ref: '#/components/schemas/SpeciesKey' }
        dexNo: { type: integer }
        form: { type: integer }
        showdownId: { type: string }
        nameJa: { type: string }
        type1: { $ref: '#/components/schemas/PokeType' }
        type2:
          description: 第2タイプ。単タイプは null
          nullable: true
          allOf: [ { $ref: '#/components/schemas/PokeType' } ]
        baseStats:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 種族値
        isMega: { type: boolean }
        baseSpeciesKey:
          type: string
          nullable: true
          description: メガシンカ前の種族キー(メガでなければ null)
        requiredItemId:
          type: string
          nullable: true
          description: メガシンカに要る持ち物の ID(メガでなければ null)
        abilities:
          type: array
          items: { $ref: '#/components/schemas/MasterSpeciesAbility' }

    MasterSpeciesAbility:
      type: object
      description: species_abilities テーブルの行
      required: [slot, abilityId]
      properties:
        slot: { type: integer, description: '1..4(Showdown の特性スロット "S" を含む。ADR-0103 §12)' }
        abilityId: { type: string }

    MasterMove:
      type: object
      description: moves テーブルの行(計算に使う列だけ)+ move_effects の effect(ADR-0107)
      required: [id, nameJa, type, category, power, priority, effect, mechanisms]
      properties:
        id: { type: string }
        nameJa: { type: string }
        type: { $ref: '#/components/schemas/PokeType' }
        category: { $ref: '#/components/schemas/MoveCategory' }
        power: { type: integer }
        priority: { type: integer }
        effect:
          allOf: [ { $ref: '#/components/schemas/MasterEffect' } ]
          description: |
            技の追加効果(命中時のランク変化。ADR-0107)。null は追加効果なし。
            ダメージ計算はこの値を読まない(ADR-0107 決定2)。発動するかどうかの判定も engine は行わず、
            「発動した場合の変化量」と「その確率」を持つだけ(ADR-0107 決定1)。
        mechanisms:
          type: array
          description: |
            技の機構(move_mechanisms。ADR-0121)。「威力・分類・タイプから通常の式で計算すると誤る」理由の
            分類で、1つの技が複数を持つことがある。昇順・重複なし。通常の技(変化技を含む)は空配列。
            calc-svc は engine.Move.Mechanisms にそのまま渡す(「未対応」の印の判定に使う。ADR-0123)。
            値は UnsupportedMark.reason の技側13種と同じ(正は engine.AllMoveMechanisms)。ここでは
            enum を付けない(意図的。ADR-0121 実装時の追記を参照): この内部 API は pokedex-svc → calc-svc
            のみで使い、値の妥当性は既に `services/internal/master.MoveMechanismsOf` が検証している。
            enum にすると oapi-codegen が別の Go 型を生成し、両サービスで `[]string` との相互変換が
            必要になるだけで、二重の検証にしかならない。
          items: { type: string }

    MasterEffect:
      type: object
      additionalProperties: true
      nullable: true
      description: |
        効果定義(item_effects / ability_effects の JSON をそのまま。ADR-0005)。null は補正なし。
        形は共通マスタ(`services/internal/master` の DecodeItemEffect / DecodeAbilityEffect)が受け付けるもので、
        受け取った側がそこで厳格に検証する(未知のキー・4096 基準の整数でない値・空のオブジェクトは不正)。

    MasterItem:
      type: object
      description: items テーブルの行 + item_effects の effect
      required: [id, nameJa, effect]
      properties:
        id: { type: string }
        nameJa: { type: string }
        effect: { $ref: '#/components/schemas/MasterEffect' }

    MasterAbility:
      type: object
      description: abilities テーブルの行 + ability_effects の effect
      required: [id, nameJa, effect]
      properties:
        id: { type: string }
        nameJa: { type: string }
        effect: { $ref: '#/components/schemas/MasterEffect' }

    MasterNature:
      type: object
      description: 性格(ADR-0204 でデータレーンに natures テーブルを提案)。無補正は plus / minus とも null。HP を指すことはない
      required: [id, nameJa, plus, minus]
      properties:
        id: { type: string }
        nameJa: { type: string }
        plus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]
        minus:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/StatKey' } ]

    # --- record-svc(ADR-0209 §5.3 から移した契約。P5-3)-------------------------

    FrequentOpponent:
      type: object
      description: |
        「よく使う相手」1件(ADR-0209 §3 #2)。端末内の計算イベントの集計で、他端末のイベントは混ざらない。
        個体の中身(技・持ち物・特性・性格・SP)・ダメージの数値は返さない(集計に使うのは防御側の種族だけ)。
      required: [speciesKey, score, count, lastCalculatedAt]
      properties:
        speciesKey:
          allOf: [ { $ref: '#/components/schemas/SpeciesKey' } ]
          description: 防御側(相手)の種族。名前・タイプは pokedex-svc から引く
        score:
          type: number
          format: double
          minimum: 0
          description: 頻度 × 時間減衰。並び順のための相対値で、絶対値に意味は無い(ADR-0209 §4)
        count:
          type: integer
          minimum: 1
          description: 減衰をかける前の、集計対象として残っている計算イベントの件数
        lastCalculatedAt:
          type: string
          format: date-time
          description: この相手を最後に計算した時刻(イベントの `occurred_at`)

    DeletionStatus:
      type: string
      description: |
        `completed` = この端末のデータは残っていない。`partial` = 1回の上限に達したので残りがある
        (同じ要求を繰り返す。ADR-0209 §5.2)。
      enum: [completed, partial]

    RecordDeletionResult:
      type: object
      required: [status, purgedAt, deleted]
      properties:
        status: { $ref: '#/components/schemas/DeletionStatus' }
        purgedAt:
          type: string
          format: date-time
          description: 墓石の時刻。これ以前に発生した計算イベントは以後保存しない(ADR-0209 §7)
        deleted:
          type: object
          description: この呼び出しで消した行数(冪等なので2回目は 0 になる)
          required: [calcEvents, aggregates, favorites]
          properties:
            calcEvents: { type: integer, minimum: 0 }
            aggregates: { type: integer, minimum: 0 }
            favorites: { type: integer, minimum: 0 }

    # --- team-svc(ADR-0209 §5.3 から移した契約 + ADR-0213 の CRUD。P5-4)---------

    TeamId:
      type: string
      description: 構築の ID(サーバーが発行する UUID。正準形 8-4-4-4-12 の16進)
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      example: '11111111-2222-4333-8444-555555555555'

    TeamMember:
      type: object
      description: |
        構築の1体(ADR-0213 §3)。種族・技・持ち物・特性・性格・SP・テラスタイプは **ID のまま**運び、
        team-svc はマスタに実在するかを検証しない(CLAUDE.md 絶対ルール4)。
        並び順(パーティの何番目か)は `Team.members` の配列の順序そのもので、`slot` は持たない。
      required: [speciesKey, natureId, sp]
      properties:
        speciesKey: { $ref: '#/components/schemas/SpeciesKey' }
        nickname:
          type: string
          nullable: true
          maxLength: 24
          description: |
            任意のニックネーム(文字数は Unicode コードポイントで数える)。空文字は null と同じ「未設定」として扱う。
            利用者の自由入力で個人を特定しうるため、**ログには出さない**(ADR-0209 §3)。
        moveIds:
          type: array
          description: 覚えさせる技(最大4つ・同一メンバー内で重複不可。並び順は表示順)
          items: { type: string }
          maxItems: 4
          uniqueItems: true
          default: []
        itemId: { type: string, nullable: true, description: 持ち物(持たせないときは null) }
        abilityId: { type: string, nullable: true, description: 特性(未選択のときは null) }
        natureId: { type: string }
        sp:
          allOf: [ { $ref: '#/components/schemas/StatBlock' } ]
          description: 能力ポイント。各 0..32、合計 <= 66(Individual.sp と同じ規則。範囲外は 400 `invalid_input`)
        teraType:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/PokeType' } ]

    TeamInput:
      type: object
      description: |
        構築の作成(`createTeam`)・置換(`updateTeam`)で送る内容。`id` / `createdAt` / `updatedAt` は
        サーバーが決めるので送らない(送ったら 400 `unknown_field`)。
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 構築名(前後の空白を除いて1文字以上。文字数は Unicode コードポイントで数える)
        members:
          type: array
          description: パーティ(最大6体。省略・空配列は「メンバーなし」)
          items: { $ref: '#/components/schemas/TeamMember' }
          maxItems: 6
          default: []

    Team:
      type: object
      description: 保存済みの構築(ADR-0213 §2)
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/TeamId' }
        name: { type: string, minLength: 1, maxLength: 50 }
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
          maxItems: 6
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: 最終更新。失効の判定に使う(`max(devices.last_seen_at, updatedAt)` から540日。ADR-0209 §4)

    TeamDeletionResult:
      type: object
      required: [status, purgedAt, deleted]
      properties:
        status: { $ref: '#/components/schemas/DeletionStatus' }
        purgedAt:
          type: string
          format: date-time
          description: 墓石の時刻。これ以前に発生した計算イベントは以後 last_seen_at を進めない(ADR-0209 §7)
        deleted:
          type: object
          description: この呼び出しで消した行数(冪等なので2回目は 0 になる)
          required: [teams, teamMembers]
          properties:
            teams: { type: integer, minimum: 0 }
            teamMembers: { type: integer, minimum: 0 }
