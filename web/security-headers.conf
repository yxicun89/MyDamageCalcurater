# issue #219: 外部公開(Tailscale・クラウド)でも、埋め込み・スクリプト注入・参照元漏えいを既定で防ぐヘッダ。
# nginx は location に add_header が1つでもあると server の分を継承しないので、このファイルを各 location から
# include する(web/Dockerfile が /etc/nginx/security-headers.conf へ置く)。
#
# CSP: ビルド成果物はインライン script/style を持たない(React の style 属性は CSSOM 経由で CSP の対象外)。
# WASM の実体化にだけ 'wasm-unsafe-eval' が要る(eval は許さない)。API は同じオリジン(gateway が / と /api を配る。
# requirements.md §4)なので connect-src は 'self'。VITE_API_BASE_URL で別オリジンの API を指す構成にするときは、
# ここの connect-src にそのオリジンを足す。
# HSTS は TLS 終端(Tailscale・クラウド)の持ち物なのでここでは付けない。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# frame-ancestors を解さない古いブラウザ向け。
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
