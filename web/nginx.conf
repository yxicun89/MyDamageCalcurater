# P4-11: nginx の配信設定(web/Dockerfile の最終段が /etc/nginx/conf.d/default.conf として使う)。
# pid・一時ファイルは基底イメージ(nginxinc/nginx-unprivileged)の /etc/nginx/nginx.conf が既に /tmp 配下に
# しているので、ここでは触らない(readOnlyRootFilesystem + emptyDir(/tmp)。deploy/k8s/base/web/deployment.yaml)。
#
# ADR-0300 §1(URL で画面を切り替える → 未知のパスは index.html にフォールバック)、
# ADR-0011 §6・§11(engine.wasm は application/wasm)。
# /api は gateway の持ち物なので、ここでは転送せず 404 のままにする(index.html で代用しない。DECISIONS.md 2026-09-22)。

# .wasm の MIME を明示する(instantiateStreaming の条件なので、基底イメージの mime.types の中身に頼らない)。
# 基底イメージも同じ対応を持つため、起動時に duplicate extension "wasm" の warn が出るのは既知で無害。
# http コンテキスト(この位置)に置く: server{} の中に types{} を置くと、他の拡張子のマッピングが丸ごと消える。
types {
    application/wasm wasm;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # バージョンを応答に出さない。
    server_tokens off;

    gzip on;
    # 途中のキャッシュ(gateway の後ろ)が gzip を受けないクライアントに gzip 版を返さないよう Vary を付ける。
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # gateway の持ち物。ここでは転送も index.html での代用もしない。
    # /api と /api/... だけ(/apiary のような別のパスは巻き込まない)。
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }

    # k8s の readiness/liveness probe(deploy/k8s/base/web/deployment.yaml)。
    location = /healthz {
        return 200 "ok\n";
    }

    # vite build が出すハッシュ付きファイル。無ければ index.html で代用せず 404 にする
    # (JS の代わりに HTML が返って壊れるのを防ぐ)。ハッシュ付きなので長く・immutable でキャッシュしてよい。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ハッシュを持たないので、古い版を掴み続けないよう毎回確かめさせる。
    location = /engine.wasm {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /wasm_exec.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # add_header は location に1つでもあると server の分を継承しないので、X-Content-Type-Options は各 location に書く。
    # SPA のフォールバック。index.html もハッシュを持たないので毎回確かめさせる。
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
